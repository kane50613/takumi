[package]
name = "takumi-bindings-common"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# This dependency selects the WASM codec table policy through feature unification.
[package.metadata.cargo-machete]
ignored = ["crc32fast"]

[dependencies]
serde.workspace = true
serde_bytes.workspace = true

[dependencies.takumi-core]
path = "../takumi-core"
default-features = false
features = ["woff2"]

[target.'cfg(target_arch = "wasm32")'.dependencies.crc32fast]
workspace = true
features = ["wasm-runtime-tables"]

[lints]
workspace = true

[features]
default = ["svg"]
svg = ["takumi-core/svg"]

[dev-dependencies.wuff]
workspace = true
features = ["brotli"]
