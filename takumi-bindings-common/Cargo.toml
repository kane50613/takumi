[package]
name = "takumi-bindings-common"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
arc-swap.workspace = true
serde.workspace = true
serde_bytes.workspace = true

[dependencies.serde_json]
workspace = true
features = ["float_roundtrip"]

[dependencies.takumi-core]
path = "../takumi-core"
default-features = false
features = ["woff2"]

[dependencies.takumi-html]
path = "../takumi-html"
optional = true

[dependencies.takumi-raster]
path = "../takumi-raster"
default-features = false
optional = true

[dependencies.takumi-svg]
path = "../takumi-svg"
optional = true

[dependencies.js-sys]
workspace = true
optional = true

[dependencies.serde-wasm-bindgen]
workspace = true
optional = true

[dependencies.wasm-bindgen]
workspace = true
optional = true

[lints]
workspace = true

[features]
default = ["svg"]
svg = ["takumi-core/svg", "takumi-html?/svg"]
# A wasm binding's source: a node tree, `{ json }` text, or HTML.
wasm = ["dep:takumi-html", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]
# Options for the bindings that render images.
raster = ["dep:takumi-raster", "dep:takumi-svg"]

[dev-dependencies.wuff]
workspace = true
features = ["brotli"]
