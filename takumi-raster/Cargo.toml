[package]
name = "takumi-raster"
version = "0.4.11"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Raster (tiny-skia) painting backend for takumi."
repository = "https://github.com/kane50613/takumi"
readme = "README.md"
rust-version = "1.91"

[dependencies]
png.workspace = true
gif.workspace = true
color.workspace = true
tiny-skia.workspace = true
typed-builder.workspace = true
smallvec.workspace = true
skrifa.workspace = true
xxhash-rust.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
image-webp.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libwebp-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.bytemuck]
workspace = true
features = ["wasm_simd"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bytemuck]
workspace = true
features = ["aarch64_simd", "avx512_simd"]

[dependencies.takumi-core]
path = "../takumi-core"
version = "0.16.0"
default-features = false

[dependencies.serde]
workspace = true
features = ["rc"]

[dependencies.image]
workspace = true
features = ["jpeg", "png", "webp", "gif", "ico"]

[dependencies.rayon]
workspace = true
optional = true

[features]
default = ["svg", "rayon"]
svg = ["takumi-core/svg"]
rayon = ["dep:rayon"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


