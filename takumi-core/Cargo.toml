[package]
name = "takumi-core"
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Backend-agnostic layout, style, and resource core for takumi."
repository = "https://github.com/kane50613/takumi"
readme = "README.md"
rust-version = "1.91"

# `serde_bytes` is used via `#[serde(with = "serde_bytes")]`, which cargo-machete can't see.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
png.workspace = true
data-url.workspace = true
color.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
typed-builder.workspace = true
skrifa.workspace = true
xxhash-rust.workspace = true
quick_cache.workspace = true
smallvec.workspace = true
parley.workspace = true
taffy.workspace = true
bitflags.workspace = true
cssparser.workspace = true
kurbo.workspace = true
paste.workspace = true
phf.workspace = true
precomputed-hash.workspace = true
selectors.workspace = true

[dependencies.gif]
workspace = true
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.image-webp]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.libwebp-sys]
workspace = true
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.bytemuck]
workspace = true
features = ["wasm_simd"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bytemuck]
workspace = true
features = ["aarch64_simd", "avx512_simd"]

[dependencies.serde]
workspace = true
features = ["rc"]

[dependencies.image]
workspace = true
features = ["png", "ico"]

[dependencies.roxmltree]
workspace = true
optional = true

[dependencies.svgtypes]
workspace = true
optional = true

[dependencies.simplecss]
workspace = true
optional = true

[dependencies.siphasher]
workspace = true
optional = true

[dependencies.strict-num]
workspace = true
optional = true

[dependencies.log]
workspace = true
optional = true

[dependencies.rgb]
workspace = true
optional = true

[dependencies.tiny-skia-path]
workspace = true
optional = true

[dependencies.wuff]
workspace = true
optional = true

[features]
default = ["woff2", "woff", "svg", "image-decoding"]
image-decoding = [
  "dep:gif",
  "dep:image-webp",
  "dep:libwebp-sys",
  "image/jpeg",
  "image/webp",
  "image/gif",
]
svg = [
  "dep:roxmltree",
  "dep:svgtypes",
  "dep:simplecss",
  "dep:siphasher",
  "dep:strict-num",
  "dep:log",
  "dep:rgb",
  "dep:tiny-skia-path",
]
woff2 = ["dep:wuff", "wuff/brotli"]
woff = ["dep:wuff", "wuff/z"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


