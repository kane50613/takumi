[package]
name = "takumi-core"
version = "0.33.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Backend-agnostic layout, style, and resource core for takumi."
repository = "https://github.com/kane50613/takumi"
readme = "README.md"
rust-version = "1.91"

# `serde_bytes` is used via `#[serde(with = "serde_bytes")]`, which cargo-machete can't see.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
log.workspace = true
data-url.workspace = true
color.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
typed-builder.workspace = true
skrifa.workspace = true
xxhash-rust.workspace = true
quick_cache.workspace = true
smallvec.workspace = true
bitflags.workspace = true
cssparser.workspace = true
kurbo.workspace = true
pastey.workspace = true
phf.workspace = true
precomputed-hash.workspace = true
selectors.workspace = true
thin-vec.workspace = true
rustc-hash.workspace = true

[dependencies.gif]
workspace = true
optional = true

[dependencies.image-webp]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.libwebp-sys]
workspace = true
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.bytemuck]
workspace = true
features = ["wasm_simd", "derive"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bytemuck]
workspace = true
features = ["aarch64_simd", "avx512_simd", "derive"]

[dependencies.serde]
workspace = true
features = ["rc"]

[dependencies.imagesize]
workspace = true
features = ["png", "jpeg", "webp", "gif"]

[dependencies.png]
workspace = true
optional = true

[dependencies.zune-jpeg]
workspace = true
optional = true

[dependencies.zune-core]
workspace = true
optional = true

[dependencies.rayon]
workspace = true
optional = true

[dependencies.roxmltree]
workspace = true
optional = true

[dependencies.svgtypes]
workspace = true
optional = true

[dependencies.siphasher]
workspace = true
optional = true

[dependencies.strict-num]
workspace = true
optional = true


[dependencies.tiny-skia-path]
workspace = true
optional = true

[dependencies.harfrust]
workspace = true

[dependencies.icu_casemap]
workspace = true

[dependencies.icu_locale_core]
workspace = true

[dependencies.icu_segmenter]
workspace = true

[dependencies.icu_properties]
workspace = true

[dependencies.unicode-bidi]
workspace = true

[dependencies.wuff]
workspace = true
optional = true

[features]
default = ["woff2", "woff", "svg-raster", "image-decoding"]
image-decoding = ["png", "jpeg", "webp", "gif"]
png = ["dep:png"]
jpeg = ["dep:zune-jpeg", "dep:zune-core"]
webp = ["dep:image-webp", "dep:libwebp-sys"]
gif = ["dep:gif"]
svg-sizing = ["dep:roxmltree", "dep:svgtypes"]
svg = ["svg-sizing", "dep:siphasher", "dep:strict-num", "dep:tiny-skia-path"]
# Rasterizing an SVG: resvg's filter pipeline and `SvgSource::rasterize_cached`. A backend that does not rasterize goes without.
svg-raster = ["svg"]
woff2 = ["dep:wuff", "wuff/brotli"]
woff = ["dep:wuff", "wuff/z"]
rayon = ["dep:rayon"]
# The paint tree: what the backends paint, as data. Off by default; `takumi-paint` turns it on.
paint-tree = []
# Blink's block fragmentation, which lays content out across pages. Off by default; `takumi-pdf`
# turns it on.
fragmentation = []

[dev-dependencies]
serde_json.workspace = true

[dev-dependencies.unicode-bidi]
workspace = true
features = ["hardcoded-data"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


