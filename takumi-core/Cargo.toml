[package]
name = "takumi-core"
version = "0.23.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Backend-agnostic layout, style, and resource core for takumi."
repository = "https://github.com/kane50613/takumi"
readme = "README.md"
rust-version = "1.91"

# `serde_bytes` is used via `#[serde(with = "serde_bytes")]`, which cargo-machete can't see.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
png.workspace = true
log.workspace = true
imagesize.workspace = true
data-url.workspace = true
color.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
typed-builder.workspace = true
skrifa.workspace = true
xxhash-rust.workspace = true
quick_cache.workspace = true
smallvec.workspace = true
parley.workspace = true
taffy.workspace = true
bitflags.workspace = true
cssparser.workspace = true
kurbo.workspace = true
pastey.workspace = true
phf.workspace = true
precomputed-hash.workspace = true
selectors.workspace = true

[dependencies.gif]
workspace = true
optional = true

[dependencies.image-webp]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.libwebp-sys]
workspace = true
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.bytemuck]
workspace = true
features = ["wasm_simd", "derive"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bytemuck]
workspace = true
features = ["aarch64_simd", "avx512_simd", "derive"]

[dependencies.serde]
workspace = true
features = ["rc"]

[dependencies.image]
workspace = true
features = ["png", "ico"]

[dependencies.roxmltree]
workspace = true
optional = true

[dependencies.svgtypes]
workspace = true
optional = true

[dependencies.simplecss]
workspace = true
optional = true

[dependencies.siphasher]
workspace = true
optional = true

[dependencies.strict-num]
workspace = true
optional = true


[dependencies.tiny-skia-path]
workspace = true
optional = true

[dependencies.harfrust]
workspace = true
optional = true

[dependencies.icu_properties]
version = "2.1.2"
default-features = false
features = ["compiled_data"]
optional = true

[dependencies.unicode-bidi]
workspace = true
optional = true

[dependencies.xmlwriter]
workspace = true
optional = true

[dependencies.wuff]
workspace = true
optional = true

[features]
default = ["woff2", "woff", "svg", "image-decoding"]
image-decoding = ["jpeg", "webp", "gif"]
jpeg = ["image/jpeg"]
webp = ["dep:image-webp", "dep:libwebp-sys", "image/webp"]
gif = ["dep:gif", "image/gif"]
svg = [
  "dep:roxmltree",
  "dep:svgtypes",
  "dep:simplecss",
  "dep:siphasher",
  "dep:strict-num",
  "dep:tiny-skia-path",
  "dep:harfrust",
  "dep:icu_properties",
  "dep:unicode-bidi",
  "dep:xmlwriter",
]
woff2 = ["dep:wuff", "wuff/brotli"]
woff = ["dep:wuff", "wuff/z"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


