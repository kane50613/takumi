[package]
name = "takumi-core"
version = "0.1.0-rc.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Backend-agnostic layout, style, and resource core for takumi."
repository = "https://github.com/kane50613/takumi"
readme = "README.md"
rust-version = "1.91"

# `serde_bytes` is used via `#[serde(with = "serde_bytes")]`, which cargo-machete can't see.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
cssparser.workspace = true
png.workspace = true
gif.workspace = true
data-url.workspace = true
color.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
typed-builder.workspace = true
selectors.workspace = true
skrifa.workspace = true
xxhash-rust.workspace = true
quick_cache.workspace = true
smallvec.workspace = true
parley.workspace = true
taffy.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
image-webp.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libwebp-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.bytemuck]
workspace = true
features = ["wasm_simd"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bytemuck]
workspace = true
features = ["aarch64_simd", "avx512_simd"]

[dependencies.takumi-css]
path = "../takumi-css"
version = "0.2.0-rc.0"

[dependencies.serde]
workspace = true
features = ["rc"]

[dependencies.image]
workspace = true
features = ["jpeg", "png", "webp", "gif", "ico"]

[dependencies.resvg]
workspace = true
optional = true

[dependencies.roxmltree]
workspace = true
optional = true

[dependencies.wuff]
workspace = true
optional = true

[features]
default = ["woff2", "woff", "svg"]
svg = ["dep:resvg", "dep:roxmltree"]
woff2 = ["dep:wuff", "wuff/brotli"]
woff = ["dep:wuff", "wuff/z"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true


