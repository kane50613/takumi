[package]
name = "takumi-pdf"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vector PDF output backend for takumi. Emits selectable, searchable text with embedded subset fonts via krilla."
repository = "https://github.com/kane50613/takumi"
rust-version = "1.91"
publish = false

[features]
default = ["images", "svg"]
images = ["krilla/raster-images"]
svg = ["takumi-core/svg"]

[dependencies]
typed-builder.workspace = true

[dependencies.krilla]
version = "0.8"
default-features = false

[dependencies.takumi-core]
path = "../takumi-core"
default-features = false
features = ["woff2"]

[lints]
workspace = true

[dev-dependencies.takumi-html]
path = "../takumi-html"
