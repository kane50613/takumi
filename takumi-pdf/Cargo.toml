[package]
name = "takumi-pdf"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vector PDF output backend for takumi. Emits selectable, searchable text with embedded subset fonts."
repository = "https://github.com/kane50613/takumi"
rust-version = "1.91"
publish = false

[features]
default = ["images", "svg"]
images = ["raster-images"]
raster-images = ["dep:png", "dep:zune-jpeg", "dep:gif", "dep:image-webp", "dep:imagesize"]
svg = ["takumi-core/svg"]

[dependencies]
typed-builder.workspace = true
base64 = "0.22"
bumpalo = "3.16"
flate2 = "1.1"
float-cmp = "0.9"
gif = { version = "0.14", optional = true }
image-webp = { version = "0.2", optional = true }
imagesize = { version = "0.14", optional = true }
indexmap = "2.10"
pdf-writer = "0.15"
png = { version = "0.18", optional = true }
rustc-hash = "2.1"
smallvec = { version = "1.15", features = ["union", "const_new", "write"] }
siphasher = "1.0"
skrifa.workspace = true
kurbo = "0.13"
write-fonts = "0.49"
tiny-skia-path = "0.12"
xmp-writer = "0.3"
yoke = "0.8"
zune-jpeg = { version = "0.5", optional = true }

[dependencies.takumi-core]
path = "../takumi-core"
default-features = false
features = ["woff2"]

[lints]
workspace = true

[dev-dependencies.takumi-html]
path = "../takumi-html"

[dev-dependencies]
pretty_assertions = "1"
