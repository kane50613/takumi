[package]
name = "takumi-wasm"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
base64.workspace = true
js-sys.workspace = true

[dependencies.takumi-bindings-common]
path = "../takumi-bindings-common"

[dependencies.serde]
workspace = true
features = ["rc"]

[dependencies.takumi-core]
path = "../takumi-core"
default-features = false
features = ["woff2", "svg-raster", "image-decoding"]

[dependencies.takumi-raster]
path = "../takumi-raster"
default-features = false
features = ["svg"]

[dependencies.takumi-html]
path = "../takumi-html"
features = ["svg"]

[dependencies.takumi-svg]
path = "../takumi-svg"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true


