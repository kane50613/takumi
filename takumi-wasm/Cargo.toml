[package]
name = "takumi-wasm"
version = "0.0.3"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
base64.workspace = true
serde_bytes.workspace = true
js-sys.workspace = true
parley.workspace = true

[dependencies.serde]
workspace = true
features = ["rc"]

[dependencies.takumi-core]
path = "../takumi-core"
default-features = false
features = ["woff2", "svg"]

[dependencies.takumi-raster]
path = "../takumi-raster"
default-features = false
features = ["svg"]

[dependencies.takumi-svg]
path = "../takumi-svg"
version = "0.1.0-beta.3"

# https://github.com/rust-lang/rust/issues/93294
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  '-Oz',
  '--converge',
  '--code-folding',
  '--all-features',
  '--strip-debug',
  '--strip-dwarf',
  '--strip-producers',
  '--strip-target-features',
]

[lints]
workspace = true
