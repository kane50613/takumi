[package]
name = "takumi-wasm"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
base64 = "0.22"
serde_bytes = "0.11"
js-sys = "0.3"

[dependencies.parley]
version = "0.8"
default-features = false
features = ["libm"]

[dependencies.serde]
version = "1.0"
features = ["derive", "rc"]

[dependencies.takumi]
path = "../takumi"
features = ["woff2", "svg"]
default-features = false

# https://github.com/rust-lang/rust/issues/93294
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  '-O4',
  '--all-features',
  '--strip-debug',
  '--strip-dwarf',
  '--strip-producers',
  '--strip-target-features',
]
