name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  # Remove file paths to reduce binary size
  RUSTFLAGS: >-
    --remap-path-prefix=/home/runner=~
    --remap-path-prefix=/Users/runner=~
    --remap-path-prefix=/root=~
    --remap-path-prefix=$HOME/.cargo/registry=~/.cargo/registry
    --remap-path-prefix=$HOME/.rustup=~/.rustup

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs are grouped by package
jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun lint

      - run: bun typecheck

      - run: bun knip

  test-rust:
    name: Rust Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          binstall: cargo-audit,cargo-llvm-cov,cargo-rdme@1.5.1,cargo-machete
          components: rustfmt,clippy
          stage: test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check unused dependencies
        run: cargo machete

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test README.md is up to date
        run: |
          fail=0
          while read -r dir; do
            (cd "$dir" && cargo rdme --check) || fail=1
          done < <(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.publish != []) | select(any(.targets[]; .kind | index("lib"))) | .manifest_path | rtrimstr("/Cargo.toml")')
          exit $fail

      - name: Run tests
        run: CARGO_PROFILE_TEST_STRIP="debuginfo" cargo test

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Format generated fixtures
        run: bunx oxfmt --write takumi/tests/fixtures-generated

      - name: Check for git changes and prepare artifact
        id: check_changes
        run: |
          if git diff --quiet HEAD; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git diff --name-only HEAD > changed_files.txt
            tar czf changed_files.tar.gz $(cat changed_files.txt)
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload changed files artifact
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-files
          path: changed_files.tar.gz
          if-no-files-found: error

      - name: Fail if files were changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "Error: Generated files were modified during build:"
          echo ""
          cat changed_files.txt
          exit 1

      - name: Run security audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cargo audit

      - name: Test Publish (--dry-run)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cargo publish --dry-run --workspace

  build-helpers:
    name: Build @takumi-rs/helpers
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-helpers

      - name: Test
        working-directory: takumi-helpers
        run: bun test

      - name: Build helpers
        working-directory: takumi-helpers
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist
          if-no-files-found: error

  build-and-test-napi:
    needs: build-helpers
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            build: bun run build --target x86_64-pc-windows-msvc
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            build: bun run build --target aarch64-pc-windows-msvc
          - host: macos-15
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: bun run build --target x86_64-apple-darwin
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build: bun run build --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            build: bun run build --target aarch64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # --use-napi-cross is required to pin libc version at 2.31 (from cross-rs docs)
            build: bun run build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: bun run build --target x86_64-unknown-linux-musl -x

    name: Build @takumi-rs/core for ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          # pinned: newer nightlies emit --fix-cortex-a53-843419 which zig rejects (cargo-zigbuild#451)
          toolchain: nightly-2026-06-04
          targets: ${{ matrix.settings.target }}
          components: rust-src
          stage: build

      - name: Install cargo-zigbuild
        if: ${{ contains(matrix.settings.target, 'musl') }}
        run: pip install cargo-zigbuild

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-napi

      - name: Build
        working-directory: takumi-napi
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
          CARGO_UNSTABLE_BUILD_STD_FEATURES: optimize_for_size
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Zunstable-options -Cpanic=immediate-abort
        run: ${{ matrix.settings.build }} && bun build:js

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            takumi-napi/dist
            takumi-napi/core.*.node
            takumi-napi/index.js
            takumi-napi/index.d.ts
          if-no-files-found: error

      - name: Test bindings
        if: ${{ !contains(matrix.settings.target, 'musl') }}
        working-directory: takumi-napi
        run: bun test

      - name: Test bindings in Alpine (musl)
        if: contains(matrix.settings.target, 'musl')
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace/takumi-napi \
            oven/bun:alpine bun test

  build-js:
    name: Build takumi-js
    runs-on: ubuntu-slim
    needs: [build-helpers, build-and-test-napi, build-wasm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-js

      - name: Build takumi-js
        working-directory: takumi-js
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-dist
          path: takumi-js/dist
          if-no-files-found: error

  test-js:
    name: Test takumi-js, templates & examples
    runs-on: ubuntu-slim
    needs: [build-helpers, build-js, build-and-test-napi, build-wasm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Download takumi-js artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-dist
          path: takumi-js/dist

      - name: Install dependencies
        run: >
          bun install --frozen-lockfile
          --filter ./takumi-js
          --filter ./takumi-template
          --filter ./example/cloudflare-workers
          --filter ./example/tanstack-start
          --filter ./example/waku-ssr

      - name: Test takumi-js
        working-directory: takumi-js
        run: bun test

      - name: Test template
        working-directory: takumi-template
        run: bun test

      - name: Test cloudflare-workers example
        working-directory: example/cloudflare-workers
        run: bun run test

      - name: Test tanstack-start example
        working-directory: example/tanstack-start
        run: bun run test

      - name: Test waku-ssr example
        working-directory: example/waku-ssr
        run: bun run test

  build-image-response:
    name: Build @takumi-rs/image-response
    runs-on: ubuntu-slim
    needs: [build-helpers, build-js, build-and-test-napi, build-wasm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Download takumi-js artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-dist
          path: takumi-js/dist

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-image-response

      - name: Build image-response
        working-directory: takumi-image-response
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-response-dist
          path: takumi-image-response/dist
          if-no-files-found: error

  check-packaging:
    name: Check packaging (attw + publint)
    runs-on: ubuntu-slim
    needs: [build-helpers, build-js, build-and-test-napi, build-wasm, build-image-response]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download takumi-js artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-dist
          path: takumi-js/dist

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Download image-response artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-response-dist
          path: takumi-image-response/dist

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check exports with attw and publint
        run: bun publish-lint

  build-wasm:
    name: Build @takumi-rs/wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          # pinned to match build-and-test-napi (see comment there)
          toolchain: nightly-2026-06-04
          targets: wasm32-unknown-unknown
          components: rust-src
          stage: build

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-wasm

      - name: Build WASM
        working-directory: takumi-wasm
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
          CARGO_UNSTABLE_BUILD_STD_FEATURES: optimize_for_size
          # setting RUSTFLAGS overrides .cargo/config.toml target rustflags, so
          # +simd128 must be repeated here or the published wasm loses SIMD
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Zunstable-options -Cpanic=immediate-abort -Ctarget-feature=+simd128
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-package
          path: |
            takumi-wasm/pkg/takumi_wasm.d.ts
            takumi-wasm/pkg/takumi_wasm.js
            takumi-wasm/pkg/takumi_wasm_bg.wasm
            takumi-wasm/pkg/takumi_wasm_bg.wasm.d.ts
            takumi-wasm/dist
          if-no-files-found: error

  test-wasm:
    name: Test @takumi-rs/wasm for ${{ matrix.settings.target }}
    needs: [build-wasm, build-helpers]
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-2025
            target: x86_64-pc-windows-msvc
          # - host: windows-11-arm # disable cuz it keeps failing since bun poor support on this target
          #   target: aarch64-pc-windows-msvc
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: macos-15
            target: aarch64-apple-darwin
          - host: ubuntu-slim
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./takumi-wasm

      - name: Test WASM
        working-directory: takumi-wasm
        run: bun test

  preview-packages:
    name: Publish PR preview packages
    runs-on: ubuntu-slim
    needs: pass-test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download all N-API artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bindings-*
          path: takumi-napi/artifacts

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download takumi-js artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-dist
          path: takumi-js/dist

      - name: Download image-response artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-response-dist
          path: takumi-image-response/dist

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Publish PR previews
        run: >
          bunx pkg-pr-new@latest publish
          --packageManager=bun
          ./takumi-helpers
          ./takumi-napi
          ./takumi-wasm
          ./takumi-js
          ./takumi-image-response

  pass-test:
    name: Pass Test
    runs-on: ubuntu-slim
    if: always()
    needs:
      [
        lint-and-format,
        test-rust,
        test-js,
        build-image-response,
        check-packaging,
        build-and-test-napi,
        test-wasm,
      ]
    steps:
      - name: Verify all checks passed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1

  version-pr:
    name: Version PR
    runs-on: ubuntu-slim
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          stage: release

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Draft version PR
        run: bun tegami version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEFTHOOK: "0"

  publish:
    name: Publish
    runs-on: ubuntu-slim
    needs: pass-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          stage: release

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download all napi artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bindings-*
          path: takumi-napi/artifacts

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download takumi-js artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-dist
          path: takumi-js/dist

      - name: Download image-response artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-response-dist
          path: takumi-image-response/dist

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Install dependencies
        run: bun install --frozen-lockfile && echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      # Trusted publishing requires npm 11.5.1; npm 12 breaks it.
      - name: Update npm version
        run: bun install -g npm@11

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-io-auth

      - name: Publish packages
        run: bun tegami publish && bun tegami cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
          NPM_CONFIG_PROVENANCE: true

  deploy-docs:
    name: Deploy docs
    runs-on: ubuntu-slim
    needs: pass-test
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download helpers artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist

      - name: Download N-API bindings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: takumi-napi

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm

      - name: Download js-dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-dist
          path: takumi-js/dist

      - name: Download image-response artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-response-dist
          path: takumi-image-response/dist

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./docs

      - name: Pull Vercel project settings (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bunx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bunx vercel build --token=${{ secrets.VERCEL_TOKEN }} && rm -rf .vercel/output/functions

      - name: Deploy to Vercel (preview)
        id: deploy_preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          DEPLOYMENT_URL=$(bunx vercel deploy --archive=tgz --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Assign alias (preview)
        id: assign_alias
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          REF_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SAFE_REF=$(echo "${REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9-]+#-#g; s/^-+//; s/-+$//; s/-{2,}/-/g')
          # Keep the full alias under the 64-char TLS common-name limit (".preview.takumi.kane.tw" is 23 chars).
          SAFE_REF=${SAFE_REF:0:40}
          SAFE_REF=$(echo "${SAFE_REF}" | sed -E 's/-+$//')
          if [ -z "${SAFE_REF}" ]; then
            SAFE_REF="preview"
          fi

          PREVIEW_ALIAS="${SAFE_REF}.preview.takumi.kane.tw"
          bunx vercel alias set ${{ steps.deploy_preview.outputs.url }} "${PREVIEW_ALIAS}" --token=${{ secrets.VERCEL_TOKEN }}
          echo "alias=${PREVIEW_ALIAS}" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.info("No pull request number in event payload");
              return;
            }
            const marker = "<!-- docs-preview-url -->";
            const previewUrl = `https://${{ steps.assign_alias.outputs.alias }}`;
            const body = `${marker}\nDocs preview is ready: ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated preview comment on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created preview comment on PR #${prNumber}`);
            }

      - name: Pull Vercel project settings (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} && rm -rf .vercel/output/functions

      - name: Deploy to Vercel (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bunx vercel deploy --archive=tgz --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
