name: Setup Bun
description: Setup Bun

# No install cache: restoring it took 60-90s on ubuntu-slim, while a cold `bun install` takes seconds.
runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4"
