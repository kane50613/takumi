<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>filter_blur_inside_overflow_clip</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 400px; height: 220px">
    <div
      style="
        display: flex;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 40px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          display: block;
          width: 140px;
          height: 140px;
          overflow: hidden;
          background-color: rgb(226, 232, 240);
        "
      >
        <div
          style="
            display: block;
            width: 100px;
            height: 100px;
            margin: 20px;
            background-color: rgb(37, 99, 235);
            filter: blur(24px);
          "
        ></div>
      </div>
      <div
        style="
          display: block;
          width: 140px;
          height: 140px;
          overflow: hidden;
          border-radius: 32px;
          background-color: rgb(226, 232, 240);
        "
      >
        <div
          style="
            display: block;
            width: 100px;
            height: 100px;
            margin: 20px;
            background-color: rgb(220, 38, 38);
            opacity: 0.6;
            filter: blur(16px);
          "
        ></div>
      </div>
    </div>
  </body>
</html>
