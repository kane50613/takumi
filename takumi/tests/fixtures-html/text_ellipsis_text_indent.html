<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_ellipsis_text_indent</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .line {
        display: block;
        width: 600px;
        font-size: 40px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-indent: 120px;
      }
      .sibling {
        height: 16px;
        background-color: rgb(251, 191, 36);
      }
    </style>
  </head>
  <body style="width: 640px; height: 360px">
    <div
      style="
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        color: rgb(15, 23, 42);
      "
    >
      <div class="line" style="background-color: rgb(224, 231, 255)"
        >The quick brown fox jumps over the lazy dog</div
      >
      <div class="sibling"></div>
      <div class="line" style="background-color: rgb(254, 226, 226)">Quarterly revenue report 2026</div>
      <div class="sibling"></div>
      <div
        class="line"
        style="background-color: rgb(220, 252, 231); white-space: normal; text-fit: shrink 80%; line-clamp: 1"
        >Wolfeschlegelsteinhausenbergerdorff</div
      >
      <div class="sibling"></div>
    </div>
  </body>
</html>
