<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>line_clamp_flex_container</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .cell {
        width: 340px;
        line-height: 1.25;
        background-color: rgb(220, 252, 231);
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        gap: 24px;
        align-items: flex-start;
        width: 100%;
        height: 100%;
        padding: 24px;
        font-size: 32px;
        background-color: white;
      "
    >
      <div class="cell" style="display: flex; line-clamp: 2">
        The quick brown fox jumps over the lazy dog and keeps running far away
      </div>
      <div class="cell" style="display: grid; line-clamp: 2">
        The quick brown fox jumps over the lazy dog and keeps running far away
      </div>
      <div class="cell" style="display: flex">
        <div style="line-clamp: 2"
          >The quick brown fox jumps over the lazy dog and keeps running far away</div
        >
      </div>
    </div>
  </body>
</html>
