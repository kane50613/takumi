<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .row {
        display: flex;
        width: 420px;
        align-items: flex-start;
        background-color: rgb(226, 232, 240);
      }
      .box {
        display: block;
        padding: 6px;
        background-color: rgb(191, 219, 254);
        font-size: 18px;
      }
    </style>
  </head>
  <body style="width: 480px; height: 520px">
    <div
      style="
        display: flex;
        flex-direction: column;
        row-gap: 10px;
        width: 100%;
        height: 100%;
        padding: 16px;
        background-color: rgb(248, 250, 252);
        font-size: 13px;
      "
    >
      <div>width: min-content</div>
      <div class="row">
        <div class="box" style="width: min-content">alpha beta gamma</div>
      </div>
      <div>width: max-content</div>
      <div class="row">
        <div class="box" style="width: max-content">alpha beta gamma</div>
      </div>
      <div>width: fit-content(140px)</div>
      <div class="row">
        <div class="box" style="width: fit-content(140px)">alpha beta gamma</div>
      </div>
      <div>width: stretch</div>
      <div class="row">
        <div class="box" style="width: stretch">alpha beta gamma</div>
      </div>
      <div>flex-basis: content</div>
      <div class="row">
        <div class="box" style="width: 40px; flex-basis: content; flex-grow: 0; flex-shrink: 0">
          alpha beta
        </div>
      </div>
    </div>
  </body>
</html>
