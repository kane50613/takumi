<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clip_mask_overflow_together</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 80px;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          display: flex;
          width: 360px;
          height: 360px;
          padding: 40px;
          border-radius: 80px;
          overflow: hidden;
          background-color: rgb(219, 234, 254);
          clip-path: polygon(0 0, 100% 0, 100% 70%, 0 100%);
        "
      >
        <div
          style="width: 520px; height: 520px; margin: -60px; background-color: rgb(37, 99, 235)"
        ></div>
      </div>
      <div
        style="
          display: flex;
          width: 360px;
          height: 360px;
          padding: 40px;
          border-radius: 80px;
          overflow: hidden;
          background-color: rgb(254, 226, 226);
          mask-image: linear-gradient(90deg, black, transparent);
        "
      >
        <div
          style="width: 520px; height: 520px; margin: -60px; background-color: rgb(225, 29, 72)"
        ></div>
      </div>
    </div>
  </body>
</html>
