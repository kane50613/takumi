<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>outline_block_corners</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .box {
        width: 120px;
        height: 80px;
        background-color: rgb(226, 232, 240);
      }
    </style>
  </head>
  <body style="width: 640px; height: 200px">
    <div
      style="
        display: flex;
        gap: 48px;
        width: 100%;
        height: 100%;
        padding: 56px 40px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div class="box" style="outline: 6px solid rgb(37, 99, 235); outline-offset: 4px"></div>
      <div class="box" style="outline: 8px groove rgb(100, 116, 139)"></div>
      <div
        class="box"
        style="border-radius: 16px; outline: 6px solid rgb(225, 29, 72); outline-offset: 4px"
      ></div>
    </div>
  </body>
</html>
