<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>media_query_features</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .row {
        display: flex;
        flex-direction: row;
        gap: 20px;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-size: 28px;
      }
      .box {
        display: flex;
        width: 240px;
        height: 120px;
        align-items: center;
        justify-content: center;
        background-color: rgb(200, 200, 200);
      }
      @media (resolution: 1x) {
        .dpr {
          background-color: rgb(120, 200, 120);
        }
      }
      @media (aspect-ratio >= 2/1) {
        .wide-ratio {
          background-color: rgb(120, 200, 120);
        }
      }
      @media (aspect-ratio < 1/1) {
        .tall-ratio {
          background-color: rgb(220, 120, 120);
        }
      }
    </style>
  </head>
  <body style="width: 800px; height: 200px">
    <div class="row">
      <div class="box dpr">1x</div>
      <div class="box wide-ratio">4:1</div>
      <div class="box tall-ratio">tall</div>
    </div>
  </body>
</html>
