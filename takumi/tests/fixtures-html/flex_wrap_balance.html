<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .row {
        display: flex;
        width: 300px;
        column-gap: 8px;
        row-gap: 8px;
        padding: 8px;
        background-color: rgb(226, 232, 240);
      }
      .item {
        width: 84px;
        height: 32px;
        background-color: rgb(37, 99, 235);
      }
    </style>
  </head>
  <body style="width: 400px; height: 460px">
    <div
      style="
        display: flex;
        flex-direction: column;
        row-gap: 8px;
        width: 100%;
        height: 100%;
        padding: 16px;
        background-color: rgb(248, 250, 252);
        font-size: 14px;
      "
    >
      <div>flex-wrap: wrap</div>
      <div class="row" style="flex-wrap: wrap">
        <div class="item"></div><div class="item"></div><div class="item"></div
        ><div class="item"></div>
      </div>
      <div>flex-wrap: wrap balance</div>
      <div class="row" style="flex-wrap: wrap balance">
        <div class="item"></div><div class="item"></div><div class="item"></div
        ><div class="item"></div>
      </div>
      <div>flex-wrap: wrap balance; flex-line-count: 3</div>
      <div class="row" style="flex-wrap: wrap balance; flex-line-count: 3">
        <div class="item"></div><div class="item"></div><div class="item"></div
        ><div class="item"></div>
      </div>
    </div>
  </body>
</html>
