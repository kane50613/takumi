<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_stacking_context_flex_item_z_index</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div style="display: flex; width: 100%; height: 100%; background-color: rgb(245, 245, 245)">
      <div
        style="
          display: flex;
          z-index: 2;
          width: 360px;
          height: 260px;
          background-color: rgba(255, 0, 0, 0.784314);
        "
      ></div>
      <div
        style="
          display: flex;
          z-index: 1;
          width: 360px;
          height: 260px;
          margin-left: -120px;
          background-color: rgba(0, 0, 255, 0.784314);
        "
      ></div>
    </div>
  </body>
</html>
