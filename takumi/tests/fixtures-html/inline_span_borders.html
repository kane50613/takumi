<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_span_borders</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 640px; height: 300px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 28px 32px;
        background-color: rgb(248, 250, 252);
        font-family: Geist;
        font-size: 26px;
        line-height: 2.2;
        color: rgb(15, 23, 42);
      "
    >
      <span style="border: 3px solid rgb(22, 163, 74)">solid</span>
      <span style="border: 3px dashed rgb(225, 29, 72); padding: 0 6px">dashed</span>
      <span style="border: 6px groove rgb(100, 116, 139)">groove</span>
      <span
        style="
          border: 2px solid rgb(37, 99, 235);
          border-radius: 8px;
          padding: 2px 8px;
          background-color: rgb(219, 234, 254);
        "
        >rounded</span
      >
      <span
        style="
          border-top: 2px solid rgb(147, 51, 234);
          border-bottom: 4px solid rgb(147, 51, 234);
          border-left: 6px solid rgb(234, 179, 8);
          border-right: 6px solid rgb(234, 179, 8);
          background-color: rgb(243, 232, 255);
        "
        >a bordered span that wraps across two lines</span
      >
      <span
        style="
          border: 2px solid rgb(22, 163, 74);
          border-radius: 50%;
          padding: 0 10px;
          background-color: rgb(220, 252, 231);
        "
        >pill</span
      >
    </div>
  </body>
</html>
