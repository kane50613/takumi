<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_span_margins</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .block {
        display: block;
        width: 520px;
        padding: 32px;
        font-family: Geist;
        font-size: 28px;
        line-height: 1.6;
        color: rgb(15, 23, 42);
        background-color: rgb(248, 250, 252);
      }
      .outer {
        background-color: rgb(191, 219, 254);
      }
      .spaced {
        margin: 0 24px;
        padding: 0 6px;
        background-color: rgb(253, 224, 71);
      }
    </style>
  </head>
  <body style="width: 600px; height: 300px">
    <div class="block">
      one<span class="spaced">two</span>three
      <span class="outer">four<span class="spaced">five six seven eight</span>nine</span>
    </div>
  </body>
</html>
