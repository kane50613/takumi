<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_mix_blend_mode_text_regression</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background-color: rgb(150, 119, 0);
      "
    >
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          row-gap: 24px;
        "
      >
        <span
          style="
            display: block;
            max-width: 500px;
            font-family: Geist;
            font-size: 60px;
            font-weight: 600;
            line-height: 48px;
            text-align: center;
            color: rgb(255, 255, 255);
            mix-blend-mode: plus-lighter;
          "
          >Plus Lighter</span
        ><span
          style="
            display: block;
            max-width: 500px;
            font-family: Geist;
            font-size: 60px;
            font-weight: 600;
            line-height: 48px;
            text-align: center;
            color: rgb(255, 255, 255);
            opacity: 0.1;
            mix-blend-mode: plus-lighter;
          "
          >Plus Lighter</span
        ><span
          style="
            display: block;
            max-width: 500px;
            font-family: Geist;
            font-size: 60px;
            font-weight: 600;
            line-height: 48px;
            text-align: center;
            color: rgb(255, 255, 255);
            mix-blend-mode: plus-darker;
          "
          >Plus Darker</span
        ><span
          style="
            display: block;
            max-width: 500px;
            font-family: Geist;
            font-size: 60px;
            font-weight: 600;
            line-height: 48px;
            text-align: center;
            color: rgb(0, 0, 0);
            opacity: 0.1;
            mix-blend-mode: plus-darker;
          "
          >Plus Darker</span
        >
      </div>
    </div>
  </body>
</html>
