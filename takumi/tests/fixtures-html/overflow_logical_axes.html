<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>overflow_logical_axes</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .box {
        display: inline-block;
        width: 160px;
        height: 120px;
        margin-right: 96px;
        vertical-align: top;
        border: 2px solid rgb(30, 41, 59);
        background-color: rgb(241, 245, 249);
      }
      .content {
        display: block;
        width: 280px;
        height: 220px;
        background-image: linear-gradient(135deg, rgb(56, 189, 248), rgb(244, 114, 182));
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div style="padding: 48px; background-color: rgb(255, 255, 255)"
      ><div class="box" style="overflow-inline: clip"><div class="content"></div></div
      ><div class="box" style="overflow-block: clip"><div class="content"></div></div
      ><div class="box"><div class="content"></div></div
    ></div>
  </body>
</html>
