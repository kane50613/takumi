<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_wrap_balance_alignment</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        background-color: rgb(255, 255, 255);
        font-size: 44px;
        line-height: 1.4;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: flex-end;
        row-gap: 24px;
        padding: 20px;
      "
    >
      <div
        dir="rtl"
        style="
          font-family: &quot;Scheherazade New Test&quot;;
          width: 720px;
          background-color: rgb(235, 245, 255);
        "
      >
        دليل الهوية لاستوديو فالنس — استخدام الشعار والألوان والطباعة وقواعد التطبيق.
      </div>
      <div
        dir="rtl"
        style="
          font-family: &quot;Scheherazade New Test&quot;;
          width: 720px;
          text-wrap-style: balance;
          background-color: rgb(235, 245, 255);
        "
      >
        دليل الهوية لاستوديو فالنس — استخدام الشعار والألوان والطباعة وقواعد التطبيق.
      </div>
      <div
        style="
          width: 720px;
          text-align: right;
          text-wrap-style: balance;
          background-color: rgb(255, 245, 235);
        "
      >
        Balanced lines keep aligning to the right edge of the container.
      </div>
      <div
        style="
          width: 720px;
          text-align: center;
          text-wrap-style: balance;
          background-color: rgb(245, 255, 235);
        "
      >
        Balanced lines keep centering inside the container width.
      </div>
    </div>
  </body>
</html>
