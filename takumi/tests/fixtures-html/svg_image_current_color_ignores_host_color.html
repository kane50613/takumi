<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>svg_image_current_color_ignores_host_color</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .host {
        display: flex;
        width: 100%;
        height: 100%;
        gap: 48px;
        justify-content: center;
        align-items: center;
        color: rgb(239, 68, 68);
        background-color: rgb(255, 255, 255);
      }
      .background {
        width: 96px;
        height: 96px;
        background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2296%22%20height%3D%2296%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22%20fill%3D%22currentColor%22/%3E%3C/svg%3E");
      }
    </style>
  </head>
  <body style="width: 400px; height: 200px">
    <div class="host"
      ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96">
        <circle cx="12" cy="12" r="10" fill="currentColor" /></svg
      ><img
        src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2296%22%20height%3D%2296%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22%20fill%3D%22currentColor%22/%3E%3C/svg%3E" /><div
        class="background"
      ></div
    ></div>
  </body>
</html>
