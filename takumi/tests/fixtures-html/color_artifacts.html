<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>color_artifacts</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(147, 197, 253);
        align-items: center;
        justify-content: center;
        flex-direction: row;
        row-gap: 40px;
        column-gap: 40px;
        padding-top: 4rem;
        padding-right: 4rem;
        padding-bottom: 4rem;
        padding-left: 4rem;
      "
    >
      <div
        style="
          display: flex;
          width: 640px;
          height: 440px;
          background-color: rgba(255, 255, 255, 0.376471);
          border-top-left-radius: 24px 24px;
          border-top-right-radius: 24px 24px;
          border-bottom-right-radius: 24px 24px;
          border-bottom-left-radius: 24px 24px;
          padding-top: 24px;
          padding-right: 24px;
          padding-bottom: 24px;
          padding-left: 24px;
        "
      >
        <img
          src="assets/images/luma-cover-0dfbf65d-0f58-4941-947c-d84a5b131dc0.jpeg"
          style="
            display: flex;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-top-left-radius: 10px 10px;
            border-top-right-radius: 10px 10px;
            border-bottom-right-radius: 10px 10px;
            border-bottom-left-radius: 10px 10px;
          "
        />
      </div>
      <div
        style="
          display: flex;
          height: 440px;
          background-color: rgba(255, 255, 255, 0.564706);
          align-items: center;
          justify-content: center;
          border-top-left-radius: 24px 24px;
          border-top-right-radius: 24px 24px;
          border-bottom-right-radius: 24px 24px;
          border-bottom-left-radius: 24px 24px;
        "
      >
        <img
          src="assets/images/luma-cover-0dfbf65d-0f58-4941-947c-d84a5b131dc0.jpeg"
          style="display: flex; width: 256px; height: 256px; object-fit: cover"
        />
      </div>
    </div>
  </body>
</html>
