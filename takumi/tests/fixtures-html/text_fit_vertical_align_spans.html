<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_vertical_align_spans</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 640px; height: 360px">
    <div
      style="
        display: flex;
        flex-direction: column;
        row-gap: 12px;
        width: 100%;
        height: 100%;
        padding-top: 16px;
        padding-right: 16px;
        padding-bottom: 16px;
        padding-left: 16px;
        background-color: rgb(246, 248, 251);
      "
    >
      <div
        style="
          display: block;
          font-size: 24px;
          line-height: 1.2;
          text-fit: grow;
          text-wrap-mode: nowrap;
          background-color: rgb(255, 255, 255);
        "
      >
        Hx<span style="vertical-align: super">sup</span>Hx<span style="vertical-align: sub"
          >sub</span
        >Hx<span style="vertical-align: text-top; font-size: 14px">top</span
        ><span style="background-color: rgb(191, 219, 254)">Hxgp</span>
      </div>
      <div
        style="
          display: block;
          font-size: 24px;
          line-height: 1.2;
          letter-spacing: 3px;
          text-fit: grow;
          text-wrap-mode: nowrap;
          background-color: rgb(255, 255, 255);
        "
      >
        Hx<span style="vertical-align: super">sup</span>Hx<span style="vertical-align: sub"
          >sub</span
        >Hx<span style="vertical-align: text-top; font-size: 14px">top</span
        ><span style="background-color: rgb(191, 219, 254)">Hxgp</span>
      </div>
      <div
        style="
          display: block;
          font-size: 48px;
          line-height: 1.2;
          text-fit: shrink;
          text-wrap-mode: nowrap;
          background-color: rgb(255, 255, 255);
        "
      >
        Hx<span style="vertical-align: super">sup</span>Hx<span style="vertical-align: sub"
          >sub</span
        >Hx<span style="vertical-align: text-top; font-size: 28px">top</span
        ><span style="background-color: rgb(191, 219, 254)">Hxgp</span> and more text here
      </div>
    </div>
  </body>
</html>
