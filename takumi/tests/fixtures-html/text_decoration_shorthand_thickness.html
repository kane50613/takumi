<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_decoration_shorthand_thickness</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 480px; height: 240px">
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        height: 100%;
        padding: 32px;
        background-color: rgb(255, 255, 255);
        font-size: 32px;
        color: rgb(15, 23, 42);
      "
    >
      <div style="text-decoration: underline 8px rgb(220, 38, 38); text-decoration-skip-ink: none"
        >underline 8px</div
      >
      <div style="text-decoration: line-through 6px rgb(37, 99, 235)">line-through 6px</div>
      <div style="text-decoration: underline overline 2px rgb(22, 163, 74)">both lines 2px</div>
    </div>
  </body>
</html>
