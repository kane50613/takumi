<!doctype html>
<html>
  <head>
    <style>
      .box {
        display: block;
        width: 100px;
        height: 100px;
        background: green;
        clip-path: polygon(0 0, 100px 0, 100px 30px, 30px 30px, 30px 100px, 0 100px);
        overflow: hidden;
      }
      .absolute {
        position: absolute;
        left: 40px;
        top: 50px;
        width: 100px;
        height: 100px;
        background: red;
        mix-blend-mode: multiply;
      }
      .fixed-clip {
        display: block;
        margin-left: 150px;
        width: 100px;
        height: 100px;
        clip-path: inset(0);
      }
      .fixed {
        position: fixed;
        left: 150px;
        top: 100px;
        width: 200px;
        height: 200px;
        background: green;
      }
    </style>
  </head>
  <body style="width: 300px; height: 200px"
    ><div class="box"><div class="absolute"></div></div
    ><div class="fixed-clip"><div class="fixed"></div></div
  ></body>
</html>
