<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>border_thin_effective_styles</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 480px; height: 160px">
    <div
      style="
        display: flex;
        gap: 24px;
        width: 100%;
        height: 100%;
        padding: 32px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div style="width: 80px; height: 80px; border: 2px double rgb(37, 99, 235)"></div>
      <div style="width: 80px; height: 80px; border: 3px double rgb(37, 99, 235)"></div>
      <div style="width: 80px; height: 80px; border: 1px groove rgb(220, 38, 38)"></div>
      <div style="width: 80px; height: 80px; border: 1px ridge rgb(22, 163, 74)"></div>
    </div>
  </body>
