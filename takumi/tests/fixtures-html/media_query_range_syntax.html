<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>media_query_range_syntax</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .row {
        display: flex;
        flex-direction: row;
        gap: 20px;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-size: 32px;
      }
      .box {
        display: flex;
        width: 260px;
        height: 120px;
        align-items: center;
        justify-content: center;
        background-color: rgb(200, 200, 200);
      }
      @media (width >= 1000px) {
        .wide {
          background-color: rgb(120, 200, 120);
        }
      }
      @media (900px < width <= 1200px) {
        .between {
          background-color: rgb(120, 200, 120);
        }
      }
      @media (width < 600px) {
        .narrow {
          background-color: rgb(220, 120, 120);
        }
      }
    </style>
  </head>
  <body style="width: 1200px; height: 200px">
    <div class="row">
      <div class="box wide">wide</div>
      <div class="box between">between</div>
      <div class="box narrow">narrow</div>
    </div>
  </body>
</html>
