<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>transform_identity_stacking_context</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 480px; height: 320px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 20px;
        line-height: 28px;
      "
    >
      <div
        style="
          display: block;
          width: 200px;
          height: 60px;
          margin-bottom: -30px;
          background-color: rgb(239, 68, 68);
          transform: translateX(0);
        "
      >
        Identity transform
      </div>
      <div
        style="
          display: block;
          width: 200px;
          height: 60px;
          margin-left: 40px;
          background-color: rgb(59, 130, 246);
        "
      >
        In flow
      </div>
      <div
        style="
          display: block;
          width: 200px;
          height: 60px;
          margin-top: 20px;
          background-color: rgb(250, 204, 21);
          translate: 0 0;
        "
      >
        <div
          style="
            display: block;
            position: relative;
            z-index: -1;
            width: 120px;
            height: 40px;
            margin: 10px;
            background-color: rgb(34, 197, 94);
          "
        >
          Behind
        </div>
      </div>
      <div
        style="
          display: block;
          width: 200px;
          height: 60px;
          margin-top: 20px;
          background-color: rgb(250, 204, 21);
          scale: 1;
        "
      >
        <div
          style="
            display: block;
            position: relative;
            z-index: -1;
            width: 120px;
            height: 40px;
            margin: 10px;
            background-color: rgb(34, 197, 94);
          "
        >
          Scale 1
        </div>
      </div>
      <div
        style="
          display: block;
          position: fixed;
          left: 260px;
          top: 20px;
          width: 200px;
          height: 60px;
          background-color: rgb(168, 85, 247);
        "
      >
        <div
          style="
            display: block;
            position: relative;
            z-index: -1;
            width: 120px;
            height: 40px;
            margin: 10px;
            background-color: rgb(34, 197, 94);
          "
        >
          Fixed child
        </div>
      </div>
    </div>
  </body>
</html>
