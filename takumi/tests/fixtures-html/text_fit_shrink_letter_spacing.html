<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_shrink_letter_spacing</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 640px; height: 300px">
    <div
      style="
        display: flex;
        flex-direction: column;
        row-gap: 14px;
        background-color: rgb(246, 248, 251);
        padding-top: 18px;
        padding-right: 18px;
        padding-bottom: 18px;
        padding-left: 18px;
      "
      ><div
        style="
          display: block;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
        ><span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >shrink + letter-spacing 4px</span
        ><span
          style="
            display: block;
            width: 584px;
            font-size: 44px;
            line-height: 1;
            letter-spacing: 4px;
            text-fit: shrink 30%;
            background-color: rgb(255, 255, 255);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
            text-wrap-mode: nowrap;
          "
          >This headline is intentionally long</span
        ></div
      ><div
        style="
          display: block;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
        ><span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >shrink + word-spacing 12px</span
        ><span
          style="
            display: block;
            width: 584px;
            font-size: 44px;
            line-height: 1;
            word-spacing: 12px;
            text-fit: shrink 30%;
            background-color: rgb(255, 255, 255);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
            text-wrap-mode: nowrap;
          "
          >Every word gets extra room here</span
        ></div
      ></div
    >
  </body>
</html>
