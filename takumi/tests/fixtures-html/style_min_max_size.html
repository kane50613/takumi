<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_min_max_size</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        height: 100%;
        padding: 10px;
        background-color: rgb(229, 231, 235);
      }
      .row > div {
        flex-shrink: 0;
        width: 120px;
        height: 80px;
        background-color: rgb(59, 130, 246);
      }
    </style>
  </head>
  <body style="width: 790px; height: 100px">
    <div class="row">
      <div></div>
      <div style="width: 40px; min-width: 120px"></div>
      <div style="width: 300px; max-width: 120px"></div>
      <div style="height: 20px; min-height: 80px"></div>
      <div style="height: 300px; max-height: 80px"></div>
      <div style="width: 40px; min-width: 120px; max-width: 60px"></div>
    </div>
  </body>
</html>
