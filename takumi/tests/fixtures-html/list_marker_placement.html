<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>list_marker_placement</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px;
        width: 100%;
        height: 100%;
        background: rgb(243, 244, 246);
        align-content: flex-start;
        font-family: "Geist";
        color: rgb(17, 24, 39);
      }
      .list {
        display: block;
        width: 220px;
        padding: 6px 8px 6px 48px;
        background: white;
        font-size: 16px;
        list-style-type: decimal;
      }
      .item {
        display: list-item;
        background: rgb(219, 234, 254);
        margin-bottom: 4px;
      }
      .block {
        display: block;
        background: rgb(191, 219, 254);
      }
      .indented {
        margin-left: 24px;
      }
      .big {
        font-size: 32px;
      }
      .empty-flex {
        display: flex;
        height: 30px;
        background: rgb(191, 219, 254);
      }
      .float {
        float: left;
        width: 40px;
        height: 40px;
        background: rgb(252, 165, 165);
      }
      .rtl {
        direction: rtl;
        padding: 6px 48px 6px 8px;
      }
    </style>
  </head>
  <body style="width: 480px; height: 300px">
    <div class="root">
      <div class="list">
        <div class="item"><div class="block indented">indented block</div></div>
        <div class="item big"><div class="block" style="font-size: 12px">small text</div></div>
        <div class="item"><div class="empty-flex"></div></div>
      </div>
      <div class="list">
        <div class="item"><div class="float"></div>beside a float</div>
        <div class="item"
          ><div class="block"><div class="block">nested twice</div></div></div
        >
      </div>
      <div class="list rtl">
        <div class="item"><div class="block indented">indented block</div></div>
      </div>
    </div>
  </body>
</html>
