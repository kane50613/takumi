<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clip_path_percent_radius</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 60px;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          width: 480px;
          height: 200px;
          background-image: linear-gradient(135deg, rgb(37, 99, 235), rgb(225, 29, 72));
          clip-path: inset(10px round 40%);
        "
      ></div>
      <div
        style="
          width: 300px;
          height: 200px;
          background-image: linear-gradient(135deg, rgb(22, 163, 74), rgb(250, 204, 21));
          clip-path: ellipse(closest-side farthest-side at 30% 50%);
        "
      ></div>
    </div>
  </body>
</html>
