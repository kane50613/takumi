<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>svg_inline_page_styles</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .row {
        display: flex;
        gap: 40px;
        padding: 40px;
        background-color: rgb(255, 255, 255);
      }
      .icon path {
        stroke: rgb(37, 99, 235);
        stroke-width: 4;
      }
      .tinted {
        fill: rgb(22, 163, 74);
      }
      svg.faded {
        opacity: 0.5;
      }
    </style>
  </head>
  <body style="width: 720px; height: 200px">
    <div class="row">
      <svg class="icon" width="120" height="120" viewBox="0 0 24 24" fill="none">
        <path d="M4 12h16M12 4v16" /></svg
      ><div style="fill: rgb(220, 38, 38)"
        ><svg width="120" height="120"><rect width="120" height="120" /></svg></div
      ><svg width="120" height="120">
        <style>
          .tinted {
            fill: rgb(147, 51, 234);
          }
        </style>
        <rect class="tinted" width="120" height="120" /></svg
      ><svg class="faded" width="120" height="120">
        <rect class="tinted" width="120" height="120" />
      </svg>
    </div>
  </body>
</html>
