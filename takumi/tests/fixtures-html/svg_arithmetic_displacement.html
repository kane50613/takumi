<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>svg_arithmetic_displacement</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 480px; height: 140px">
    <svg width="480" height="140" style="display: block; background: white">
      <defs>
        <linearGradient id="fade" x1="0" x2="1">
          <stop offset="0" stop-color="rgb(37, 99, 235)" />
          <stop offset="1" stop-color="rgba(234, 88, 12, 0.5)" />
        </linearGradient>
        <filter id="arithmetic" x="0" y="0" width="1" height="1">
          <feFlood flood-color="rgb(22, 163, 74)" flood-opacity="0.7" result="flood" />
          <feComposite
            in="SourceGraphic"
            in2="flood"
            operator="arithmetic"
            k1="0.6"
            k2="0.7"
            k3="0.4"
            k4="-0.1"
          />
        </filter>
        <filter id="bright" x="0" y="0" width="1" height="1">
          <feComposite
            in="SourceGraphic"
            in2="SourceGraphic"
            operator="arithmetic"
            k2="1.4"
            k4="0.2"
          />
        </filter>
        <filter id="wave" x="0" y="0" width="1" height="1">
          <feTurbulence baseFrequency="0.04" numOctaves="2" result="noise" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="18"
            xChannelSelector="R"
            yChannelSelector="A"
          />
        </filter>
      </defs>
      <rect
        x="10"
        y="10"
        width="140"
        height="120"
        rx="16"
        fill="url(#fade)"
        filter="url(#arithmetic)"
      />
      <rect
        x="170"
        y="10"
        width="140"
        height="120"
        rx="16"
        fill="url(#fade)"
        filter="url(#bright)"
      />
      <g filter="url(#wave)">
        <rect x="340" y="20" width="120" height="100" fill="url(#fade)" />
        <path d="M350 70h100M400 30v80" stroke="black" stroke-width="6" />
      </g>
    </svg>
  </body>
</html>
