<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_background_clip_text_decoration</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 640px; height: 300px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 44px;
        line-height: 72px;
        font-weight: 700;
        color: rgb(15, 23, 42);
      "
    >
      <div style="display: block">
        <span
          style="
            display: inline;
            background-image: linear-gradient(90deg, rgb(37, 99, 235), rgb(219, 39, 119));
            background-clip: text;
            color: rgba(0, 0, 0, 0);
            text-decoration: underline 4px;
          "
          >Underlined</span
        >
      </div>
      <div style="display: block">
        <span
          style="
            display: inline;
            background-image: linear-gradient(90deg, rgb(22, 163, 74), rgb(8, 145, 178));
            background-clip: text;
            color: rgba(0, 0, 0, 0);
            text-decoration: line-through wavy 3px;
          "
          >Wavy strike</span
        >
      </div>
      <div style="display: block">
        <span
          style="
            display: inline;
            background-image: linear-gradient(90deg, rgb(234, 88, 12), rgb(147, 51, 234));
            background-clip: text;
            color: rgba(0, 0, 0, 0);
            -webkit-text-stroke: 4px rgba(0, 0, 0, 0);
          "
          >Stroked</span
        >
      </div>
    </div>
  </body>
</html>
