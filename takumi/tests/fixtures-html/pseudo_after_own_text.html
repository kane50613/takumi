<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>pseudo_after_own_text</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .rows {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        width: 100%;
        height: 100%;
        padding: 0 160px;
        background: white;
        font-size: 24px;
        color: #27272a;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
        padding: 0 24px;
        border-radius: 12px;
        background: #f4f4f5;
      }
      .row::after {
        content: "";
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #0ea5e9;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div class="rows">
      <div class="row">Flex text beside ::after</div>
      <div class="row grid">Grid text beside ::after</div>
    </div>
  </body>
</html>
