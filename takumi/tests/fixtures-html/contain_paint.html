<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .box {
        display: block;
        width: 140px;
        height: 90px;
        padding: 12px;
        border: 2px solid rgb(15, 23, 42);
        background-color: rgb(226, 232, 240);
      }
      .spill {
        display: block;
        width: 200px;
        height: 40px;
        margin-top: -20px;
        margin-left: -40px;
        background-color: rgb(37, 99, 235);
      }
    </style>
  </head>
  <body style="width: 400px; height: 260px">
    <div
      style="
        display: flex;
        column-gap: 48px;
        width: 100%;
        height: 100%;
        padding: 32px;
        background-color: rgb(248, 250, 252);
        font-size: 14px;
      "
    >
      <div style="display: flex; flex-direction: column; row-gap: 12px">
        <div>contain: none</div>
        <div class="box"><div class="spill"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; row-gap: 12px">
        <div>contain: paint</div>
        <div class="box" style="contain: paint"><div class="spill"></div></div>
      </div>
    </div>
  </body>
</html>
