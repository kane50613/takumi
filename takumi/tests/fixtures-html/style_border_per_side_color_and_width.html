<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_border_per_side_color_and_width</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(17, 24, 39);
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          display: flex;
          width: 360px;
          height: 220px;
          background-color: rgb(255, 255, 255);
          border-top-width: 12px;
          border-right-width: 24px;
          border-bottom-width: 36px;
          border-left-width: 48px;
          border-top-style: solid;
          border-right-style: solid;
          border-bottom-style: solid;
          border-left-style: solid;
          border-top-color: rgb(239, 68, 68);
          border-right-color: rgb(34, 197, 94);
          border-bottom-color: rgb(59, 130, 246);
          border-left-color: rgb(234, 179, 8);
        "
      ></div>
    </div>
  </body>
</html>
