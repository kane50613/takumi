<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_grow_bg_clip_transparent_stroke</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        align-items: center;
        background-color: rgb(186, 169, 207);
        display: flex;
        font-family: &quot;Noto Sans TC&quot;;
        height: 100%;
        justify-content: center;
        width: 100%;
      "
    >
      <div
        style="
          background-clip: text;
          background-color: rgb(0, 0, 0);
          color: rgb(255, 255, 255);
          display: block;
          font-size: 60px;
          font-weight: 700;
          line-height: 1.5;
          text-align: center;
          text-fit: grow;
          text-overflow: ellipsis;
          -webkit-text-stroke-color: rgba(0, 0, 0, 0);
          -webkit-text-stroke-width: 12px;
          width: 100%;
        "
      >
        <span>Goo goo ga ga</span>
      </div>
    </div>
  </body>
</html>
