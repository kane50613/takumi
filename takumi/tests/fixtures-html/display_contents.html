<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .label::before {
        content: "before ";
        color: rgb(190, 18, 60);
      }
    </style>
  </head>
  <body style="width: 480px; height: 280px">
    <div
      style="
        display: flex;
        flex-direction: column;
        row-gap: 8px;
        width: 100%;
        height: 100%;
        padding: 12px;
        background-color: rgb(241, 245, 249);
        font-size: 18px;
      "
    >
      <div style="display: flex; column-gap: 8px">
        <div style="display: contents; padding: 40px; background-color: rgb(248, 113, 113)">
          <div style="flex: 1; padding: 8px; background-color: rgb(219, 234, 254)">one</div>
          <span style="flex: 1; padding: 8px; background-color: rgb(191, 219, 254)">two</span>
        </div>
        <div style="flex: 1; padding: 8px; background-color: rgb(147, 197, 253)">three</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <div style="display: contents; color: rgb(21, 128, 61)">
          <div style="display: contents">
            <div style="padding: 8px; background-color: rgb(220, 252, 231)">nested</div>
          </div>
          <div style="padding: 8px; background-color: rgb(187, 247, 208)">inherits color</div>
        </div>
      </div>
      <div style="padding: 8px; background-color: rgb(254, 249, 195)">
        <span class="label" style="display: contents; background-color: rgb(248, 113, 113)"
          >text</span
        >
        <img
          style="display: contents; width: 40px; height: 40px; background-color: rgb(248, 113, 113)"
        />
        after
      </div>
    </div>
  </body>
</html>
