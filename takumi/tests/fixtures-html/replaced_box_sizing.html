<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>replaced_box_sizing</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        padding: 0 40px;
      "
    >
      <div style="display: block; width: 600px; background-color: rgb(240, 240, 240)">
        <img
          style="
            display: block;
            box-sizing: content-box;
            padding: 20px;
            border: 5px solid rgb(0, 0, 0);
          "
          src="assets/images/yeecord.png"
        />
      </div>
      <div style="display: block; width: 600px; background-color: rgb(240, 240, 240)">
        <img
          style="
            display: block;
            box-sizing: border-box;
            padding: 20px;
            border: 5px solid rgb(0, 0, 0);
          "
          src="assets/images/yeecord.png"
        />
      </div>
      <div style="display: block; width: 600px; background-color: rgb(240, 240, 240)">
        <img
          style="
            box-sizing: border-box;
            padding: 20px;
            border: 5px solid rgb(0, 0, 0);
          "
          src="assets/images/yeecord.png"
        />
      </div>
    </div>
  </body>
</html>
