<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>table_width</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 16px;
        width: 100%;
        height: 100%;
        background: rgb(243, 244, 246);
        font-family: "Geist";
        font-size: 16px;
      }
      table {
        display: table;
        border-spacing: 2px;
        background: rgb(255, 255, 255);
        margin-bottom: 12px;
      }
      tbody {
        display: table-row-group;
        vertical-align: middle;
      }
      tr {
        display: table-row;
        vertical-align: inherit;
      }
      td {
        display: table-cell;
        vertical-align: inherit;
        border: 1px solid rgb(148, 163, 184);
        padding: 2px 6px;
      }
    </style>
  </head>
  <body style="width: 480px; height: 400px">
    <div class="root">
      <table>
        <tr>
          <td>auto</td>
          <td>shrinks to its content</td>
        </tr>
      </table>
      <table>
        <tr>
          <td>an auto table wider than the box</td>
          <td>wraps between its columns' minimum and maximum widths</td>
        </tr>
      </table>
      <table style="width: 100%">
        <tr>
          <td style="width: 30%">30%</td>
          <td>fills</td>
          <td style="width: 80px">80px</td>
        </tr>
      </table>
      <table style="width: 300px">
        <tr>
          <td>min</td>
          <td style="min-width: 120px">min-width 120px</td>
          <td style="max-width: 40px">max-width</td>
        </tr>
      </table>
      <table>
        <tr>
          <td colspan="3">three columns only a span covers</td>
        </tr>
      </table>
    </div>
  </body>
</html>
