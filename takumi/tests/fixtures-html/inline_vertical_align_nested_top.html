<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_vertical_align_nested_top</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 20px;
        width: 100%;
        height: 100%;
        background: rgb(241, 245, 249);
        font-family: "Geist";
        font-size: 24px;
        line-height: 40px;
      }
      p {
        display: block;
        margin: 0 0 24px;
        background: rgb(226, 232, 240);
      }
      .raised {
        vertical-align: 10px;
        background: rgb(191, 219, 254);
      }
      .box {
        display: inline-block;
        width: 16px;
        height: 16px;
        background: rgb(220, 38, 38);
      }
    </style>
  </head>
  <body style="width: 420px; height: 240px">
    <div class="root">
      <p
        >text
        <span class="raised">up <span class="box" style="vertical-align: top"></span></span> end</p
      >
      <p
        >text
        <span class="raised">up <span class="box" style="vertical-align: bottom"></span></span>
        end</p
      >
      <p
        >text
        <span class="raised" style="vertical-align: top"
          >top <span class="box" style="vertical-align: bottom"></span
        ></span>
        end</p
      >
    </div>
  </body>
</html>
