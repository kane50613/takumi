<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>border_dotted_widths</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        gap: 60px;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div style="width: 240px; height: 160px; border: 1px dotted rgb(15, 23, 42)"></div>
      <div style="width: 240px; height: 160px; border: 2px dotted rgb(15, 23, 42)"></div>
      <div style="width: 240px; height: 160px; border: 3px dotted rgb(15, 23, 42)"></div>
      <div style="width: 240px; height: 160px; border: 4px dotted rgb(15, 23, 42)"></div>
      <div
        style="
          width: 240px;
          height: 160px;
          border-width: 3px 3px 3px 12px;
          border-style: dotted dotted dotted solid;
          border-color: rgb(15, 23, 42) rgb(15, 23, 42) rgb(15, 23, 42) rgb(37, 99, 235);
        "
      ></div>
      <div
        style="width: 240px; height: 160px; border: 2px dotted rgb(15, 23, 42); border-radius: 24px"
      ></div>
    </div>
  </body>
</html>
