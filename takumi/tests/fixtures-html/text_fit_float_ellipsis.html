<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_float_ellipsis</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .fit {
        display: block;
        width: 600px;
        height: 120px;
        font-size: 36px;
        line-height: 1.25;
        overflow: hidden;
        text-fit: shrink;
        text-overflow: ellipsis;
      }
      .float {
        float: left;
        width: 80px;
        height: 80px;
        margin-right: 16px;
        background-color: rgb(99, 102, 241);
      }
      .sibling {
        height: 16px;
        background-color: rgb(251, 191, 36);
      }
    </style>
  </head>
  <body style="width: 640px; height: 320px">
    <div
      style="
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        color: rgb(15, 23, 42);
      "
    >
      <div class="fit" style="background-color: rgb(224, 231, 255)"
        ><div class="float"></div>The quick brown fox jumps over the lazy dog while the five boxing
        wizards jump quickly past the sphinx of black quartz</div
      >
      <div class="sibling"></div>
      <div class="fit" style="background-color: rgb(220, 252, 231)"
        >The quick brown fox jumps over the lazy dog while the five boxing wizards jump quickly past
        the sphinx of black quartz</div
      >
      <div class="sibling"></div>
    </div>
  </body>
</html>
