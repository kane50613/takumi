<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clip_path_inset_round_clips_children</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div style="display: flex; width: 100%; height: 100%; background-color: rgb(255, 255, 255)">
      <div
        style="
          display: flex;
          position: absolute;
          top: 0px;
          left: 0px;
          width: 100%;
          height: 100%;
          clip-path: inset(0px 0px 0px 0px round 50px 50px 50px 50px);
          background-color: rgb(0, 0, 0);
        "
      >
        <div
          style="
            display: flex;
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            background-color: rgb(255, 0, 0);
          "
        ></div>
      </div>
    </div>
  </body>
</html>
