<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>showcase_grid_hero</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .stage {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        font-family: Geist;
        background-color: #030409;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .grid {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.09) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 100%, #000 60%, transparent 100%);
      }
      .glow {
        background-image:
          radial-gradient(ellipse 100% 100% at 100% 100%, rgba(34, 197, 94, 0.18), transparent 60%),
          radial-gradient(ellipse 100% 100% at 0% 0%, rgba(56, 189, 248, 0.14), transparent 60%);
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 44px 56px;
        background-color: #fdfdf7;
        border: 4px solid #111;
        box-shadow: 18px 18px 0 #22c55e;
      }
      .kicker {
        font-family: "Geist Mono";
        font-size: 22px;
        letter-spacing: 8px;
        color: #16a34a;
      }
      .headline {
        font-size: 84px;
        font-weight: 900;
        letter-spacing: -2px;
        color: #111;
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div class="stage">
      <div class="layer grid"></div>
      <div class="layer glow"></div>
      <div class="card">
        <span class="kicker">TAKUMI / SHOWCASE</span><span class="headline">Grid Hero</span>
      </div>
    </div>
  </body>
</html>
