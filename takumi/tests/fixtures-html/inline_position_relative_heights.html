<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_position_relative_heights</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 10px 20px;
        width: 100%;
        height: 100%;
        background: white;
        font-family: "Geist";
        font-size: 20px;
        line-height: 28px;
      }
      .cell {
        display: block;
        margin: 0 0 8px;
        background: rgb(241, 245, 249);
      }
      span {
        position: relative;
        top: 50%;
        color: rgb(220, 38, 38);
      }
    </style>
  </head>
  <body style="width: 600px; height: 560px">
    <div class="root">
      <div style="display: block; height: 120px; margin-bottom: 8px">
        <p class="cell" style="height: 50%">Percent height <span>top 50%</span></p>
      </div>
      <div style="display: flex; height: 100px; margin-bottom: 8px">
        <p class="cell" style="flex: 1">Flex stretched <span>top 50%</span></p>
      </div>
      <div style="display: grid; grid-template-rows: 100px; margin-bottom: 8px">
        <p class="cell">Grid stretched <span>top 50%</span></p>
      </div>
      <p class="cell" style="min-height: 100px">Min height only <span>top 50%</span></p>
    </div>
  </body>
</html>
