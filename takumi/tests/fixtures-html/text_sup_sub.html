<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_sup_sub</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 16px 24px;
        width: 100%;
        height: 100%;
        background: rgb(248, 250, 252);
        font-family: "Geist";
        font-size: 32px;
      }
      p {
        display: block;
        margin: 0;
      }
      sup {
        font-size: smaller;
        vertical-align: super;
      }
      sub {
        font-size: smaller;
        vertical-align: sub;
      }
      .lined {
        line-height: 1.6;
        background: rgb(224, 231, 255);
      }
    </style>
  </head>
  <body style="width: 720px; height: 340px">
    <div class="root">
      <p>E = mc<sup>2</sup> and H<sub>2</sub>O</p>
      <p
        >Footnote<sup>12</sup> nested x<sup>a<sup>b</sup></sup></p
      >
      <p class="lined">Line height<sup>sup</sup> stays<sub>sub</sub></p>
      <p style="font-size: 18px">Small text<sup>†</sup> with a mark</p>
    </div>
  </body>
</html>
