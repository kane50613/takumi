<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>showcase_neon_terminal</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .stage {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        font-family: Geist;
        background-color: #050508;
        flex-direction: column;
        gap: 20px;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .neon {
        font-size: 96px;
        font-weight: 800;
        color: #fff;
        text-shadow:
          0 0 6px #fff,
          0 0 18px #ff2d95,
          0 0 42px #ff2d95,
          0 0 90px #ff2d95;
      }
      .chromatic {
        font-family: "Geist Mono";
        font-size: 30px;
        color: rgba(210, 255, 244, 0.9);
        text-shadow:
          -2px 0 rgba(255, 0, 85, 0.7),
          2px 0 rgba(0, 255, 255, 0.7);
      }
      .scanlines {
        background-image: repeating-linear-gradient(
          180deg,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 3px,
          rgba(0, 0, 0, 0.3) 3px,
          rgba(0, 0, 0, 0.3) 5px
        );
      }
      .vignette {
        background-image: radial-gradient(
          ellipse at 50% 50%,
          transparent 55%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div class="stage">
      <span class="neon">NEON</span
      ><span class="chromatic">&gt; scanlines &amp; chromatic aberration_</span>
      <div class="layer scanlines"></div>
      <div class="layer vignette"></div>
    </div>
  </body>
</html>
