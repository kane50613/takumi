<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_mix_blend_mode_isolation</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background-color: rgb(0, 191, 255);
      "
    >
      <div style="display: flex; isolation: auto; width: 128px; height: 128px">
        <img src="assets/images/yeecord.png" style="display: flex; mix-blend-mode: multiply" />
      </div>
      <div style="display: flex; isolation: isolate; width: 128px; height: 128px">
        <img src="assets/images/yeecord.png" style="display: flex; mix-blend-mode: multiply" />
      </div>
    </div>
  </body>
</html>
