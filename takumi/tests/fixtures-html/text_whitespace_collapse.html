<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_whitespace_collapse</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        background-color: rgb(255, 255, 255);
        flex-direction: column;
        font-size: 32px;
        width: 100%;
        height: 100%;
        row-gap: 20px;
        column-gap: 20px;
        padding-top: 20px;
        padding-right: 20px;
        padding-bottom: 20px;
        padding-left: 20px;
      "
      ><span style="display: flex; white-space-collapse: collapse"
        >collapse:&#32;Multiple&#32;&#32;&#32;&#32;spaces&#32;&#32;&#32;and&#9;tabs&#9;&#9;are&#32;&#32;&#32;&#32;collapsed</span
      ><span style="display: flex; white-space-collapse: preserve"
        >preserve:&#32;Multiple&#32;&#32;&#32;&#32;spaces&#32;&#32;&#32;and&#9;tabs&#9;&#9;are&#32;&#32;&#32;&#32;preserved</span
      ><span style="display: flex; white-space-collapse: preserve-spaces"
        >preserve-spaces:&#32;Multiple&#32;&#32;&#32;&#32;spaces&#32;&#32;&#32;preserved&#10;but&#10;breaks&#10;removed</span
      ><span style="display: flex; white-space-collapse: preserve-breaks"
        >preserve-breaks:&#32;Spaces&#32;&#32;&#32;&#32;collapsed&#10;&#32;but&#10;line&#10;breaks&#10;preserved</span
      ></div
    >
  </body>
</html>
