<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_mix_blend_modes</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        width: 100%;
        height: 100%;
        padding: 10px;
        background-color: rgb(244, 164, 96);
      }
      .backdrop {
        display: flex;
        width: 120px;
        height: 60px;
        background-color: rgb(118, 128, 138);
      }
      .stripes {
        display: flex;
        width: 100%;
        height: 100%;
      }
      .stripes > div {
        width: 40px;
        height: 60px;
      }
      .stripes > div:nth-child(1) {
        background-color: rgb(173, 107, 96);
      }
      .stripes > div:nth-child(2) {
        background-color: rgb(102, 156, 116);
      }
      .stripes > div:nth-child(3) {
        background-color: rgb(98, 122, 176);
      }
    </style>
  </head>
  <body style="width: 790px; height: 220px">
    <div class="grid">
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: normal"><div></div><div></div><div></div></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: multiply"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: screen"><div></div><div></div><div></div></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: overlay"><div></div><div></div><div></div></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: darken"><div></div><div></div><div></div></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: lighten"><div></div><div></div><div></div></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: color-dodge"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: color-burn"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: hard-light"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: soft-light"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: difference"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: exclusion"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: hue"><div></div><div></div><div></div></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: saturation"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: color"><div></div><div></div><div></div></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: luminosity"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: plus-darker"
          ><div></div><div></div><div></div
        ></div>
      </div>
      <div class="backdrop">
        <div class="stripes" style="mix-blend-mode: plus-lighter"
          ><div></div><div></div><div></div
        ></div>
      </div>
    </div>
  </body>
</html>
