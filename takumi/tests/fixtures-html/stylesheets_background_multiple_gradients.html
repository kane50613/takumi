<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>stylesheets_background_multiple_gradients</title>
  <base href="../../../">
  <link rel="stylesheet" href="takumi/tests/shared.css">
  <style>
    .multi-gradient-card {
      background: radial-gradient(circle at 80% 20%, #FF3D00 0%, transparent 40%), radial-gradient(circle at 20% 80%, #00E5FF 0%, transparent 40%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body style="width: 1200px; height: 630px;">
  <div style="display: flex; width: 100%; height: 100%; justify-content: center; align-items: center; background-color: rgb(22, 22, 22);"><section class="multi-gradient-card" style="display: flex; width: 700px; height: 360px; border-top-left-radius: 24px 24px; border-top-right-radius: 24px 24px; border-bottom-right-radius: 24px 24px; border-bottom-left-radius: 24px 24px;"></section></div>
</body>
</html>
