<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_property_typed</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      @property --angle {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }
      @property --tint {
        syntax: "<color>";
        inherits: false;
        initial-value: rgb(239, 68, 68);
      }
      @property --size {
        syntax: "<length>";
        inherits: false;
        initial-value: 40px;
      }
      @keyframes spin {
        to {
          --angle: 360deg;
          --plain-angle: 360deg;
        }
      }
      @keyframes fade {
        to {
          --tint: rgb(59, 130, 246);
        }
      }
      .row {
        display: flex;
        gap: 8px;
        padding: 8px;
      }
      .tile {
        display: block;
        width: 60px;
        height: 60px;
        animation-duration: 1000ms;
        animation-timing-function: linear;
        animation-play-state: paused;
      }
      .registered {
        animation-name: spin;
        animation-delay: -250ms;
        background: conic-gradient(from var(--angle), rgb(239, 68, 68), rgb(59, 130, 246));
      }
      .unregistered {
        --plain-angle: 0deg;
        animation-name: spin;
        animation-delay: -250ms;
        background: conic-gradient(from var(--plain-angle), rgb(239, 68, 68), rgb(59, 130, 246));
      }
      .color {
        animation-name: fade;
        animation-delay: -500ms;
        background: var(--tint);
      }
      .invalid {
        --size: red;
        width: var(--size);
        background: rgb(34, 197, 94);
      }
    </style>
  </head>
  <body style="width: 296px; height: 76px">
    <div class="row">
      <div class="tile registered"></div>
      <div class="tile unregistered"></div>
      <div class="tile color"></div>
      <div class="tile invalid"></div>
    </div>
  </body>
</html>
