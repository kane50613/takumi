<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_font_variant_caps_synthesis</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 16px 24px;
        width: 100%;
        height: 100%;
        background: rgb(248, 250, 252);
        font-family: "Geist";
        font-size: 32px;
        line-height: 1.5;
      }
      p {
        display: block;
        margin: 0;
      }
      mark {
        background: rgb(254, 240, 138);
      }
    </style>
  </head>
  <body style="width: 720px; height: 470px">
    <div class="root">
      <p>Unterkunft Straße 2026</p>
      <p style="font-variant-caps: small-caps">Unterkunft Straße 2026</p>
      <p style="font-variant-caps: all-small-caps">Unterkunft Straße 2026</p>
      <p style="font-variant-caps: petite-caps">Unterkunft Straße 2026</p>
      <p style="font-variant-caps: unicase">Unterkunft Straße 2026</p>
      <p style="font-variant-caps: small-caps; font-synthesis: none">Unterkunft Straße 2026</p>
      <p>
        Inline <mark style="font-variant-caps: small-caps; text-decoration: underline">café</mark>
        label
      </p>
    </div>
  </body>
</html>
