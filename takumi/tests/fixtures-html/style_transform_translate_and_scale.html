  <div style="display: flex; width: 100%; height: 100%; background-color: rgb(255, 255, 255); font-size: 24px;"><div style="display: flex; width: 200px; height: 100px; background-color: rgb(255, 0, 0);"><span>200px x 100px</span></div><div style="display: flex; width: 300px; height: 300px; border-top-width: 1px; border-right-width: 1px; border-bottom-width: 1px; border-left-width: 1px; border-top-style: solid; border-right-style: solid; border-bottom-style: solid; border-left-style: solid; translate: 300px 300px; background-color: rgb(0, 128, 255);"><img src="assets/images/yeecord.png" style="display: flex; width: 100%; height: 100%;" /></div><div style="display: flex; scale: 2 2; background-color: rgb(0, 255, 0); width: 100px; height: 100px; border-top-width: 1px; border-right-width: 1px; border-bottom-width: 1px; border-left-width: 1px; border-top-style: solid; border-right-style: solid; border-bottom-style: solid; border-left-style: solid; font-size: 12px;"><span>100px x 100px, scale(2.0, 2.0)</span></div><div style="display: flex; rotate: 45deg; background-color: rgb(0, 0, 255); width: 200px; height: 200px; border-top-width: 1px; border-right-width: 1px; border-bottom-width: 1px; border-left-width: 1px; border-top-style: solid; border-right-style: solid; border-bottom-style: solid; border-left-style: solid; color: rgb(255, 255, 255); border-top-color: rgb(0, 0, 0); border-right-color: rgb(0, 0, 0); border-bottom-color: rgb(0, 0, 0); border-left-color: rgb(0, 0, 0);"><span>200px x 200px, rotate(45deg)</span></div></div>
