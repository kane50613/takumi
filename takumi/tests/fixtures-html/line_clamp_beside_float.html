<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>line_clamp_beside_float</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: block;
        width: 640px;
        padding: 32px;
        font-size: 28px;
        line-height: 40px;
        background-color: rgb(248, 250, 252);
      "
      ><div
        style="
          display: block;
          float: left;
          width: 200px;
          height: 150px;
          margin-right: 24px;
          background-color: rgb(59, 130, 246);
        "
      ></div
      ><div style="display: block; line-clamp: 3; background-color: rgb(254, 240, 138)"
        >A line-clamp container is a new block formatting context, so it sits beside the float
        instead of wrapping around it, and clamps after three lines.</div
      ></div
    >
  </body>
</html>
