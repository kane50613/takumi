<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_transform_width</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      p {
        display: block;
        margin: 0;
        padding: 8px;
        font-family: "Noto Sans TC";
        font-size: 26px;
        background-color: rgb(240, 240, 240);
      }
    </style>
  </head>
  <body style="width: 560px; height: 290px">
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 12px">
      <p>Takumi 2026 ｶﾀｶﾅ ぁぃぅ</p>
      <p style="text-transform: full-width">Takumi 2026 ｶﾀｶﾅ ぁぃぅ</p>
      <p style="text-transform: full-size-kana">Takumi 2026 ｶﾀｶﾅ ぁぃぅ</p>
      <p style="text-transform: uppercase full-width; white-space: pre">Takumi 2026 ｶﾀｶﾅ ぁぃぅ</p>
    </div>
  </body>
</html>
