<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="takumi-presets" content="chromium" />
    <title>table_th_text_align</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        padding: 12px;
        font-family: Geist;
        font-size: 16px;
      }
      table {
        width: 100%;
        margin-bottom: 8px;
        border: 1px solid rgb(34, 197, 94);
      }
      th,
      td {
        border: 1px solid rgb(59, 130, 246);
      }
    </style>
  </head>
  <body style="width: 360px; height: 340px">
    <div class="root">
      <table>
        <tr>
          <th>Initial</th>
        </tr>
      </table>
      <table style="text-align: start">
        <tr>
          <th>Start</th>
        </tr>
      </table>
      <table style="text-align: right">
        <tr>
          <th>Right</th>
        </tr>
      </table>
      <table style="text-align: left">
        <tr>
          <th>Left</th>
          <td>Cell</td>
        </tr>
      </table>
      <table dir="rtl" style="text-align: end">
        <tr>
          <th>End</th>
        </tr>
      </table>
      <table style="text-align: right">
        <tr>
          <th style="text-align: center">Center</th>
        </tr>
      </table>
      <table>
        <tr style="text-align: right">
          <th>Row right</th>
        </tr>
      </table>
    </div>
  </body>
</html>
