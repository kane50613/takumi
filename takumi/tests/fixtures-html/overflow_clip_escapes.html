<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>overflow_clip_escapes</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 600px; height: 280px">
    <div
      style="
        display: flex;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 40px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 20px;
      "
    >
      <div style="display: block; position: relative; width: 140px; height: 140px">
        <div
          style="
            display: block;
            width: 100px;
            height: 100px;
            overflow: hidden;
            background-color: rgb(226, 232, 240);
          "
        >
          <div
            style="
              display: block;
              position: absolute;
              left: 60px;
              top: 60px;
              width: 80px;
              height: 80px;
              background-color: rgb(37, 99, 235);
            "
          ></div>
        </div>
      </div>
      <div style="display: block; width: 140px">
        <div
          style="
            display: block;
            height: 80px;
            overflow: hidden;
            background-color: rgb(226, 232, 240);
            color: rgb(15, 23, 42);
            font-size: 28px;
            line-height: 80px;
          "
        >
          above
        </div>
        <div
          style="
            display: block;
            height: 60px;
            margin-top: -60px;
            background-color: rgb(252, 211, 77);
          "
        ></div>
      </div>
      <div style="display: block; position: relative; width: 140px; height: 140px">
        <div
          style="
            display: block;
            width: 100px;
            height: 100px;
            overflow: hidden;
            background-color: rgb(226, 232, 240);
          "
        >
          <div style="display: block; opacity: 0.5">
            <div
              style="
                display: block;
                position: absolute;
                left: 60px;
                top: 60px;
                width: 80px;
                height: 80px;
                background-color: rgb(220, 38, 38);
              "
            ></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
