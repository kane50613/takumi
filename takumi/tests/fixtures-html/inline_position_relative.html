<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_position_relative</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 16px 24px;
        width: 100%;
        height: 100%;
        background: rgb(248, 250, 252);
        font-family: "Geist";
        font-size: 28px;
        line-height: 48px;
      }
      p {
        display: block;
        margin: 0;
      }
      .boxed {
        position: relative;
        left: 12px;
        top: 6px;
        padding: 0 4px;
        border: 2px solid rgb(37, 99, 235);
        background: rgb(219, 234, 254);
        text-decoration: underline;
      }
      .up {
        position: relative;
        top: -8px;
        color: rgb(220, 38, 38);
      }
      .chip {
        display: inline-block;
        width: 40px;
        height: 20px;
        background: rgb(22, 163, 74);
      }
    </style>
  </head>
  <body style="width: 720px; height: 580px">
    <div class="root">
      <p>Before <span class="boxed">moved span</span> after</p>
      <p
        >Nested <span class="up">outer <span class="up">inner</span> back</span> end</p
      >
      <p
        >Box <span class="up">inside <span class="chip"></span></span> end</p
      >
      <p>Own <span class="chip" style="position: relative; top: 8px; left: 10px"></span> end</p>
      <p style="direction: rtl">
        RTL
        <span style="position: relative; left: 30px; right: 10px; color: rgb(124, 58, 237)"
          >both</span
        >
        end
      </p>
      <p>Bottom <span style="position: relative; bottom: 10px; right: 20px">raised</span> end</p>
      <p
        >Percent
        <span style="position: relative; left: 10%; color: rgb(220, 38, 38)">tenth</span> end</p
      >
      <p>
        Both
        <span style="position: relative; left: 5%; right: 20px; color: rgb(220, 38, 38)"
          >left wins</span
        >
        end
      </p>
      <p>Chip <span class="chip" style="position: relative; right: 10%"></span> end</p>
      <p style="padding-left: 100px">
        Padded <span style="position: relative; left: 50%; color: rgb(220, 38, 38)">half</span> end
      </p>
      <p style="width: 300px">
        Fixed <span style="position: relative; left: 50%; color: rgb(220, 38, 38)">half</span> end
      </p>
    </div>
  </body>
</html>
