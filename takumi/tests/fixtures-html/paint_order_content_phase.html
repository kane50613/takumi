<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>paint_order_content_phase</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 520px; height: 300px">
    <div
      style="
        display: flex;
        gap: 24px;
        width: 100%;
        height: 100%;
        padding: 24px;
        background-color: rgb(255, 255, 255);
        font-size: 28px;
        color: rgb(15, 23, 42);
      "
    >
      <div style="display: block; position: relative; width: 220px; height: 120px; z-index: 0">
        Text over a negative child
        <div
          style="
            display: block;
            position: absolute;
            left: 0;
            top: 0;
            width: 200px;
            height: 90px;
            z-index: -1;
            background-color: rgb(191, 219, 254);
          "
        ></div>
      </div>
      <div style="display: block; width: 220px">
        <div style="display: block; height: 40px; line-height: 40px"
          >overflowing text that runs past its box</div
        >
        <div style="display: block; height: 120px; background-color: rgb(254, 215, 170)"></div>
      </div>
    </div>
  </body>
</html>
