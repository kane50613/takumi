<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>zero_size_box_text</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 600px; height: 300px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        gap: 80px;
        padding: 40px;
        background-color: rgb(255, 255, 255);
        font-size: 32px;
        text-wrap-mode: nowrap;
        color: rgb(20, 20, 20);
      "
    >
      <div style="width: 0; height: 40px; border: 2px solid rgb(220, 60, 60)">overflowing</div>
      <div style="width: 0; height: 40px; overflow: hidden">clipped</div>
    </div>
  </body>
</html>
