<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_justify</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      p {
        display: block;
        width: 520px;
        margin: 0;
        padding: 8px;
        font-family: Geist;
        font-size: 24px;
        text-align: justify;
        background-color: rgb(240, 240, 240);
      }
    </style>
  </head>
  <body style="width: 600px; height: 520px">
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 12px">
      <p>auto: The quick brown fox jumps over the lazy dog near the riverbank.</p>
      <p style="text-justify: inter-word"
        >inter-word: The quick brown fox jumps over the lazy dog near the riverbank.</p
      >
      <p style="text-justify: inter-character"
        >inter-character: The quick brown fox jumps over the lazy dog.</p
      >
      <p style="text-justify: none"
        >none: The quick brown fox jumps over the lazy dog near the riverbank.</p
      >
    </div>
  </body>
</html>
