<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_object_fit_position</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .grid {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        height: 100%;
        padding: 10px;
        background-color: white;
      }
      img {
        width: 160px;
        height: 100px;
        background-color: rgb(229, 231, 235);
      }
    </style>
  </head>
  <body style="width: 860px; height: 380px">
    <div class="grid">
      <img src="assets/images/yeecord.png" style="object-fit: fill" />
      <img src="assets/images/yeecord.png" style="object-fit: contain" />
      <img src="assets/images/yeecord.png" style="object-fit: cover" />
      <img src="assets/images/yeecord.png" style="object-fit: none" />
      <img src="assets/images/yeecord.png" style="object-fit: scale-down" />
      <img src="assets/images/yeecord.png" style="object-fit: contain; object-position: left top" />
      <img src="assets/images/yeecord.png" style="object-fit: cover; object-position: left top" />
      <img src="assets/images/yeecord.png" style="object-fit: none; object-position: left top" />
      <img
        src="assets/images/yeecord.png"
        style="object-fit: scale-down; object-position: left top"
      />
      <img src="assets/images/yeecord.png" style="object-fit: contain; object-position: 25% 75%" />
      <img
        src="assets/images/yeecord.png"
        style="object-fit: contain; object-position: right bottom"
      />
      <img
        src="assets/images/yeecord.png"
        style="object-fit: cover; object-position: right bottom"
      />
      <img
        src="assets/images/yeecord.png"
        style="object-fit: none; object-position: right bottom"
      />
      <img src="assets/images/yeecord.png" style="object-fit: cover; object-position: 25% 75%" />
      <img src="assets/images/yeecord.png" style="height: 140px; object-fit: scale-down" />
    </div>
  </body>
</html>
