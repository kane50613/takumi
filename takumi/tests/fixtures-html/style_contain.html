<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_contain</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        gap: 40px;
        padding: 40px;
        background-color: #f4f4f5;
      "
    >
      <div
        style="
          display: flex;
          width: 320px;
          height: 320px;
          padding: 24px;
          border: 8px solid #2563eb;
          contain: paint;
          background-color: #dbeafe;
        "
      >
        <div style="width: 480px; height: 480px; background-color: #f97316"></div>
      </div>
      <div
        style="
          display: flex;
          position: relative;
          width: 320px;
          height: 320px;
          contain: layout;
          background-color: #fecaca;
        "
      >
        <div
          style="
            position: relative;
            z-index: -1;
            width: 200px;
            height: 200px;
            margin: 60px;
            background-color: #16a34a;
          "
        ></div>
        <div
          style="
            position: fixed;
            right: 16px;
            bottom: 16px;
            width: 80px;
            height: 80px;
            background-color: #7c3aed;
          "
        ></div>
      </div>
      <div
        style="
          display: flex;
          position: relative;
          width: 320px;
          height: 320px;
          background-color: #fecaca;
        "
      >
        <div
          style="
            position: relative;
            z-index: -1;
            width: 200px;
            height: 200px;
            margin: 60px;
            background-color: #16a34a;
          "
        ></div>
        <div
          style="
            position: fixed;
            right: 16px;
            bottom: 16px;
            width: 80px;
            height: 80px;
            background-color: #7c3aed;
          "
        ></div>
      </div>
    </div>
  </body>
</html>
