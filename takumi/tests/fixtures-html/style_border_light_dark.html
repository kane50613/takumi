<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_border_light_dark</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      div {
        display: block;
        width: 120px;
        height: 40px;
        margin: 8px;
      }
      .shorthand {
        border: 4px solid light-dark(rgb(239, 68, 68), rgb(59, 130, 246));
      }
      .custom-property {
        --c: light-dark(rgb(34, 197, 94), rgb(59, 130, 246));
        border: 4px solid var(--c);
      }
      .longhand {
        border: 4px solid;
        border-color: light-dark(rgb(234, 179, 8), rgb(59, 130, 246));
      }
      .current-color {
        color: rgb(168, 85, 247);
        border: 4px solid light-dark(currentColor, rgb(59, 130, 246));
      }
    </style>
  </head>
  <body style="width: 160px; height: 240px">
    <div class="shorthand"></div>
    <div class="custom-property"></div>
    <div class="longhand"></div>
    <div class="current-color"></div>
  </body>
</html>
