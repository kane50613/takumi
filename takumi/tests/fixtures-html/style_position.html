<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_position</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 400px; height: 200px">
    <div
      style="
        display: flex;
        position: relative;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 255);
      "
    >
      <div
        style="
          position: absolute;
          top: 20px;
          right: 220px;
          bottom: 20px;
          left: 20px;
          background-color: rgb(255, 0, 0);
        "
      ></div>
      <div
        style="
          position: absolute;
          right: 20px;
          bottom: 20px;
          width: 60px;
          height: 60px;
          background-color: rgb(0, 255, 0);
        "
      ></div>
      <div
        style="
          position: absolute;
          top: 20px;
          right: 20px;
          left: 220px;
          width: 60px;
          height: 60px;
          background-color: rgb(255, 255, 0);
        "
      ></div>
    </div>
  </body>
</html>
