<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_fragment_font_metrics</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 420px; height: 200px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 32px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 16px;
        line-height: 56px;
        color: rgb(15, 23, 42);
      "
    >
      Small
      <span style="background-color: rgb(191, 219, 254)"
        ><span style="font-size: 32px">Big</span></span
      >
      text and
      <span
        style="
          padding: 0 12px;
          background-color: rgb(252, 165, 165);
          border: 2px solid rgb(185, 28, 28);
        "
      ></span>
      an empty span, then
      <span style="font-size: 28px; background-color: rgb(187, 247, 208)"
        ><span style="font-size: 12px">tiny</span></span
      >
      inside a large one.
    </div>
  </body>
</html>
