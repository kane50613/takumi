<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="takumi-presets" content="chromium" />
    <title>html_dir_isolate</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      p {
        margin: 0;
        padding: 8px;
        font-family: Geist, "Scheherazade New Test";
        font-size: 28px;
        background-color: rgb(240, 240, 240);
      }
    </style>
  </head>
  <body style="width: 520px; height: 600px">
    <div dir="rtl" style="display: flex; flex-direction: column; gap: 12px; padding: 12px">
      <p>التاريخ: 2026-11-19</p>
      <p>التاريخ: <span dir="ltr">2026-11-19</span></p>
      <p>التاريخ: <bdi>2026-11-19</bdi></p>
      <p><bdo dir="rtl">abc</bdo> مرحبا</p>
      <p>التاريخ: <span dir="auto">2026-11-19</span></p>
      <p>الاسم: <bdi>Hello, world!</bdi> مرحبا</p>
      <p>Name: <bdi dir="rtl">abc!</bdi> end</p>
    </div>
  </body>
</html>
