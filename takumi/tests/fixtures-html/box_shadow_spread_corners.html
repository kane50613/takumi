<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>box_shadow_spread_corners</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 120px;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          width: 200px;
          height: 200px;
          background-color: rgb(241, 245, 249);
          box-shadow: 0 0 0 40px rgb(37, 99, 235);
        "
      ></div>
      <div
        style="
          width: 200px;
          height: 200px;
          border-radius: 6px;
          background-color: rgb(241, 245, 249);
          box-shadow: 0 0 0 40px rgb(37, 99, 235);
        "
      ></div>
      <div
        style="
          width: 200px;
          height: 200px;
          border-radius: 60px;
          background-color: rgb(241, 245, 249);
          box-shadow: 0 0 0 40px rgb(37, 99, 235);
        "
      ></div>
    </div>
  </body>
</html>
