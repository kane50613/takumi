<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>line_clamp_auto_nested</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      div {
        display: block;
      }
      .clamp {
        width: 340px;
        line-height: 1.25;
        line-clamp: auto;
        max-height: 3lh;
        background-color: rgb(220, 252, 231);
      }
      .margin {
        margin-top: 1lh;
        color: rgb(29, 78, 216);
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        gap: 24px;
        align-items: flex-start;
        width: 100%;
        height: 100%;
        padding: 24px;
        font-size: 32px;
        background-color: white;
      "
    >
      <div class="clamp">
        <span
          >Before<div>Line 1<br />Line 2<br />Line 3</div>After</span
        >
      </div>
      <div class="clamp" style="max-height: 3.5lh">
        <div class="margin">Line 1<br />Line 2<br />Line 3</div>
      </div>
      <div class="clamp" style="max-height: 3.5lh">
        <div class="margin">
          <div>Line 1<br />Line 2<br />Line 3</div>
        </div>
      </div>
    </div>
  </body>
</html>
