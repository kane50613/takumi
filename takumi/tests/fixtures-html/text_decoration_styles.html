<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_decoration_styles</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .grid {
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: 100%;
        height: 100%;
        padding: 28px;
        font-family: Geist;
        font-size: 30px;
        color: rgb(15, 23, 42);
        background-color: rgb(255, 255, 255);
      }
      .row {
        display: flex;
        gap: 36px;
      }
      .under {
        text-decoration-line: underline;
      }
      .over {
        text-decoration-line: overline;
      }
      .through {
        text-decoration-line: line-through;
      }
      .solid {
        text-decoration-style: solid;
      }
      .double {
        text-decoration-style: double;
      }
      .dotted {
        text-decoration-style: dotted;
      }
      .dashed {
        text-decoration-style: dashed;
      }
      .wavy {
        text-decoration-style: wavy;
      }
      .thick {
        text-decoration-thickness: 4px;
        text-decoration-color: rgb(225, 29, 72);
      }
      .shadow {
        text-shadow: 3px 3px 2px rgba(37, 99, 235, 0.6);
      }
    </style>
  </head>
  <body style="width: 900px; height: 520px">
    <div class="grid">
      <div class="row">
        <div class="under solid">solid</div>
        <div class="under double">double</div>
        <div class="under dotted">dotted</div>
        <div class="under dashed">dashed</div>
        <div class="under wavy">wavy</div>
      </div>
      <div class="row">
        <div class="over double">double</div>
        <div class="over dotted">dotted</div>
        <div class="over dashed">dashed</div>
        <div class="over wavy">wavy</div>
      </div>
      <div class="row">
        <div class="through double">double</div>
        <div class="through dotted">dotted</div>
        <div class="through dashed">dashed</div>
        <div class="through wavy">wavy</div>
      </div>
      <div class="row">
        <div class="under thick double">Typing</div>
        <div class="under thick dotted">Typing</div>
        <div class="under thick dashed">Typing</div>
        <div class="under thick wavy">Typing</div>
      </div>
      <div class="row">
        <div class="under wavy shadow">shadowed</div>
        <div style="text-decoration: underline dashed rgb(22, 163, 74) 2px">shorthand</div>
      </div>
    </div>
  </body>
</html>
