<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>list_marker_fractional_offset</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .list {
        display: block;
        margin: 0;
        padding: 10.5px 20.4px;
        background: white;
        font-family: "Geist";
        font-size: 24px;
        color: rgb(15, 23, 42);
        list-style-type: decimal;
        list-style-position: inside;
      }
      .item {
        display: list-item;
      }
    </style>
  </head>
  <body style="width: 320px; height: 160px">
    <div class="list">
      <div class="item" style="outline: 1px solid rgb(37, 99, 235)">first item</div>
      <div class="item" style="padding-top: 0.3px">second item</div>
      <div class="item" style="text-decoration: underline">third item</div>
      <div class="item" style="list-style-type: disc; padding-left: 0.4px">fourth item</div>
    </div>
  </body>
</html>
