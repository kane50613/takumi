<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>filter_drop_shadow_subpixel</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 480px; height: 200px">
    <div
      style="
        display: flex;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 40px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          width: 80px;
          height: 80px;
          background-color: rgb(59, 130, 246);
          filter: drop-shadow(10.5px 10.5px 0 rgb(15, 23, 42));
        "
      ></div>
      <div
        style="
          width: 80px;
          height: 80px;
          background-color: rgb(59, 130, 246);
          filter: drop-shadow(-6.25px 8.75px 0 rgb(15, 23, 42));
        "
      ></div>
      <div
        style="
          width: 80px;
          height: 80px;
          background-color: rgb(59, 130, 246);
          filter: drop-shadow(4.5px 4.5px 3px rgba(15, 23, 42, 0.6));
        "
      ></div>
    </div>
  </body>
</html>
