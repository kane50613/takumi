<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>style_filter</title>
  <base href="../../../">
  <link rel="stylesheet" href="takumi/tests/shared.css">
</head>
<body style="width: 1200px; height: 630px;">
  <div style="display: grid; width: 100%; height: 100%; grid-template-columns: repeat(5, 1fr); row-gap: 16px; column-gap: 16px; justify-content: center; align-items: center; background-color: rgb(255, 255, 255);"><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: blur(5px);" /><span style="display: block;">blur(5px)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: grayscale(0.75);" /><span style="display: block;">grayscale(75%)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: opacity(0.3);" /><span style="display: block;">opacity(30%)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: contrast(1.5);" /><span style="display: block;">contrast(150%)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: brightness(1.5);" /><span style="display: block;">brightness(150%)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: invert(0.5);" /><span style="display: block;">invert(50%)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: hue-rotate(90deg);" /><span style="display: block;">hue-rotate(90deg)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: saturate(0.3);" /><span style="display: block;">saturate(0.3)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 128px; height: 128px; filter: sepia(1);" /><span style="display: block;">sepia(100%)</span></div></div>
</body>
</html>
