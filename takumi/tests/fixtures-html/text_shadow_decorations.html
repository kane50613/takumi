<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_shadow_decorations</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 80px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 72px;
        font-weight: 700;
        line-height: 1.6;
        color: rgb(15, 23, 42);
      "
    >
      <span
        style="
          text-decoration-line: underline line-through;
          text-decoration-color: rgb(37, 99, 235);
          text-decoration-thickness: 6px;
          text-shadow:
            6px 6px 0 rgb(225, 29, 72),
            12px 12px 0 rgb(250, 204, 21);
        "
        >Shadowed lines</span
      >
      <span
        style="
          color: rgb(22, 163, 74);
          text-decoration-line: overline;
          text-decoration-thickness: 4px;
          text-shadow: 0 8px 12px rgba(15, 23, 42, 0.5);
        "
        >and a blurred run</span
      >
    </div>
  </body>
</html>
