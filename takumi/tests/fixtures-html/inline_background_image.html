<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_background_image</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 420px; height: 320px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 16px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 24px;
        line-height: 36px;
        color: rgb(15, 23, 42);
      "
    >
      <div style="display: block; width: 300px">
        Ship
        <span
          style="
            display: inline;
            padding: 0 6px;
            background-image: linear-gradient(90deg, rgb(250, 204, 21), rgb(236, 72, 153));
          "
          >a sliced gradient across two lines</span
        >
        today
      </div>
      <div style="display: block; width: 300px; margin-top: 12px">
        Build
        <span
          style="
            display: inline;
            padding: 0 6px;
            box-decoration-break: clone;
            background-image: linear-gradient(90deg, rgb(34, 197, 94), rgb(59, 130, 246));
          "
          >a cloned gradient on every line</span
        >
      </div>
      <div
        style="
          display: block;
          margin-top: 12px;
          font-size: 40px;
          line-height: 48px;
          font-weight: 700;
        "
      >
        Make it
        <span
          style="
            display: inline;
            background-image: linear-gradient(90deg, rgb(99, 102, 241), rgb(236, 72, 153));
            background-clip: text;
            color: transparent;
          "
          >shine</span
        >
      </div>
    </div>
  </body>
</html>
