<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_important</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 20px;
        width: 100%;
        height: 100%;
        background: rgb(243, 244, 246);
        font-family: "Geist";
      }
      .case {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: white;
        border-radius: 8px;
        padding: 12px 14px;
      }
      .label {
        font-size: 12px;
        color: rgb(100, 116, 139);
        font-family: "Geist Mono";
      }
      .bar {
        height: 26px;
        background: rgb(37, 99, 235);
        border-radius: 4px;
      }
      /* A wide bar means the inline declaration won. */
      .bar {
        width: 120px !important;
      }
      @layer guard {
        .layered {
          width: 120px !important;
        }
      }
      .spin {
        animation: widen 10s;
      }
      @keyframes widen {
        from {
          width: 120px;
        }
        to {
          width: 120px;
        }
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <!-- prettier-ignore -->
    <div class="root"><div class="case"><span class="label">inline !important beats an important unlayered rule</span><div class="bar" style="width: 900px !important"></div></div><div class="case"><span class="label">inline !important beats an important layered rule</span><div class="bar layered" style="width: 900px !important"></div></div><div class="case"><span class="label">inline !important beats an animation</span><div class="bar spin" style="width: 900px !important"></div></div><div class="case"><span class="label">normal inline still loses to an important rule</span><div class="bar" style="width: 900px"></div></div></div>
  </body>
</html>
