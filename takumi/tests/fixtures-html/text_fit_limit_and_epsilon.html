<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_limit_and_epsilon</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 600px; height: 240px">
    <div
      style="
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 20px;
        row-gap: 20px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 32px;
        line-height: 1.2;
        color: rgb(15, 23, 42);
      "
    >
      <div
        style="
          display: block;
          width: 520px;
          white-space: nowrap;
          background-color: rgb(224, 231, 255);
          text-fit: grow 50%;
        "
        >Grow held at 50%</div
      >
      <div
        style="
          display: block;
          width: 520px;
          white-space: nowrap;
          background-color: rgb(254, 226, 226);
          text-fit: shrink 200%;
        "
        >Shrink held at 200% of a width far too narrow for it</div
      >
      <div
        style="
          display: block;
          width: 520px;
          white-space: nowrap;
          background-color: rgb(220, 252, 231);
          text-fit: grow per-line-all;
        "
        >Grow per line</div
      >
    </div>
  </body>
</html>
