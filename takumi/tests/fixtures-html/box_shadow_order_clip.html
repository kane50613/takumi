<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>box_shadow_order_clip</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 100px;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          width: 220px;
          height: 220px;
          border-radius: 24px;
          background-color: rgba(59, 130, 246, 0.25);
          box-shadow: 24px 24px 0 rgb(15, 23, 42);
        "
      ></div>
      <div
        style="
          width: 220px;
          height: 220px;
          background-color: rgb(241, 245, 249);
          box-shadow:
            20px 20px 0 rgb(225, 29, 72),
            40px 40px 0 rgb(37, 99, 235);
        "
      ></div>
      <div
        style="
          width: 220px;
          height: 220px;
          border-radius: 40px;
          background-color: rgb(241, 245, 249);
          box-shadow:
            inset 10.5px 10.5px 16px rgba(15, 23, 42, 0.6),
            8.5px 8.5px 24px rgba(15, 23, 42, 0.4);
        "
      ></div>
    </div>
  </body>
</html>
