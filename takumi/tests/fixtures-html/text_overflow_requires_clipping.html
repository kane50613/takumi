<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_overflow_requires_clipping</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .line {
        width: 600px;
        white-space: nowrap;
        text-overflow: ellipsis;
        background-color: rgb(219, 234, 254);
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        height: 100%;
        padding: 24px;
        font-size: 40px;
        background-color: white;
      "
    >
      <div class="line">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</div>
      <div class="line" style="overflow: hidden; background-color: rgb(220, 252, 231)">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      </div>
    </div>
  </body>
</html>
