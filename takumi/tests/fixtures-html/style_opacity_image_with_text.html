<!doctype html>
<html>

    <title>style_opacity_image_with_text</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div

        height: 100%;

        column-gap: 2rem;
        background-color: rgb(240, 240, 240);
      "
    >
      <div style="display: flex; width: 20rem; height: 20rem; opacity: 0.5">
        <img src="assets/images/yeecord.png" style="display: flex; width: 100%; height: 100%" />

          font-size: 3rem;
