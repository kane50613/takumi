<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>outline_style_without_width</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .box {
        width: 120px;
        height: 80px;
        background-color: rgb(226, 232, 240);
        color: rgb(37, 99, 235);
      }
    </style>
  </head>
  <body style="width: 480px; height: 160px">
    <div
      style="
        display: flex;
        gap: 48px;
        width: 100%;
        height: 100%;
        padding: 40px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div class="box" style="outline-style: solid"></div>
      <div class="box" style="outline-style: dashed"></div>
      <div class="box" style="outline-style: none"></div>
    </div>
  </body>
</html>
