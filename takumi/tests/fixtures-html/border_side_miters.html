<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>border_side_miters</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 640px; height: 280px">
    <div
      style="
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        width: 100%;
        height: 100%;
        padding: 24px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div style="width: 56px; height: 56px; border: 9px dashed rgb(37, 99, 235)"></div>
      <div style="width: 56px; height: 56px; border: 6px dotted rgb(220, 38, 38)"></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border: 10px dashed;
          border-color: rgb(37, 99, 235) rgb(220, 38, 38) rgb(22, 163, 74) rgb(234, 179, 8);
        "
      ></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border: 10px dashed rgb(124, 58, 237);
          border-top-style: solid;
        "
      ></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border: 12px double;
          border-color: rgb(37, 99, 235) rgb(220, 38, 38) rgb(22, 163, 74) rgb(234, 179, 8);
        "
      ></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border: 12px groove;
          border-color: rgb(37, 99, 235) rgb(220, 38, 38) rgb(22, 163, 74) rgb(234, 179, 8);
        "
      ></div>
      <div style="width: 56px; height: 56px; border: 10px inset rgb(37, 99, 235)"></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border: 10px outset;
          border-color: rgb(220, 38, 38) rgb(220, 38, 38) rgb(22, 163, 74) rgb(22, 163, 74);
        "
      ></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border: 10px solid;
          border-color: rgba(37, 99, 235, 0.5) rgba(220, 38, 38, 0.8) rgb(22, 163, 74)
            rgba(234, 179, 8, 0.5);
        "
      ></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border: 10px solid rgba(37, 99, 235, 0.5);
          border-left: none;
        "
      ></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border-style: dashed;
          border-width: 4px 12px 8px 2px;
          border-color: rgb(37, 99, 235) rgb(37, 99, 235) rgb(220, 38, 38) rgb(220, 38, 38);
        "
      ></div>
      <div
        style="
          width: 56px;
          height: 56px;
          border: 12px double rgb(22, 163, 74);
          border-top-style: solid;
        "
      ></div>
    </div>
  </body>
</html>
