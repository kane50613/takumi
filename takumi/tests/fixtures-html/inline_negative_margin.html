<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_negative_margin</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 360px; height: 160px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 24px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 20px;
        line-height: 32px;
        color: rgb(15, 23, 42);
      "
    >
      <div style="display: block">
        before<span style="margin-left: -12px; background-color: rgb(191, 219, 254)">pulled</span
        >after
      </div>
      <div style="display: block">
        left<span style="margin-right: -16px; background-color: rgb(252, 165, 165)">overlap</span
        >right and more words to wrap
      </div>
    </div>
  </body>
