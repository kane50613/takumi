<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .track {
        display: grid;
        grid-template-columns: 200px;
        width: 200px;
        height: 40px;
        background-color: rgb(226, 232, 240);
      }
      .item {
        width: 72px;
        height: 40px;
        background-color: rgb(37, 99, 235);
      }
    </style>
  </head>
  <body style="width: 480px; height: 320px">
    <div
      style="
        display: flex;
        flex-direction: column;
        row-gap: 12px;
        width: 100%;
        height: 100%;
        padding: 16px;
        background-color: rgb(248, 250, 252);
        font-size: 14px;
      "
    >
      <div>justify-self: self-start (item direction: ltr)</div>
      <div class="track">
        <div class="item" style="justify-self: self-start"></div>
      </div>
      <div>justify-self: self-start (item direction: rtl)</div>
      <div class="track">
        <div class="item" style="direction: rtl; justify-self: self-start"></div>
      </div>
      <div>justify-self: self-end (item direction: rtl)</div>
      <div class="track">
        <div class="item" style="direction: rtl; justify-self: self-end"></div>
      </div>
    </div>
  </body>
</html>
