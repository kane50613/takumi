<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_ellipsis_text_nowrap</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        background-color: rgb(240, 240, 240);
        font-size: 48px;
        padding-top: 20px;
        padding-right: 20px;
        padding-bottom: 20px;
        padding-left: 20px;
        overflow-x: hidden;
        overflow-y: hidden;
        width: 100%;
      "
    >
      <span
        style="
          display: flex;
          text-overflow: ellipsis;
          text-wrap-mode: nowrap;
          border-top-width: 1px;
          border-right-width: 1px;
          border-bottom-width: 1px;
          border-left-width: 1px;
          border-top-style: solid;
          border-right-style: solid;
          border-bottom-style: solid;
          border-left-style: solid;
          border-top-color: rgb(255, 0, 0);
          border-right-color: rgb(255, 0, 0);
          border-bottom-color: rgb(255, 0, 0);
          border-left-color: rgb(255, 0, 0);
          word-break: break-all;
          width: 100%;
        "
        >This is a very long piece of text that should demonstrate text wrapping behavior when it
        exceeds the container width. The quick brown fox jumps over the lazy dog.</span
      >
    </div>
  </body>
</html>
