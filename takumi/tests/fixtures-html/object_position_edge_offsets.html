<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>object_position_edge_offsets</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .row {
        display: flex;
        align-items: flex-start;
      }
      img {
        margin: 2px;
        padding: 1px;
        border: 1px solid rgb(128, 128, 128);
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body style="width: 240px; height: 140px; margin: 0">
    <div class="row">
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 8px; height: 8px; object-fit: fill; object-position: bottom 1px right 2px"
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 8px; height: 8px; object-fit: fill; object-position: top 3px left 50%"
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 8px; height: 8px; object-fit: fill; object-position: top 25% left 25%"
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 8px; height: 8px; object-fit: fill; object-position: right 2px bottom 1px"
      />
    </div>
    <div class="row">
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 48px; height: 32px; object-fit: contain; object-position: top right"
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="
          width: 48px;
          height: 32px;
          object-fit: contain;
          object-position: bottom 1px right 2px;
        "
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 48px; height: 32px; object-fit: contain; object-position: top 3px left 50%"
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 48px; height: 32px; object-fit: contain; object-position: top 50% right 25%"
      />
    </div>
    <div class="row">
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 32px; height: 48px; object-fit: cover; object-position: left 4px top"
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 32px; height: 48px; object-fit: cover; object-position: bottom 1px right 2px"
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 32px; height: 48px; object-fit: cover; object-position: top 3px left 50%"
      />
      <img
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAIAAAB/FOjAAAAAJElEQVR42mNkYPjPgB0wYhVlYiAR0F4Dy/+GRuw+qGcYKn4AAG3kA5LRg6r3AAAAAElFTkSuQmCC"
        style="width: 32px; height: 48px; object-fit: cover; object-position: center"
      />
    </div>
  </body>
</html>
