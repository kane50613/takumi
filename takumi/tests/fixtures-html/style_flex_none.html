<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_flex_none</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 600px; height: 240px">
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 40px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div style="display: flex; width: 300px; height: 40px; background-color: rgb(229, 231, 235)">
        <div style="flex: none; width: 200px; background-color: rgb(59, 130, 246)"></div>
        <div style="flex: none; width: 200px; background-color: rgb(234, 179, 8)"></div>
      </div>
      <div style="display: flex; width: 300px; height: 40px; background-color: rgb(229, 231, 235)">
        <div style="width: 200px; background-color: rgb(59, 130, 246)"></div>
        <div style="width: 200px; background-color: rgb(234, 179, 8)"></div>
      </div>
    </div>
  </body>
</html>
