<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>line_clamp_nested_blocks</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      div {
        display: block;
      }
      .clamp {
        width: 340px;
        line-height: 1.25;
        background-color: rgb(219, 234, 254);
      }
      .child {
        color: rgb(29, 78, 216);
      }
      .auto {
        line-clamp: auto;
        max-height: 3.5lh;
        background-color: rgb(220, 252, 231);
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        gap: 24px;
        align-items: flex-start;
        width: 100%;
        height: 100%;
        padding: 24px;
        font-size: 32px;
        background-color: white;
      "
    >
      <div class="clamp" style="line-clamp: 3">
        Line 1
        <div class="child">
          <div>Line 2</div>
          <div>Line 3</div>
          <div>Line 4</div>
        </div>
        Line 5
      </div>
      <div class="clamp auto">
        <div>Line 1</div>
        <div class="child">Line 2<br />Line 3<br />Line 4</div>
        <div>Line 5</div>
      </div>
      <div
        style="
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          overflow: hidden;
          width: 340px;
          background-color: rgb(254, 226, 226);
        "
      >
        <div>Line 1</div>
        <div class="child">Line 2</div>
        <div>Line 3</div>
      </div>
    </div>
  </body>
</html>
