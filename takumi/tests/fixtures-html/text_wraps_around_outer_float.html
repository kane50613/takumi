<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_wraps_around_outer_float</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: block;
        width: 640px;
        padding: 32px;
        font-size: 28px;
        line-height: 40px;
        background-color: rgb(248, 250, 252);
      "
      ><div
        style="
          display: block;
          float: left;
          width: 200px;
          height: 150px;
          margin-right: 24px;
          background-color: rgb(59, 130, 246);
        "
      ></div
      ><div style="display: block"
        >Text in a paragraph after a float wraps beside the float and moves below it once the float
        ends, instead of running over it.</div
      ><div style="display: block"
        >A second paragraph keeps wrapping while the float lasts.</div
      ></div
    >
  </body>
</html>
