<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .column {
        display: block;
        flex: 1;
      }
      .box {
        display: block;
        background-color: rgb(254, 249, 195);
      }
      .float {
        float: left;
        width: 72px;
        height: 72px;
        background-color: rgb(202, 138, 4);
      }
      .after {
        display: block;
        height: 16px;
        background-color: rgb(15, 23, 42);
      }
    </style>
  </head>
  <body style="width: 520px; height: 260px">
    <div
      style="
        display: flex;
        flex-direction: column;
        row-gap: 12px;
        width: 100%;
        height: 100%;
        padding: 16px;
        background-color: rgb(248, 250, 252);
        font-size: 14px;
      "
    >
      <div style="display: flex; column-gap: 16px">
        <div style="flex: 1">contain: none</div>
        <div style="flex: 1">contain: layout paint</div>
      </div>
      <div style="display: flex; column-gap: 16px">
        <div class="column">
          <div class="box" style="contain: none"><div class="float"></div></div>
          <div class="after"></div>
        </div>
        <div class="column">
          <div class="box" style="contain: layout paint"><div class="float"></div></div>
          <div class="after"></div>
        </div>
      </div>
    </div>
  </body>
</html>
