<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>style_filter_sepia</title>
  <base href="../../../">
  <link rel="stylesheet" href="takumi/tests/shared.css">
</head>
<body style="width: 1200px; height: 630px;">
  <div style="display: grid; width: 100%; height: 100%; grid-template-columns: repeat(5, 1fr); row-gap: 16px; column-gap: 16px; justify-content: center; align-items: center; background-color: rgb(255, 255, 255);"><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 150px; height: 150px; filter: sepia(0);" /><span style="display: block;">sepia(0%)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 150px; height: 150px; filter: sepia(0.5);" /><span style="display: block;">sepia(50%)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 150px; height: 150px; filter: sepia(0.75);" /><span style="display: block;">sepia(75%)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 24px;"><img src="assets/images/yeecord.png" style="width: 150px; height: 150px; filter: sepia(1);" /><span style="display: block;">sepia(100%)</span></div></div>
</body>
