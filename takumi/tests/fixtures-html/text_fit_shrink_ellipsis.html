<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_shrink_ellipsis</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .fit {
        display: block;
        width: 600px;
        font-size: 80px;
        font-weight: 700;
        line-height: 1.05;
        text-fit: shrink;
        text-overflow: ellipsis;
        line-clamp: 2;
      }
      .sibling {
        height: 16px;
        background-color: rgb(251, 191, 36);
      }
    </style>
  </head>
  <body style="width: 640px; height: 420px">
    <div
      style="
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        color: rgb(15, 23, 42);
      "
    >
      <div class="fit" style="background-color: rgb(224, 231, 255)"
        >Wolfeschlegelsteinhausenbergerdorff</div
      >
      <div class="sibling"></div>
      <div class="fit" style="background-color: rgb(254, 226, 226); text-fit: shrink 60%"
        >Wolfeschlegelsteinhausenbergerdorff</div
      >
      <div class="sibling"></div>
      <div class="fit" style="background-color: rgb(220, 252, 231)"
        >Dr Wolfeschlegelsteinhausenbergerdorff Senior</div
      >
      <div class="sibling"></div>
    </div>
  </body>
</html>
