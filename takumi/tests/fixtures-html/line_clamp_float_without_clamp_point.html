<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>line_clamp_float_without_clamp_point</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      div {
        display: block;
      }
      .clamp {
        width: 340px;
        line-height: 1.25;
        line-clamp: 2;
        background-color: rgb(220, 252, 231);
      }
      .float {
        float: right;
        width: 80px;
        height: 4lh;
        background-color: rgb(29, 78, 216);
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        gap: 24px;
        align-items: flex-start;
        width: 100%;
        height: 100%;
        padding: 24px;
        font-size: 32px;
        background-color: white;
      "
    >
      <div class="clamp">
        <div class="float"></div>
        Line 1
      </div>
      <div class="clamp">
        <div class="float"></div>
        Line 1<br />Line 2<br />Line 3
      </div>
    </div>
  </body>
</html>
