<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="takumi-presets" content="chromium" />
    <title>button_default</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .styled {
        width: 200px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #4338ca;
        color: #fff;
        font: 600 16px Geist;
      }
    </style>
  </head>
  <body style="width: 320px; height: 210px">
    <div
      style="display: flex; flex-direction: column; gap: 12px; padding: 12px; align-items: start"
    >
      <button>Default</button>
      <button style="height: 40px">Tall</button>
      <fieldset disabled style="margin: 0; padding: 0; border: 0">
        <button>Disabled</button>
      </fieldset>
      <button class="styled">Sign up</button>
    </div>
  </body>
</html>
