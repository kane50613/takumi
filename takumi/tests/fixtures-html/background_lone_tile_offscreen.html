<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>background_lone_tile_offscreen</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 80px;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          width: 400px;
          height: 400px;
          background-color: rgb(241, 245, 249);
          background-image: linear-gradient(rgb(37, 99, 235), rgb(225, 29, 72));
          background-size: 100px 100px;
          background-repeat: repeat-y;
          background-position: -450px 0;
        "
      ></div>
      <div
        style="
          width: 400px;
          height: 400px;
          background-color: rgb(241, 245, 249);
          background-image: linear-gradient(90deg, rgb(37, 99, 235), rgb(225, 29, 72));
          background-size: 100px 100px;
          background-repeat: repeat-x;
          background-position: 0 -450px;
        "
      ></div>
    </div>
  </body>
</html>
