<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>hyphens</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      p {
        display: block;
        width: 130px;
        margin: 0;
        padding: 8px;
        font-family: Geist;
        font-size: 24px;
        background-color: rgb(240, 240, 240);
      }
    </style>
  </head>
  <body style="width: 660px; height: 220px">
    <div style="display: flex; gap: 12px; padding: 12px; align-items: flex-start">
      <p>extra&shy;ordi&shy;nary&shy;ly</p>
      <p style="hyphens: none">extra&shy;ordi&shy;nary&shy;ly</p>
      <p style="hyphenate-character: &quot;=&quot;">extra&shy;ordi&shy;nary&shy;ly</p>
      <p style="hyphens: auto; hyphenate-character: &quot;~&quot;"
        >extra&shy;ordi&shy;nary&shy;ly</p
      >
    </div>
  </body>
</html>
