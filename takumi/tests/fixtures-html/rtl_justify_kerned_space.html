<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>rtl_justify_kerned_space</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      @font-face {
        font-family: "Arabic Space Kern";
        src: url("assets/fonts/noto-sans/noto-sans-arabic-space-kern.subset.ttf") format("truetype");
      }
      .page {
        display: flex;
        gap: 16px;
        width: 100%;
        height: 100%;
        padding: 16px;
        background-color: rgb(255, 255, 255);
        color: rgb(15, 23, 42);
        font-family: "Arabic Space Kern";
        font-size: 15px;
      }
      p {
        display: block;
        width: 130px;
        margin: 0;
        background-color: rgb(219, 234, 254);
      }
    </style>
  </head>
  <body style="width: 340px; height: 170px">
    <div class="page" dir="rtl">
      <p style="text-align: justify">
        يلعب الأطفال في الحديقة بعد الظهر يلعب الأطفال في الحديقة بعد الظهر
      </p>
      <p style="text-align: justify; text-align-last: justify">
        يلعب الأطفال في الحديقة بعد الظهر يلعب الأطفال في الحديقة بعد الظهر
      </p>
    </div>
  </body>
</html>
