<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_wrap_balance_float</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: block;
        width: 760px;
        background-color: rgb(248, 250, 252);
        padding: 28px;
        font-size: 34px;
        line-height: 1.3;
        text-align: right;
        text-wrap-style: balance;
        color: rgb(24, 34, 53);
      "
    >
      <div
        style="
          display: inline-block;
          float: left;
          width: 200px;
          height: 260px;
          margin-right: 24px;
          margin-bottom: 12px;
          background-color: rgb(31, 64, 122);
        "
      ></div>
      Balanced lines beside a float keep the float against the container while the text breaks at
      the narrower balanced width.
    </div>
  </body>
</html>
