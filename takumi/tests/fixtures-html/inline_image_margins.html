<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_image_margins</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: 48px;
        width: 100%;
        height: 100%;
        padding: 60px;
        background-color: rgb(255, 255, 255);
        font-size: 56px;
      "
    >
      <p style="margin: 0; background-color: rgb(241, 245, 249)"
        ><img
          src="assets/images/luma.svg"
          style="width: 64px; height: 64px; margin-right: 32px"
        />Icon with a right margin</p
      >
      <p style="margin: 0; background-color: rgb(241, 245, 249)"
        >Text<img
          src="assets/images/yeecord.png"
          style="
            width: 96px;
            height: 96px;
            margin: 24px 40px 12px 20px;
            padding: 8px;
            border: 6px solid rgb(37, 99, 235);
            background-color: rgb(254, 226, 226);
          "
        />between margins</p
      >
    </div>
  </body>
</html>
