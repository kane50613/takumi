<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>line_clamp_lines_with_auto</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      div {
        display: block;
      }
      .clamp {
        width: 340px;
        line-height: 1.25;
        background-color: rgb(220, 252, 231);
      }
      .pulled {
        margin-top: -1lh;
        min-height: 1lh;
        color: rgb(29, 78, 216);
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        gap: 24px;
        align-items: flex-start;
        width: 100%;
        height: 100%;
        padding: 24px;
        font-size: 32px;
        background-color: white;
      "
    >
      <div class="clamp" style="line-clamp: 4 auto; max-height: 2lh">
        Line 1<br />Line 2<br />Line 3<br />Line 4<br />Line 5
      </div>
      <div class="clamp" style="line-clamp: 2 auto; max-height: 4lh">
        Line 1<br />Line 2<br />Line 3<br />Line 4<br />Line 5
      </div>
      <div style="padding-top: 1lh">
        <div class="clamp" style="line-clamp: auto; max-height: 3lh">
          <div class="pulled">
            <div>Line 1<br />Line 2<br />Line 3<br />Line 4<br />Line 5</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
