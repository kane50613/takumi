<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_fixed_anchors_to_viewport</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          display: block;
          position: relative;
          width: 200px;
          height: 200px;
          margin-top: 160px;
          margin-left: 160px;
          background-color: rgb(220, 220, 220);
        "
      >
        <div
          style="
            display: flex;
            position: fixed;
            width: 100px;
            height: 100px;
            top: 10px;
            left: 10px;
            background-color: rgb(160, 0, 200);
          "
        ></div>
      </div>
    </div>
  </body>
</html>
