<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_shrink_past_spacing</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 20px;
        width: 100%;
        height: 100%;
        background: rgb(241, 245, 249);
        font-family: "Geist";
      }
      .fit {
        display: block;
        width: 40px;
        margin-bottom: 16px;
        white-space: nowrap;
        font-size: 20px;
        letter-spacing: 30px;
        background: rgb(254, 243, 199);
        text-fit: shrink;
      }
    </style>
  </head>
  <body style="width: 320px; height: 200px">
    <div class="root">
      <div class="fit">AB</div>
      <div class="fit" style="text-fit: shrink per-line">AB</div>
      <div class="fit" style="letter-spacing: 8px">ABCD</div>
    </div>
  </body>
</html>
