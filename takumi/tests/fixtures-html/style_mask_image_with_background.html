<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_mask_image_with_background</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(135deg, rgb(102, 126, 234) 0%, rgb(118, 75, 162) 100%);
        background-position: center center;
        mask-image: radial-gradient(circle, rgb(0, 0, 0) 40%, rgba(0, 0, 0, 0) 70%);
        mask-position: center center;
      "
    ></div>
  </body>
</html>
