<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_background_clip</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 20px;
        width: 100%;
        height: 100%;
        background: rgb(241, 245, 249);
        font-family: "Geist";
        font-size: 22px;
        line-height: 48px;
      }
      span {
        padding: 6px 12px;
        border: 4px dashed rgb(30, 41, 59);
        background-color: rgb(250, 204, 21);
      }
    </style>
  </head>
  <body style="width: 480px; height: 240px">
    <div class="root">
      <p>border <span>border-box</span></p>
      <p>padding <span style="background-clip: padding-box">padding-box</span></p>
      <p>content <span style="background-clip: content-box">content-box wraps here</span></p>
    </div>
  </body>
</html>
