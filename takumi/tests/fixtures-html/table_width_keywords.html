<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>table_width_keywords</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: block;
        padding: 16px;
        width: 100%;
        height: 100%;
        background: rgb(243, 244, 246);
        font-family: "Geist";
        font-size: 16px;
      }
      table {
        display: table;
        border-spacing: 2px;
        background: rgb(255, 255, 255);
        margin-bottom: 12px;
      }
      tbody {
        display: table-row-group;
        vertical-align: middle;
      }
      tr {
        display: table-row;
        vertical-align: inherit;
      }
      td {
        display: table-cell;
        vertical-align: inherit;
        border: 1px solid rgb(148, 163, 184);
        padding: 2px 6px;
      }
    </style>
  </head>
  <body style="width: 480px; height: 360px">
    <div class="root">
      <div style="display: block; width: 220px; background: rgb(226, 232, 240)">
        <table style="width: max-content">
          <tr><td>max-content keeps this on one line</td><td>b</td></tr>
        </table>
        <table style="width: min-content">
          <tr><td>min-content wraps every word</td><td>b</td></tr>
        </table>
        <table style="width: fit-content">
          <tr><td>fit-content shrinks to fit the box</td><td>b</td></tr>
        </table>
        <table style="width: stretch">
          <tr><td>stretch</td><td>b</td></tr>
        </table>
      </div>
    </div>
  </body>
</html>
