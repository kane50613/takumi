<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>filter_blur_past_canvas_edge</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        position: relative;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
      "
    >
      <div
        style="
          position: absolute;
          top: 165px;
          left: -150px;
          width: 300px;
          height: 300px;
          border-radius: 50%;
          background-color: rgb(255, 255, 255);
          filter: blur(60px);
        "
      ></div>
      <div
        style="
          position: absolute;
          top: 165px;
          left: 600px;
          width: 300px;
          height: 300px;
          border-radius: 50%;
          background-color: rgb(255, 255, 255);
          filter: blur(60px);
        "
      ></div>
    </div>
  </body>
</html>
