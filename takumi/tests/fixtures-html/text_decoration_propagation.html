<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_decoration_propagation</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 420px; height: 400px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 16px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 20px;
        line-height: 30px;
        color: rgb(15, 23, 42);
      "
    >
      <div
        style="
          display: block;
          text-decoration: underline rgb(37, 99, 235);
          text-decoration-thickness: 2px;
        "
      >
        block <span style="display: inline; font-size: 26px">span</span>
        <span style="display: inline; text-decoration: line-through rgb(220, 38, 38) 3px"
          >both</span
        >
        <span style="display: inline-block">inline-block</span>
      </div>
      <div
        style="
          display: block;
          position: relative;
          height: 60px;
          text-decoration: overline rgb(22, 163, 74);
        "
      >
        <span style="display: block; float: right">float</span> flow
        <span style="position: absolute; left: 0; top: 30px">absolute</span>
      </div>
      <div
        style="display: flex; column-gap: 16px; text-decoration: underline wavy rgb(147, 51, 234)"
      >
        <span style="display: block">flex item</span>
        <span style="display: block; text-decoration: underline dotted rgb(234, 88, 12)"
          >own too</span
        >
      </div>
      <div
        style="
          display: list-item;
          list-style-type: decimal;
          margin-left: 24px;
          margin-top: 8px;
          text-decoration: underline;
        "
      >
        list item
      </div>
      <div
        style="
          display: list-item;
          list-style-type: decimal;
          list-style-position: inside;
          text-decoration: underline;
        "
      >
        inside marker
      </div>
    </div>
  </body>
</html>
