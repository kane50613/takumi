<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>style_filter_drop_shadow</title>
  <base href="../../../">
  <link rel="stylesheet" href="takumi/tests/shared.css">
</head>
<body style="width: 1200px; height: 630px;">
  <div style="display: grid; width: 100%; height: 100%; grid-template-columns: repeat(5, 1fr); row-gap: 16px; column-gap: 16px; justify-content: center; align-items: center; background-color: rgb(255, 255, 255);"><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 16px;"><img src="assets/images/yeecord.png" style="width: 120px; height: 120px; filter: drop-shadow(5px 5px 5px rgb(0, 0, 0));" /><span style="display: block;">drop-shadow(5px 5px 5px black)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 16px;"><img src="assets/images/yeecord.png" style="width: 120px; height: 120px; filter: drop-shadow(10px 10px 10px rgba(0, 0, 0, 0.501961));" /><span style="display: block;">drop-shadow(10px 10px 10px rgba(0,0,0,0.5))</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 16px;"><img src="assets/images/yeecord.png" style="width: 120px; height: 120px; filter: drop-shadow(-5px -5px 8px rgb(255, 0, 0));" /><span style="display: block;">drop-shadow(-5px -5px 8px red)</span></div><div style="display: flex; flex-direction: column; align-items: center; row-gap: 16px; column-gap: 16px; font-size: 16px;"><img src="assets/images/yeecord.png" style="width: 120px; height: 120px; filter: drop-shadow(0px 10px 15px rgb(0, 0, 255));" /><span style="display: block;">drop-shadow(0px 10px 15px blue)</span></div></div>
</body>
</html>
