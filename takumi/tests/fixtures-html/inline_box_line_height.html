<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_box_line_height</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 600px; height: 320px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 24px 32px;
        background-color: rgb(248, 250, 252);
        font-family: Geist;
        font-size: 28px;
        line-height: 2.4;
        color: rgb(15, 23, 42);
      "
    >
      <span style="background-color: rgb(254, 215, 170)">background</span>
      <span style="outline: 3px solid rgb(37, 99, 235)">outline</span>
      <span
        style="
          background-color: rgb(191, 219, 254);
          outline: 2px dashed rgb(225, 29, 72);
          outline-offset: 2px;
        "
        >a background and outline that wrap across lines</span
      >
      <span style="font-size: 16px; background-color: rgb(233, 213, 255)">small</span>
    </div>
  </body>
</html>
