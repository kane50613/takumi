<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_containing_block</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 480px; height: 280px">
    <div
      style="
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        padding: 32px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 24px;
        line-height: 40px;
        color: rgb(15, 23, 42);
      "
    >
      One
      <span style="position: relative; padding: 0 6px; border: 3px solid rgb(100, 116, 139)"
        >inline<span
          style="
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(59, 130, 246, 0.4);
          "
        ></span
        ><span
          style="
            position: absolute;
            right: 0;
            bottom: 100%;
            width: 16px;
            height: 8px;
            background-color: rgb(239, 68, 68);
          "
        ></span
      ></span>
      block, then a
      <span style="position: relative; border-left: 4px solid rgb(100, 116, 139)"
        >wrapping span across two<span
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(34, 197, 94, 0.35);
          "
        ></span>
        lines</span
      >
      and an
      <span style="position: relative"
        ><span
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 12px;
            height: 12px;
            background-color: rgb(168, 85, 247);
          "
        ></span
      ></span>
      empty one, then yet another long unbreak<span
        style="position: absolute; width: 6px; height: 6px; background-color: rgb(249, 115, 22)"
      ></span
      >able word.
    </div>
  </body>
</html>
