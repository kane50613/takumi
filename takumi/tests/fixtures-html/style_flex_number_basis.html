<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_flex_number_basis</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .column {
        display: flex;
        flex-direction: column;
        width: 120px;
        padding: 10px;
        background-color: rgb(229, 231, 235);
      }
      .item {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background-color: rgb(59, 130, 246);
      }
    </style>
  </head>
  <body style="width: 520px; height: 320px">
    <div
      style="
        display: flex;
        align-items: flex-start;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 40px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div class="column">
        <div class="item" style="flex: 1"><div style="height: 200px"></div></div>
      </div>
      <div class="column">
        <div class="item" style="flex: 2 2"><div style="height: 200px"></div></div>
      </div>
      <div class="column">
        <div class="item" style="flex: 1 1 0px"><div style="height: 200px"></div></div>
      </div>
    </div>
  </body>
</html>
