<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>corner_shape_opposite_overlap</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 560px; height: 180px">
    <div
      style="
        display: flex;
        gap: 40px;
        width: 100%;
        height: 100%;
        padding: 40px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          display: block;
          width: 220px;
          height: 100px;
          border-top-left-radius: 180px 80px;
          border-bottom-right-radius: 180px 80px;
          corner-shape: scoop;
          background-color: rgb(37, 99, 235);
        "
      ></div>
      <div
        style="
          display: block;
          width: 220px;
          height: 100px;
          border-top-right-radius: 160px 70px;
          border-bottom-left-radius: 160px 70px;
          corner-shape: notch;
          background-color: rgb(220, 38, 38);
        "
      ></div>
    </div>
  </body>
</html>
