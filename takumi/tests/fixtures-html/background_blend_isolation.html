<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>background_blend_isolation</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        gap: 80px;
        width: 100%;
        height: 100%;
        padding: 80px;
        background-image: linear-gradient(90deg, rgb(34, 197, 94), rgb(234, 179, 8));
      "
    >
      <div
        style="
          width: 480px;
          height: 470px;
          background-image:
            linear-gradient(rgb(59, 130, 246), rgb(59, 130, 246)),
            linear-gradient(180deg, rgb(255, 255, 255), rgb(244, 63, 94));
          background-size:
            100% 100%,
            50% 100%;
          background-repeat: no-repeat;
          background-blend-mode: multiply, normal;
        "
      ></div>
      <div
        style="
          width: 480px;
          height: 470px;
          border: 60px solid rgba(0, 0, 0, 0.1);
          background-color: rgba(59, 130, 246, 0.5);
          background-clip: border-area;
        "
      ></div>
    </div>
  </body>
</html>
