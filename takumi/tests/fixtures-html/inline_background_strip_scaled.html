<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_background_strip_scaled</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .page {
        width: 100%;
        height: 100%;
        padding: 24px;
        background-color: white;
        font-size: 28px;
        line-height: 1.6;
      }
      .rotated {
        transform: scale(0.3);
      }
      mark {
        background-image: linear-gradient(90deg, #ffb703, #fb8500 40%, #219ebc);
        background-position: center center;
        color: #023047;
      }
    </style>
  </head>
  <body style="width: 420px; height: 260px">
    <div class="page rotated">
      A <mark>highlighted run of words that wraps across several lines</mark> ends here.
    </div>
  </body>
</html>
