<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_color_scheme_light_dark</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      :root {
        --fill: light-dark(rgb(239, 68, 68), rgb(59, 130, 246));
      }
      div {
        display: block;
        width: 120px;
        height: 24px;
        margin: 8px;
        background: var(--fill);
        border: 4px solid light-dark(rgb(234, 179, 8), rgb(34, 197, 94));
      }
      .dark {
        color-scheme: dark;
      }
      .either {
        color-scheme: light dark;
      }
      .light {
        color-scheme: light;
      }
      .ink {
        color: light-dark(rgb(168, 85, 247), rgb(20, 184, 166));
        background: currentColor;
      }
      .group {
        width: auto;
        height: auto;
        margin: 0;
        border: 0;
        background: none;
      }
    </style>
  </head>
  <body style="width: 160px; height: 280px">
    <div></div>
    <div class="dark"></div>
    <div class="either"></div>
    <div class="group dark">
      <div class="light"></div>
      <div class="ink"></div>
    </div>
  </body>
</html>
