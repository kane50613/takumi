<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_background_clip_text_nested</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 640px; height: 360px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 48px;
        line-height: 72px;
        font-weight: 700;
        color: rgb(15, 23, 42);
      "
    >
      <div style="display: block">
        <span
          style="
            display: inline;
            background-image: linear-gradient(90deg, rgb(37, 99, 235), rgb(219, 39, 119));
            background-clip: text;
            color: rgba(0, 0, 0, 0);
          "
          >Base
          <span
            style="
              display: inline;
              background-image: linear-gradient(
                180deg,
                rgba(250, 204, 21, 0) 0%,
                rgba(250, 204, 21, 0) 50%,
                rgb(250, 204, 21) 50%
              );
              background-clip: text;
            "
            >over</span
          >
          <span style="display: inline; background-clip: text">bare</span></span
        >
      </div>
      <div style="display: block">
        <span
          style="
            display: inline;
            background-image: linear-gradient(90deg, rgb(22, 163, 74), rgb(8, 145, 178));
            background-clip: text;
            color: rgba(0, 0, 0, 0);
          "
          >Clip
          <span style="display: inline; background-color: rgb(254, 226, 226)">boxed</span></span
        >
      </div>
      <div style="display: block">
        <span
          style="
            display: inline;
            background-image: linear-gradient(90deg, rgb(234, 88, 12), rgb(147, 51, 234));
            background-clip: text;
            color: rgba(0, 0, 0, 0);
            text-shadow: 3px 3px 0 rgba(15, 23, 42, 0.35);
          "
          >Shadowed</span
        >
      </div>
    </div>
  </body>
</html>
