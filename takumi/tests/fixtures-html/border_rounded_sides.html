<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>border_rounded_sides</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 720px; height: 300px">
    <div
      style="
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        width: 100%;
        height: 100%;
        padding: 24px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="width: 64px; height: 64px; border: 10px dashed rgb(37, 99, 235); border-radius: 20px"
      ></div>
      <div
        style="width: 64px; height: 64px; border: 8px dotted rgb(220, 38, 38); border-radius: 24px"
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border: 10px solid;
          border-color: rgb(37, 99, 235) rgb(220, 38, 38) rgb(22, 163, 74) rgb(234, 179, 8);
          border-radius: 20px;
        "
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border: 12px double;
          border-color: rgb(37, 99, 235) rgb(220, 38, 38) rgb(22, 163, 74) rgb(234, 179, 8);
          border-radius: 24px;
        "
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border: 12px groove rgb(124, 58, 237);
          border-radius: 20px;
        "
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border: 12px ridge;
          border-color: rgb(37, 99, 235) rgb(220, 38, 38) rgb(22, 163, 74) rgb(234, 179, 8);
          border-radius: 16px;
        "
      ></div>
      <div
        style="width: 64px; height: 64px; border: 10px inset rgb(37, 99, 235); border-radius: 6px"
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border: 10px solid;
          border-color: rgba(37, 99, 235, 0.5) rgba(220, 38, 38, 0.8) rgb(22, 163, 74)
            rgba(234, 179, 8, 0.5);
          border-radius: 20px;
        "
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border-style: solid;
          border-width: 4px 24px 12px 2px;
          border-color: rgb(37, 99, 235) rgb(220, 38, 38) rgb(22, 163, 74) rgb(234, 179, 8);
          border-radius: 40px;
        "
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border: 10px dashed rgb(22, 163, 74);
          border-top-style: solid;
          border-radius: 16px 4px 28px 0;
        "
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border: 14px solid rgb(37, 99, 235);
          border-bottom-color: rgb(220, 38, 38);
          border-radius: 9999px;
        "
      ></div>
      <div
        style="
          width: 64px;
          height: 64px;
          border: 12px solid rgb(234, 179, 8);
          border-left: none;
          border-radius: 24px;
        "
      ></div>
    </div>
  </body>
</html>
