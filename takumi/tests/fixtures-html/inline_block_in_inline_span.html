<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_block_in_inline_span</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 600px; height: 420px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 20px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 24px;
        line-height: 32px;
        color: rgb(15, 23, 42);
      "
    >
      Before
      <span
        style="
          background-color: rgb(254, 240, 138);
          border: 3px solid rgb(234, 88, 12);
          padding: 4px 10px;
        "
      >
        inline start
        <div
          style="display: block; margin: 6px 0; padding: 8px; background-color: rgb(191, 219, 254)"
        >
          Block inside the span
        </div>
        inline end
      </span>
      after.
      <span
        style="
          background-color: rgb(187, 247, 208);
          border: 2px solid rgb(22, 163, 74);
          padding: 2px 6px;
        "
      >
        outer
        <span style="background-color: rgb(251, 207, 232); padding: 2px 6px">
          inner
          <div style="display: block; padding: 6px; background-color: rgb(221, 214, 254)">
            Nested block
          </div>
          tail
        </span>
        rest
      </span>
    </div>
  </body>
</html>
