<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_math_functions</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .column {
        display: block;
        width: 280px;
        padding: 8px;
        font-size: 10px;
      }
      .bar {
        display: block;
        height: 12px;
        margin-bottom: 4px;
        background: rgb(59, 130, 246);
      }
      .min {
        width: min(200px, 50%);
      }
      .max {
        width: max(40px, 25%, 6em);
      }
      .clamp {
        width: clamp(60px, 10% + 5em, 120px);
      }
      .round {
        width: round(up, 33%, 40px);
      }
      .mixed {
        width: calc(100% - min(80px, 40%));
        background: rgb(239, 68, 68);
      }
      .trig {
        width: calc(200px * sin(30deg) + hypot(30px, 40px));
        background: rgb(34, 197, 94);
      }
      .offset {
        margin-left: mod(-37px, 25px);
        width: abs(-50px);
        background: rgb(168, 85, 247);
      }
    </style>
  </head>
  <body style="width: 296px; height: 128px">
    <div class="column">
      <div class="bar min"></div>
      <div class="bar max"></div>
      <div class="bar clamp"></div>
      <div class="bar round"></div>
      <div class="bar mixed"></div>
      <div class="bar trig"></div>
      <div class="bar offset"></div>
    </div>
  </body>
</html>
