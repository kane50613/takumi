<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_outline_styles</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: block;
        width: 100%;
        height: 100%;
        padding: 60px 80px;
        background-color: rgb(255, 255, 255);
        font-family: Geist;
        font-size: 34px;
        line-height: 2.2;
        color: rgb(15, 23, 42);
      "
    >
      <span style="outline: 6px solid rgb(37, 99, 235)">solid</span> /
      <span style="outline: 6px dashed rgb(225, 29, 72)">dashed</span> /
      <span style="outline: 6px dotted rgb(22, 163, 74)">dotted</span> /
      <span style="outline: 9px double rgb(147, 51, 234)">double</span> /
      <span style="outline: 8px groove rgb(100, 116, 139)">groove</span> /
      <span style="outline: 8px ridge rgb(100, 116, 139)">ridge</span> /
      <span style="outline: 8px inset rgb(100, 116, 139)">inset</span> /
      <span style="outline: 8px outset rgb(100, 116, 139)">outset</span> /
      <span style="outline: 6px dashed rgba(225, 29, 72, 0.5); outline-offset: 4px"
        >a translucent dashed outline that wraps across lines</span
      >
    </div>
  </body>
</html>
