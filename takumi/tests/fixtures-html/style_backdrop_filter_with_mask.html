<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>style_backdrop_filter_with_mask</title>
  <base href="../../../">
  <link rel="stylesheet" href="takumi/tests/shared.css">
</head>
<body style="width: 1200px; height: 630px;">
  <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background-color: rgb(0, 0, 0); background-image: linear-gradient(to right, rgb(255, 255, 255) 8px, rgba(0, 0, 0, 0.000000) 8px), linear-gradient(rgb(255, 255, 255) 8px, rgba(0, 0, 0, 0.000000) 8px); background-size: 48px 48px; background-repeat: repeat, repeat;"><div style="position: absolute; top: 0px; right: 0px; bottom: 0px; left: 0px; background-color: rgb(239, 68, 68); mask-image: linear-gradient(rgba(0, 0, 0, 0.000000) 10%, rgb(0, 0, 0) 100%);"></div><div style="position: absolute; top: 0px; right: 0px; bottom: 0px; left: 0px; backdrop-filter: blur(24px); mask-image: radial-gradient(rgba(0, 0, 0, 0.000000) 30.000002%, rgb(0, 0, 0) 100%);"></div><span style="display: flex; font-size: 48px; font-weight: 700; color: rgb(255, 255, 255);">Sharp center, blurred edges</span></div>
</body>
</html>
