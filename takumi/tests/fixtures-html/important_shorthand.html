<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>important_shorthand</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .root {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-content: start;
        gap: 14px;
        padding: 20px;
        width: 100%;
        height: 100%;
        background: rgb(243, 244, 246);
        font-family: "Geist";
      }
      .case {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: white;
        border-radius: 8px;
        padding: 12px 14px;
      }
      .css {
        display: block;
        font-size: 12px;
        line-height: 1.5;
        color: rgb(100, 116, 139);
        font-family: "Geist Mono";
        white-space-collapse: preserve-breaks;
      }
      .bar {
        width: 120px;
        height: 24px;
        border-radius: 4px;
        background: rgb(37, 99, 235);
      }
      .bg {
        background: rgb(37, 99, 235) !important;
      }
      .case .bg {
        background: rgb(220, 38, 38);
      }
      .u {
        border-bottom: 6px solid rgb(22, 163, 74) !important;
      }
      .case .u {
        border: 0;
      }
      .m {
        transform: translateX(240px) !important;
      }
      .case .m {
        transform: none;
      }
      .sheet {
        background: rgb(220, 38, 38) !important;
      }
    </style>
  </head>
  <body style="width: 1200px; height: 260px">
    <div class="root"
      ><div class="case"
        ><span class="css"
          >.bg { background: blue !important }&#10;.case .bg { background: red }</span
        ><div class="bar bg"></div></div
      ><div class="case"
        ><span class="css"
          >.u { border-bottom: 6px solid green !important }&#10;.case .u { border: 0 }</span
        ><div class="bar u"></div></div
      ><div class="case"
        ><span class="css"
          >.m { transform: translateX(240px) !important }&#10;.case .m { transform: none }</span
        ><div class="bar m"></div></div
      ><div class="case"
        ><span class="css"
          >.sheet { background: red !important }&#10;style="background: blue !important"</span
        ><div class="bar sheet" style="background: rgb(37, 99, 235) !important"></div></div
    ></div>
  </body>
</html>
