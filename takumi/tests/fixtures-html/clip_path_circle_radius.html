<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clip_path_circle_radius</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .cell {
        width: 200px;
        height: 120px;
        background-image: linear-gradient(135deg, rgb(239, 68, 68), rgb(59, 130, 246));
      }
    </style>
  </head>
  <body style="width: 720px; height: 320px">
    <div
      style="
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        width: 100%;
        height: 100%;
        padding: 24px;
        background-color: rgb(255, 255, 255);
      "
    >
      <div class="cell" style="clip-path: circle(50%)"></div>
      <div class="cell" style="clip-path: circle(closest-side at 30% 40%)"></div>
      <div class="cell" style="clip-path: circle(farthest-side at 30% 40%)"></div>
      <div class="cell" style="clip-path: circle(40px at 90% 20%)"></div>
      <div class="cell" style="clip-path: ellipse(closest-side farthest-side at 20% 50%)"></div>
      <div class="cell" style="clip-path: ellipse(50% 50%)"></div>
    </div>
  </body>
</html>
