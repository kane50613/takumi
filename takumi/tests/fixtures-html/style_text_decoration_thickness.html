<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_text_decoration_thickness</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        background-color: rgb(240, 240, 240);
        flex-direction: column;
        row-gap: 20px;
        padding-top: 40px;
        padding-bottom: 40px;
      "
    >
      <span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >auto (48/10=4.8px): thickness parapsychologists</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: from-font;
        "
        >from-font: thickness parapsychologists</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: 2px;
        "
        >2px: thickness parapsychologists</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: 5px;
        "
        >5px: thickness parapsychologists</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: 10px;
        "
        >10px: thickness parapsychologists</span
      >
    </div>
  </body>
</html>
