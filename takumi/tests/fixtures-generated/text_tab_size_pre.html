<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_tab_size_pre</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div style="display: flex; flex-direction: column; background-color: rgb(240, 240, 240)">
      <div style="display: flex; flex-direction: column">
        <span style="display: flex; font-size: 16px">default</span
        ><span
          style="
            display: flex;
            font-family: &quot;Geist Mono&quot;;
            font-size: 20px;
            text-wrap-mode: nowrap;
            white-space-collapse: preserve;
          "
          >fn main() { let x = 1; nested }</span
        >
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="display: flex; font-size: 16px">tab-size: 2</span
        ><span
          style="
            display: flex;
            font-family: &quot;Geist Mono&quot;;
            font-size: 20px;
            text-wrap-mode: nowrap;
            white-space-collapse: preserve;
            tab-size: 2;
          "
          >fn main() { let x = 1; nested }</span
        >
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="display: flex; font-size: 16px">tab-size: 8</span
        ><span
          style="
            display: flex;
            font-family: &quot;Geist Mono&quot;;
            font-size: 20px;
            text-wrap-mode: nowrap;
            white-space-collapse: preserve;
            tab-size: 8;
          "
          >fn main() { let x = 1; nested }</span
        >
      </div>
    </div>
  </body>
</html>
