<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_corner_shape_squircle</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 0, 0);
        border-top-left-radius: 60px 60px;
        border-top-right-radius: 60px 60px;
        border-bottom-right-radius: 60px 60px;
        border-bottom-left-radius: 60px 60px;
        corner-top-left-shape: squircle;
        corner-top-right-shape: squircle;
        corner-bottom-right-shape: squircle;
        corner-bottom-left-shape: squircle;
      "
    ></div>
  </body>
</html>
