<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_span_text_stroke</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background-color: rgb(255, 255, 255);
        font-size: 72px;
        font-weight: 700;
      "
    >
      <span style="display: inline">Plain </span
      ><span
        style="
          display: inline;
          -webkit-text-stroke-width: 4px;
          -webkit-text-stroke-color: rgb(255, 0, 0);
        "
        >Stroked</span
      >
    </div>
  </body>
</html>
