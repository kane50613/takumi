<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_background_image_repeating_hard_stop</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;

          rgb(251, 191, 36) 0px,
          rgb(251, 191, 36) 10px,
          rgb(245, 158, 11) 10px,
          rgb(245, 158, 11) 20px

        background-position: center center;
      "
    ></div>
