<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_text_underline_position</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        background-color: rgb(240, 240, 240);
        flex-direction: column;
        row-gap: 20px;
        padding-top: 40px;
        padding-bottom: 40px;
      "
    >
      <span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-underline-position: auto;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >auto: pgjy underline</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-underline-position: from-font;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >from-font: pgjy underline</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-underline-position: under;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >under: pgjy underline</span
      >
      <div style="text-underline-position: under">
        <span
          style="
            display: block;
            width: 100%;
            text-align: center;
            font-size: 48px;
            text-decoration-line: underline;
            text-decoration-style: solid;
            text-decoration-color: rgb(255, 0, 0);
            text-decoration-thickness: auto;
          "
          >inherited: pgjy underline</span
        >
      </div>
    </div>
  </body>
</html>
