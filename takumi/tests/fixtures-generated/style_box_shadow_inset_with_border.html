<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_box_shadow_inset_with_border</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div style="display: flex; width: 100%; height: 100%; background-color: rgb(230, 230, 230)">
      <div
        style="
          display: flex;
          width: 240px;
          height: 160px;
          background-color: rgb(255, 255, 255);
          border-top-left-radius: 16px 16px;
          border-top-right-radius: 16px 16px;
          border-bottom-right-radius: 16px 16px;
          border-bottom-left-radius: 16px 16px;
          border-top-width: 18px;
          border-right-width: 18px;
          border-bottom-width: 18px;
          border-left-width: 18px;
          border-top-style: solid;
          border-right-style: solid;
          border-bottom-style: solid;
          border-left-style: solid;
          border-top-color: rgb(120, 140, 200);
          border-right-color: rgb(120, 140, 200);
          border-bottom-color: rgb(120, 140, 200);
          border-left-color: rgb(120, 140, 200);
          box-shadow: inset 0px 0px 0px 30px rgba(0, 0, 0, 0.6);
        "
      ></div>
    </div>
  </body>
</html>
