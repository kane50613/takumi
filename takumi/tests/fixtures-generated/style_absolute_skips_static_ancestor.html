<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_absolute_skips_static_ancestor</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          display: block;
          position: relative;
          width: 300px;
          height: 300px;
          background-color: rgb(0, 0, 200);
        "
      >
        <div
          style="
            display: block;
            position: static;
            width: 120px;
            height: 120px;
            background-color: rgb(240, 220, 0);
          "
        >
          <div
            style="
              display: flex;
              position: absolute;
              width: 80px;
              height: 80px;
              bottom: 0px;
              right: 0px;
              background-color: rgb(0, 200, 0);
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
