<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_outline_with_text</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(15, 23, 42);
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          display: inline-block;
          background-color: rgb(139, 92, 246);
          padding-top: 12px;
          padding-right: 32px;
          padding-bottom: 12px;
          padding-left: 32px;
          border-top-left-radius: 9999px 9999px;
          border-top-right-radius: 9999px 9999px;
          border-bottom-right-radius: 9999px 9999px;
          border-bottom-left-radius: 9999px 9999px;
          outline-width: 6px;
          outline-color: rgb(196, 181, 253);
          outline-offset: -12px;
          outline-style: solid;
        "
      >
        <span style="font-size: 28px; color: rgb(255, 255, 255)">Inner Outline</span>
      </div>
    </div>
  </body>
</html>
