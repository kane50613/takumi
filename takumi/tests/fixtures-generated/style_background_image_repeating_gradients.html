<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_background_image_repeating_gradients</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div style="display: flex; flex-direction: column; width: 100%; height: 100%">
      <div
        style="
          display: flex;
          width: 100%;
          flex-grow: 1;
          background-image: repeating-linear-gradient(
            90deg,
            rgba(99, 102, 241, 0.180392) 0px,
            rgba(56, 189, 248, 0.141176) 48px,
            rgba(99, 102, 241, 0.180392) 96px
          );
          background-color: rgb(11, 16, 32);
        "
      ></div>
      <div
        style="
          display: flex;
          width: 100%;
          flex-grow: 1;
          background-image: repeating-radial-gradient(
            circle 320px,
            rgba(56, 189, 248, 0.160784) 0px,
            rgba(99, 102, 241, 0.101961) 40px,
            rgba(56, 189, 248, 0.160784) 80px
          );
          background-color: rgb(11, 16, 32);
        "
      ></div>
      <div
        style="
          display: flex;
          width: 100%;
          flex-grow: 1;
          background-image: repeating-conic-gradient(
            rgba(99, 102, 241, 0.160784) 0%,
            rgba(56, 189, 248, 0.121569) 25%,
            rgba(99, 102, 241, 0.160784) 50%
          );
          background-color: rgb(11, 16, 32);
        "
      ></div>
    </div>
  </body>
</html>
