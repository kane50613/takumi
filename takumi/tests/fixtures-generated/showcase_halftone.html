<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>showcase_halftone</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .stage {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        font-family: Geist;
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      .stage {
        background-color: #fff;
        isolation: isolate;
      }
      .dots {
        background-image:
          radial-gradient(circle closest-side, #666, #fff), linear-gradient(115deg, #333, #fff);
        background-size:
          14px 14px,
          100% 100%;
        background-repeat: space, no-repeat;
        background-blend-mode: multiply;
        filter: contrast(14);
      }
      .ink {
        background-color: #e11d48;
        mix-blend-mode: lighten;
      }
      .poster {
        padding: 18px 54px;
        background-color: #fffdf5;
        border: 6px solid #111;
        border-radius: 18px;
        box-shadow: 14px 14px 0 #111;
        font-size: 132px;
        font-weight: 900;
        letter-spacing: -4px;
        color: #111;
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div class="stage">
      <div class="layer dots"></div>
      <div class="layer ink"></div>
      <span class="poster">HALFTONE</span>
    </div>
  </body>
</html>
