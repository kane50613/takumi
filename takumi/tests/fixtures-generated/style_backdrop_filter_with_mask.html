<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_backdrop_filter_with_mask</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
        background-image: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0) 48%,
          rgb(255, 255, 255) 48%,
          rgb(255, 255, 255) 52%,
          rgba(0, 0, 0, 0) 52%,
          rgba(0, 0, 0, 0) 100%
        );
        background-size: 40px 100%;
        background-repeat: repeat-x;
      "
    >
      <div
        style="
          position: absolute;
          top: 0px;
          right: 0px;
          bottom: 0px;
          left: 0px;
          background-color: rgb(239, 68, 68);
          mask-image: linear-gradient(rgba(0, 0, 0, 0) 10%, rgb(0, 0, 0) 100%);
        "
      ></div>
      <div
        style="
          position: absolute;
          top: 0px;
          right: 0px;
          bottom: 0px;
          left: 0px;
          backdrop-filter: blur(24px);
          mask-image: radial-gradient(rgba(0, 0, 0, 0) 30.000002%, rgb(0, 0, 0) 100%);
        "
      ></div>
      <span style="display: flex; font-size: 48px; font-weight: 700; color: rgb(255, 255, 255)"
        >Sharp center, blurred edges</span
      >
    </div>
  </body>
</html>
