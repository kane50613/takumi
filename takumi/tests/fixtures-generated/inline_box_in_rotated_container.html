<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_box_in_rotated_container</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: center;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          display: block;
          rotate: 30deg;
          width: 520px;
          font-size: 28px;
          background-color: rgb(226, 232, 240);
          outline-style: solid;
          outline-width: 6px;
          outline-offset: 10px;
          outline-color: rgb(22, 163, 74);
        "
      >
        <span style="display: inline">before </span>
        <div
          style="
            display: inline-block;
            width: 120px;
            height: 48px;
            margin-top: 8px;
            margin-right: 8px;
            margin-bottom: 8px;
            margin-left: 8px;
            color: rgb(255, 255, 255);
            background-color: rgb(220, 38, 38);
          "
        >
          <span>box</span>
        </div>
        <span style="display: inline"> after</span>
      </div>
    </div>
  </body>
</html>
