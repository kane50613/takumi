<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_nested_hoisting_fixed_cb</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          display: block;
          position: fixed;
          width: 200px;
          height: 200px;
          top: 40px;
          left: 40px;
          background-color: rgb(160, 0, 200);
        "
      >
        <div style="display: block; position: static">
          <div
            style="
              display: flex;
              position: absolute;
              width: 60px;
              height: 60px;
              bottom: 0px;
              right: 0px;
              background-color: rgb(240, 140, 0);
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
