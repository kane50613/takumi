<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_background_clip_border_area</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(200, 200, 200);
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          display: flex;
          width: 16rem;
          height: 10rem;
          background-color: rgb(255, 165, 0);
          background-clip: border-area;
          padding-top: 20px;
          padding-right: 20px;
          padding-bottom: 20px;
          padding-left: 20px;
          border-top-width: 10px;
          border-right-width: 10px;
          border-bottom-width: 10px;
          border-left-width: 10px;
          border-top-style: solid;
          border-right-style: solid;
          border-bottom-style: solid;
          border-left-style: solid;
          border-top-color: rgba(0, 0, 0, 0.501961);
          border-right-color: rgba(0, 0, 0, 0.501961);
          border-bottom-color: rgba(0, 0, 0, 0.501961);
          border-left-color: rgba(0, 0, 0, 0.501961);
          border-top-left-radius: 8px 8px;
          border-top-right-radius: 8px 8px;
          border-bottom-right-radius: 8px 8px;
          border-bottom-left-radius: 8px 8px;
        "
      ></div>
    </div>
  </body>
</html>
