<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_grow_bg_clip_transparent_stroke</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        background-color: rgb(186, 169, 207);
        display: flex;
        font-family: &quot;Noto Sans TC&quot;;
        height: 100%;
        position: relative;
        width: 100%;
      "
    >
      <div
        style="
          align-items: center;
          display: flex;
          height: 420px;
          justify-content: center;
          left: 474px;
          position: absolute;
          top: 50px;
          width: 626px;
        "
      >
        <span
          style="
            background-clip: text;
            background-color: rgb(0, 0, 0);
            color: rgba(0, 0, 0, 0);
            font-size: 60px;
            font-weight: 700;
            line-height: 1.5;
            padding-bottom: 24px;
            padding-left: 6px;
            padding-right: 6px;
            padding-top: 24px;
            text-fit: grow;
            text-overflow: ellipsis;
            webkit-text-stroke-color: rgba(0, 0, 0, 0);
            webkit-text-stroke-width: 12px;
          "
          >支離滅裂な思考・発言</span
        >
      </div>
    </div>
  </body>
</html>
