<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_with_webkit_text_stroke</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        flex-wrap: wrap;
        row-gap: 14px;
        column-gap: 14px;
        background-color: rgb(246, 248, 251);
        padding-top: 18px;
        padding-right: 18px;
        padding-bottom: 18px;
        padding-left: 18px;
      "
    >
      <div
        style="
          display: block;
          width: 258px;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
      >
        <span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >grow</span
        ><span
          style="
            display: block;
            width: 226px;
            min-height: 68px;
            font-size: 26px;
            line-height: 1;
            text-fit: grow;
            white-space-collapse: preserve-breaks;
            background-color: rgb(255, 255, 255);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
            text-wrap-mode: nowrap;
            font-weight: 700;
            color: rgb(0, 0, 0);
            webkit-text-stroke-width: 3px;
            webkit-text-stroke-color: rgb(255, 0, 0);
          "
          >Stroke</span
        >
      </div>
      <div
        style="
          display: block;
          width: 258px;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
      >
        <span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >grow 150%</span
        ><span
          style="
            display: block;
            width: 226px;
            min-height: 68px;
            font-size: 26px;
            line-height: 1;
            text-fit: grow 150%;
            white-space-collapse: preserve-breaks;
            background-color: rgb(255, 255, 255);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
            text-wrap-mode: nowrap;
            font-weight: 700;
            color: rgb(0, 0, 0);
            webkit-text-stroke-width: 3px;
            webkit-text-stroke-color: rgb(255, 0, 0);
          "
          >Stroke</span
        >
      </div>
      <div
        style="
          display: block;
          width: 258px;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
      >
        <span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >shrink</span
        ><span
          style="
            display: block;
            width: 226px;
            min-height: 68px;
            font-size: 26px;
            line-height: 1;
            text-fit: shrink;
            white-space-collapse: preserve-breaks;
            background-color: rgb(255, 255, 255);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
            text-wrap-mode: nowrap;
            font-weight: 700;
            color: rgb(0, 0, 0);
            webkit-text-stroke-width: 3px;
            webkit-text-stroke-color: rgb(255, 0, 0);
          "
          >This headline is intentionally long</span
        >
      </div>
      <div
        style="
          display: block;
          width: 258px;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
      >
        <span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >shrink min 70%</span
        ><span
          style="
            display: block;
            width: 226px;
            min-height: 68px;
            font-size: 26px;
            line-height: 1;
            text-fit: shrink 70%;
            white-space-collapse: preserve-breaks;
            background-color: rgb(255, 255, 255);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
            text-wrap-mode: nowrap;
            font-weight: 700;
            color: rgb(0, 0, 0);
            webkit-text-stroke-width: 3px;
            webkit-text-stroke-color: rgb(255, 0, 0);
          "
          >This headline is intentionally long</span
        >
      </div>
    </div>
  </body>
</html>
