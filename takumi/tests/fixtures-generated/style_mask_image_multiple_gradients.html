<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_mask_image_multiple_gradients</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 165, 0);
        mask-image:
          linear-gradient(to right, rgb(0, 0, 0), rgba(0, 0, 0, 0)),
          radial-gradient(circle at 25% 25%, rgb(0, 0, 0), rgba(0, 0, 0, 0) 50%);
        mask-position: center center;
      "
    ></div>
  </body>
</html>
