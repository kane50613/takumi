<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>inline_span_background_color</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background-color: rgb(255, 255, 255);
        text-wrap-mode: nowrap;
        white-space-collapse: preserve;
        font-size: 48px;
      "
    >
      <span style="display: flex; background-color: rgb(255, 200, 200); display: inline"
        >Hello </span
      ><span style="display: flex; background-color: rgb(200, 255, 200); display: inline"
        >world </span
      ><span style="display: flex; background-color: rgb(200, 200, 255); display: inline"
        >from </span
      ><span style="display: flex; background-color: rgb(255, 255, 200); display: inline"
        >Takumi!</span
      >
    </div>
  </body>
</html>
