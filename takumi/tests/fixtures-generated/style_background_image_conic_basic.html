<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_background_image_conic_basic</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-image: conic-gradient(
          rgb(255, 59, 48) 0%,
          rgb(255, 204, 0) 25%,
          rgb(52, 199, 89) 50%,
          rgb(0, 122, 255) 75%,
          rgb(255, 59, 48) 100%
        );
        background-position: center center;
      "
    ></div>
  </body>
</html>
