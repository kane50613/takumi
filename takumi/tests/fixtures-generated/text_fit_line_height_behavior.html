<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_fit_line_height_behavior</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        flex-wrap: wrap;
        row-gap: 14px;
        column-gap: 14px;
        background-color: rgb(246, 248, 251);
        padding-top: 18px;
        padding-right: 18px;
        padding-bottom: 18px;
        padding-left: 18px;
      "
    >
      <div
        style="
          display: block;
          width: 258px;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
      >
        <span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >normal</span
        ><span
          style="
            display: block;
            width: 226px;
            min-height: 68px;
            font-size: 26px;
            line-height: normal;
            text-fit: grow per-line-all 180%;
            white-space-collapse: preserve-breaks;
            background-color: rgb(255, 255, 255);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
          "
          >Short A much longer line</span
        >
      </div>
      <div
        style="
          display: block;
          width: 258px;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
      >
        <span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >1.4</span
        ><span
          style="
            display: block;
            width: 226px;
            min-height: 68px;
            font-size: 26px;
            line-height: 1.4;
            text-fit: grow per-line-all 180%;
            white-space-collapse: preserve-breaks;
            background-color: rgb(248, 250, 252);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
          "
          >Short A much longer line</span
        >
      </div>
      <div
        style="
          display: block;
          width: 258px;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
      >
        <span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"
          >1.5em (150%)</span
        ><span
          style="
            display: block;
            width: 226px;
            min-height: 68px;
            font-size: 26px;
            line-height: 1.5em;
            text-fit: grow per-line-all 180%;
            white-space-collapse: preserve-breaks;
            background-color: rgb(241, 245, 249);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
          "
          >Short A much longer line</span
        >
      </div>
      <div
        style="
          display: block;
          width: 258px;
          background-color: rgb(229, 234, 240);
          padding-top: 10px;
          padding-right: 10px;
          padding-bottom: 10px;
          padding-left: 10px;
        "
      >
        <span style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px"

        ><span
          style="
            display: block;
            width: 226px;
            min-height: 68px;
            font-size: 26px;
            line-height: 40px;
            text-fit: grow per-line-all 180%;
            white-space-collapse: preserve-breaks;
            background-color: rgb(236, 242, 255);
            padding-top: 8px;
            padding-right: 8px;
            padding-bottom: 8px;
            padding-left: 8px;
          "
          >Short A much longer line</span
        >
      </div>
    </div>
  </body>
</html>
