<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_rotate</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          display: flex;
          width: 16rem;
          height: 16rem;
          background-color: rgb(0, 0, 0);
          rotate: 45deg;
        "
      ></div>
    </div>
  </body>
</html>
