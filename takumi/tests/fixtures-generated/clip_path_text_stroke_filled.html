<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clip_path_text_stroke_filled</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-size: 84px;
        font-weight: 700;
        text-align: center;
      "
    >
      <span
        style="
          display: block;
          position: absolute;
          top: 50%;
          left: 50%;
          translate: -50% -50%;
          color: rgb(255, 255, 255);
          clip-path: inset(0px 0px 50% 0px);
        "
        >clip-path works in Takumi</span
      ><span
        style="
          display: block;
          position: absolute;
          top: 50%;
          left: 50%;
          translate: -50% -50%;
          color: rgba(0, 0, 0, 0);
          -webkit-text-stroke-width: 2px;
          -webkit-text-stroke-color: rgb(128, 128, 128);
          clip-path: inset(50% 0px 0px 0px);
        "
        >clip-path works in Takumi</span
      >
    </div>
  </body>
</html>
