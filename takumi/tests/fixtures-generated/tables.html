<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>tables</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .root {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 16px;
        width: 100%;
        height: 100%;
        background: rgb(243, 244, 246);
        align-content: flex-start;
        font-family: "Geist";
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 282px;
        height: 190px;
        background: white;
        border-radius: 8px;
        padding: 10px 12px;
      }
      .label {
        font-size: 11px;
        color: rgb(100, 116, 139);
        font-family: "Geist Mono";
      }
      .table {
        display: table;
        width: 100%;
        font-size: 13px;
        color: rgb(17, 24, 39);
      }
      .thead {
        display: table-header-group;
      }
      .tbody {
        display: table-row-group;
      }
      .tfoot {
        display: table-footer-group;
      }
      .tr {
        display: table-row;
      }
      .td {
        display: table-cell;
        padding: 3px 8px;
        border: 1px solid rgb(203, 213, 225);
      }
      .th {
        background: rgb(226, 232, 240);
        font-weight: bold;
      }
      .caption {
        display: table-caption;
        font-size: 11px;
        color: rgb(100, 116, 139);
      }
      .caption-bottom {
        caption-side: bottom;
      }
      .stripe {
        background: rgb(241, 245, 249);
      }
      .w80 {
        width: 80px;
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div class="root">
      <div class="cell">
        <span class="label">group order, caption, striped row</span>
        <div class="table">
          <div class="caption"><span>caption above the grid</span></div>
          <div class="tfoot">
            <div class="tr">
              <div class="td"><span>total</span></div>
              <div class="td"><span>42</span></div>
            </div>
          </div>
          <div class="tbody">
            <div class="tr">
              <div class="td"><span>alpha</span></div>
              <div class="td"><span>1</span></div>
            </div>
            <div class="tr stripe">
              <div class="td"><span>beta</span></div>
              <div class="td"><span>2</span></div>
            </div>
            <div class="tr">
              <div class="td"><span>gamma</span></div>
              <div class="td"><span>3</span></div>
            </div>
          </div>
          <div class="thead">
            <div class="tr">
              <div class="td th"><span>name</span></div>
              <div class="td th"><span>count</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="cell">
        <span class="label">declared column width</span>
        <div class="table">
          <div class="caption caption-bottom"><span>caption-side: bottom</span></div>
          <div class="tr">
            <div class="td w80"><span>80px column</span></div>
            <div class="td"><span>auto column takes the rest</span></div>
          </div>
          <div class="tr">
            <div class="td"><span>a</span></div>
            <div class="td"><span>b</span></div>
          </div>
        </div>
      </div>
      <div class="cell">
        <span class="label">colspan / rowspan</span>
        <div class="table">
          <div class="tr">
            <div class="td th" colspan="2"><span>spans both columns</span></div>
            <div class="td th" rowspan="2"><span>tall</span></div>
          </div>
          <div class="tr">
            <div class="td"><span>left</span></div>
            <div class="td"><span>right</span></div>
          </div>
          <div class="tr">
            <div class="td"><span>a</span></div>
            <div class="td"><span>b</span></div>
            <div class="td"><span>c</span></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
