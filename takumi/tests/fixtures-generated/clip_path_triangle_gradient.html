<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clip_path_triangle_gradient</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
        justify-content: center;
        align-items: center;
        flex-direction: column;
      "
    >
      <div
        style="
          display: flex;
          width: 300px;
          height: 300px;
          background-image: linear-gradient(
            45deg,
            rgb(255, 59, 48),
            rgb(255, 149, 0),
            rgb(255, 204, 0),
            rgb(52, 199, 89),
            rgb(0, 122, 255),
            rgb(88, 86, 214)
          );
          clip-path: polygon(0% 100%, 100% 100%, 50% 12.25%);
        "
      ></div>
    </div>
  </body>
</html>
