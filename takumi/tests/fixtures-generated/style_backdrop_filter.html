<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_backdrop_filter</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-columns: repeat(4, 1fr);
        background-image: linear-gradient(
          135deg,
          rgb(102, 126, 234) 0%,
          rgb(118, 75, 162) 25%,
          rgb(248, 87, 166) 50%,
          rgb(255, 88, 88) 75%,
          rgb(255, 177, 153) 100%
        );
        background-position: center center;
      "
    >
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: blur(0px);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>blur(0px)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: blur(5px);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>blur(5px)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: blur(10px);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>blur(10px)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: blur(20px);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>blur(20px)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: grayscale(1);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>grayscale(100%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: sepia(1);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>sepia(100%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: invert(1);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>invert(100%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: hue-rotate(180deg);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>hue-rotate(180deg)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: brightness(0.5);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>brightness(50%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: brightness(1.5);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>brightness(150%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: contrast(0.5);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>contrast(50%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: contrast(2);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>contrast(200%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: saturate(0);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>saturate(0%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: saturate(2);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>saturate(200%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: opacity(0.5);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>opacity(50%)</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          backdrop-filter: blur(5px) grayscale(0.5);
          background-color: rgba(255, 255, 255, 0.235294);
          font-size: 14px;
          color: rgb(0, 0, 0);
          padding-top: 8px;
          padding-right: 8px;
          padding-bottom: 8px;
          padding-left: 8px;
        "
      >
        <span>blur(5px) grayscale(50%)</span>
      </div>
    </div>
  </body>
</html>
