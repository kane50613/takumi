<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_background_clip_text_multiline</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        background-color: rgb(255, 255, 255);
        width: 100%;
        height: 100%;
        font-size: 48px;
        font-weight: 800;
        padding-top: 40px;
        padding-right: 40px;
        padding-bottom: 40px;
        padding-left: 40px;
      "
    >
      <span
        style="
          display: flex;
          background-image: linear-gradient(
            45deg,
            rgb(18, 194, 233),
            rgb(196, 113, 237),
            rgb(246, 79, 89)
          );
          background-size: 100% 100%;
          background-position: center center;
          background-clip: text;
          color: rgba(0, 0, 0, 0);
          width: 100%;
        "
        >This is a multiline text with a beautiful gradient background clipped to the text shape. It
        demonstrates how background-clip: text works with longer content.</span
      >
    </div>
  </body>
</html>
