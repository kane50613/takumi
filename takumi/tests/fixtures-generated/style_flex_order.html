<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_flex_order</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div style="display: flex; width: 100%; height: 100%; background-color: rgb(0, 0, 255)">
      <div
        style="display: flex; width: 50px; height: 50px; order: 2; background-color: rgb(255, 0, 0)"
      ></div>
      <div
        style="
          display: flex;
          width: 50px;
          height: 50px;
          order: -1;
          background-color: rgb(0, 255, 0);
        "
      ></div>
      <div
        style="
          display: flex;
          width: 50px;
          height: 50px;
          order: 0;
          background-color: rgb(255, 255, 0);
        "
      ></div>
    </div>
  </body>
</html>
