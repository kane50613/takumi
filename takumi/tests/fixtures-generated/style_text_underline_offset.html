<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_text_underline_offset</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        background-color: rgb(240, 240, 240);
        flex-direction: column;
        row-gap: 20px;
        padding-top: 40px;
        padding-bottom: 40px;
      "
    >
      <span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-underline-offset: auto;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >auto: underline offset</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-underline-offset: 2px;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >2px: underline offset</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-underline-offset: 6px;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >6px: underline offset</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-underline-offset: 12px;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >12px: underline offset</span
      ><span
        style="
          display: block;
          width: 100%;
          text-align: center;
          font-size: 48px;
          text-underline-offset: 0.2em;
          text-decoration-line: underline;
          text-decoration-style: solid;
          text-decoration-color: rgb(255, 0, 0);
          text-decoration-thickness: auto;
        "
        >0.2em: underline offset</span
      >
    </div>
  </body>
</html>
