<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_mask_image_corner_fade</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 200, 200);
        mask-image:
          radial-gradient(at left top, rgba(0, 0, 0, 0) 0%, rgb(0, 0, 0) 50%),
          radial-gradient(at right bottom, rgba(0, 0, 0, 0) 0%, rgb(0, 0, 0) 50%);
        mask-position: center center;
      "
    ></div>
  </body>
</html>
