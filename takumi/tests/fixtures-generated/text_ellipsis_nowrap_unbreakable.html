<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>text_ellipsis_nowrap_unbreakable</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        font-size: 48px;
        width: 480px;
        height: 200px;
        background-color: rgb(255, 255, 255);
      "
    >
      <span
        style="
          text-overflow: ellipsis;
          text-wrap-mode: nowrap;
          overflow-x: hidden;
          overflow-y: hidden;
          width: 360px;
          color: rgb(0, 0, 0);
        "
        >gsijdsoifgdhaetlelwtyuxxxxxx</span
      >
    </div>
  </body>
</html>
