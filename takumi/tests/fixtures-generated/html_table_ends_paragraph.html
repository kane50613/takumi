<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>html_table_ends_paragraph</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <html style="display: block">
      <body
        style="
          margin-top: 8px;
          margin-right: 8px;
          margin-bottom: 8px;
          margin-left: 8px;
          display: block;
        "
      >
        <p
          style="
            margin-top: 1em;
            margin-bottom: 1em;
            display: block;
            background-color: rgb(59, 130, 246);
          "
        >
          a
        </p>
        <table
          style="
            display: table;
            box-sizing: border-box;
            border-spacing: 2px 2px;
            background-color: rgb(239, 68, 68);
          "
        >
          <tbody style="display: table-row-group; vertical-align: middle">
            <tr style="display: table-row; vertical-align: inherit">
              <td
                style="
                  display: table-cell;
                  padding-top: 1px;
                  padding-right: 1px;
                  padding-bottom: 1px;
                  padding-left: 1px;
                  vertical-align: inherit;
                "
              >
                b
              </td>
            </tr>
          </tbody>
        </table>
      </body>
    </html>
  </body>
</html>
