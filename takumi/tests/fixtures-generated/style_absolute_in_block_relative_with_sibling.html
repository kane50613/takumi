<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_absolute_in_block_relative_with_sibling</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
      "
    >
      <div
        style="
          display: block;
          position: relative;
          width: 300px;
          height: 100px;
          background-color: rgb(0, 0, 245);
        "
      >
        <div
          style="
            display: flex;
            position: absolute;
            width: 100px;
            height: 20px;
            bottom: 0px;
            left: 0px;
            background-color: rgb(128, 128, 255);
          "
        ></div>
        <div style="display: flex; color: rgb(255, 255, 255); background-color: rgb(0, 0, 0)">
          <span>ERR</span>
        </div>
      </div>
    </div>
  </body>
</html>
