<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
  <rect x="0" y="0" width="480" height="200" fill="#fff"/>
  <filter id="ft0" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="0" result="dsb"/>
    <feOffset in="dsb" dx="10" dy="10" result="dso"/>
    <feFlood flood-color="#0f172a" flood-opacity="1" result="dsc"/>
    <feComposite in="dsc" in2="dso" operator="in" result="dss"/>
    <feMerge result="f0">
      <feMergeNode in="dss"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g filter="url(#ft0)">
    <rect x="40" y="40" width="80" height="80" fill="#000" fill-opacity="0"/>
    <rect x="40" y="40" width="80" height="80" fill="#3b82f6"/>
  </g>
  <filter id="ft1" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="0" result="dsb"/>
    <feOffset in="dsb" dx="-7" dy="8" result="dso"/>
    <feFlood flood-color="#0f172a" flood-opacity="1" result="dsc"/>
    <feComposite in="dsc" in2="dso" operator="in" result="dss"/>
    <feMerge result="f0">
      <feMergeNode in="dss"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g filter="url(#ft1)">
    <rect x="160" y="40" width="80" height="80" fill="#000" fill-opacity="0"/>
    <rect x="160" y="40" width="80" height="80" fill="#3b82f6"/>
  </g>
  <filter id="ft2" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="dsb"/>
    <feOffset in="dsb" dx="4" dy="4" result="dso"/>
    <feFlood flood-color="#0f172a" flood-opacity=".6" result="dsc"/>
    <feComposite in="dsc" in2="dso" operator="in" result="dss"/>
    <feMerge result="f0">
      <feMergeNode in="dss"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g filter="url(#ft2)">
    <rect x="280" y="40" width="80" height="80" fill="#000" fill-opacity="0"/>
    <rect x="280" y="40" width="80" height="80" fill="#3b82f6"/>
  </g>
</svg>