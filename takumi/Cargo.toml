[package]
name = "takumi"
version = "1.8.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Render UI component trees to images."
keywords = ["react", "image", "css", "flexbox"]
repository = "https://github.com/kane50613/takumi"
homepage = "https://takumi.kane.tw"
readme = "README.md"
rust-version = "1.91"
autobenches = false

[dependencies.takumi-core]
path = "../takumi-core"
version = "=1"

[dependencies.takumi-paint]
path = "../takumi-paint"
version = "=1"

[features]
default = ["woff2", "woff", "svg", "rayon"]
svg = ["takumi-core/svg", "takumi-paint/svg"]
woff2 = ["takumi-core/woff2"]
woff = ["takumi-core/woff"]
rayon = ["takumi-paint/rayon"]

[dev-dependencies]
parley.workspace = true
rayon.workspace = true
serde_json.workspace = true

[dev-dependencies.image]
workspace = true
features = ["png", "webp"]

[lints]
workspace = true
