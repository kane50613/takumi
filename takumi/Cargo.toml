[package]
name = "takumi"
version = "2.18.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Render images, animations, and SVG from HTML, CSS, or node trees. No headless browser."
keywords = ["html-to-image", "image", "css", "svg", "og-image"]
categories = ["graphics", "rendering", "web-programming"]
repository = "https://github.com/kane50613/takumi"
homepage = "https://takumi.kane.tw"
readme = "README.md"
rust-version = "1.91"
autobenches = false
autotests = false

[dependencies.takumi-core]
path = "../takumi-core"
version = "0.34.0"
default-features = false

[dependencies.takumi-raster]
path = "../takumi-raster"
version = "0.5.11"
default-features = false
optional = true

[dependencies.takumi-svg]
path = "../takumi-svg"
version = "0.3.33"
default-features = false
optional = true

[features]
default = ["raster-backend", "woff2", "woff", "svg-source", "image-decoding", "rayon"]
raster-backend = ["dep:takumi-raster"]
# Expose the backend crates wholesale under `takumi::unstable`. Everything behind
# this flag is implementation surface with no semver guarantee.
unstable = []
svg-source = ["takumi-core/svg", "takumi-core/html-svg-nodes", "takumi-raster?/svg"]
svg-backend = ["dep:takumi-svg"]
woff2 = ["takumi-core/woff2"]
woff = ["takumi-core/woff"]
image-decoding = ["png", "jpeg", "webp", "gif"]
png = ["takumi-core/png", "takumi-raster?/png"]
jpeg = ["takumi-core/jpeg"]
webp = ["takumi-core/webp", "takumi-raster?/webp"]
gif = ["takumi-core/gif", "takumi-raster?/gif"]
rayon = ["takumi-raster?/rayon"]
# Raster rendering across pages, through takumi-core's block fragmentation.
pages = ["takumi-raster?/pages"]
from-html = ["takumi-core/html"]

[dev-dependencies]
criterion.workspace = true
gif.workspace = true
image-webp.workspace = true
png.workspace = true
rayon.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
zune-core.workspace = true
zune-jpeg.workspace = true

[dev-dependencies.takumi]
path = "."
features = ["from-html", "svg-backend", "unstable", "pages"]

[dev-dependencies.takumi-core]
path = "../takumi-core"
features = ["paint-tree", "fragmentation"]

[dev-dependencies.takumi-svg]
path = "../takumi-svg"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

# The suites share one binary, so they link takumi once. The allocator count, the SVG parity check
# that reads the goldens the suites write, and the WPT run, which exits the process on a hung test,
# keep their own.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "memory_retention"

[[test]]
name = "svg_parity"

[[test]]
name = "wpt_reftests"

[[bench]]
name = "animated_frames"
harness = false

[[bench]]
name = "paint_tree"
harness = false

[[bench]]
name = "background"
harness = false

[[bench]]
name = "cascade"
harness = false

[[bench]]
name = "canvas"
harness = false

[[bench]]
name = "effects"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "fixtures"
harness = false

[[bench]]
name = "gradient"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "svg"
harness = false

[[bench]]
name = "text"
harness = false


[[bench]]
name = "blur_large"
harness = false
