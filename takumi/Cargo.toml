[package]
name = "takumi"
version = "2.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Render OG images from HTML, CSS, or component trees. No headless browser."
keywords = ["html-to-image", "image", "css", "svg", "og-image"]
categories = ["graphics", "rendering", "web-programming"]
repository = "https://github.com/kane50613/takumi"
homepage = "https://takumi.kane.tw"
readme = "README.md"
rust-version = "1.91"
autobenches = false

[dependencies.takumi-core]
path = "../takumi-core"
version = "0.23.0"
default-features = false

[dependencies.takumi-raster]
path = "../takumi-raster"
version = "0.4.20"
default-features = false
optional = true

[dependencies.takumi-svg]
path = "../takumi-svg"
version = "0.3.18"
default-features = false
optional = true

[dependencies.takumi-html]
path = "../takumi-html"
version = "0.3.1"
default-features = false
optional = true

[features]
default = ["raster-backend", "woff2", "woff", "svg-source", "image-decoding", "rayon"]
raster-backend = ["dep:takumi-raster"]
# Expose the backend crates wholesale under `takumi::unstable`. Everything behind
# this flag is implementation surface with no semver guarantee.
unstable = []
svg-source = ["takumi-core/svg", "takumi-raster?/svg"]
svg-backend = ["dep:takumi-svg"]
woff2 = ["takumi-core/woff2"]
woff = ["takumi-core/woff"]
image-decoding = ["jpeg", "webp", "gif"]
jpeg = ["takumi-core/jpeg"]
webp = ["takumi-core/webp"]
gif = ["takumi-core/gif"]
rayon = ["takumi-raster?/rayon"]
from-html = ["dep:takumi-html"]

[dev-dependencies]
criterion.workspace = true
parley.workspace = true
rayon.workspace = true
resvg.workspace = true
serde_json.workspace = true

[dev-dependencies.image]
workspace = true
features = ["png", "webp"]

[dev-dependencies.takumi-core]
path = "../takumi-core"

[dev-dependencies.takumi-svg]
path = "../takumi-svg"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "background"
harness = false

[[bench]]
name = "canvas"
harness = false

[[bench]]
name = "effects"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "fixtures"
harness = false

[[bench]]
name = "gradient"
harness = false

[[bench]]
name = "svg"
harness = false

[[bench]]
name = "text"
harness = false

