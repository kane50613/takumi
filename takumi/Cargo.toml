[package]
name = "takumi"
version = "1.8.7"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Render UI component trees to images."
keywords = ["react", "image", "css", "flexbox"]
repository = "https://github.com/kane50613/takumi"
homepage = "https://takumi.kane.tw"
readme = "README.md"
rust-version = "1.91"
autobenches = false

[dependencies.takumi-base]
path = "../takumi-base"
version = "0.1"
default-features = false

[dependencies.takumi-raster]
path = "../takumi-raster"
version = "0.1"
default-features = false
optional = true

[dependencies.takumi-svg]
path = "../takumi-svg"
version = "0.1"
default-features = false
optional = true

[features]
default = ["raster-backend", "woff2", "woff", "svg", "rayon"]
raster-backend = ["dep:takumi-raster"]
# Expose the backend crates wholesale under `takumi::unstable`. Everything behind
# this flag is implementation surface with no semver guarantee.
unstable = []
svg = ["takumi-base/svg", "takumi-raster?/svg"]
svg-backend = ["dep:takumi-svg"]
woff2 = ["takumi-base/woff2"]
woff = ["takumi-base/woff"]
rayon = ["takumi-raster?/rayon"]

[dev-dependencies]
parley.workspace = true
rayon.workspace = true
resvg = "0.47"
serde_json.workspace = true

[dev-dependencies.image]
workspace = true
features = ["png", "webp"]

[dev-dependencies.takumi-svg]
path = "../takumi-svg"

[lints]
workspace = true
