[graph]
all-features = true

[bans]
multiple-versions = "deny"
# syn 1 and 2 both live in the proc-macro graph and never reach a binary.
skip = [{ crate = "syn" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The forks the font stack is pinned to, by rev: fontations gates hinting, harfrust gates AAT.
allow-git = ["https://github.com/kane50613/fontations", "https://github.com/kane50613/harfrust"]
