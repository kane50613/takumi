[graph]
all-features = true

[bans]
multiple-versions = "deny"
# syn 1 and 2 both live in the proc-macro graph and never reach a binary.
# cap-std still pins windows-sys 0.59, which only builds for Windows.
skip = [{ crate = "syn" }, { crate = "windows-sys@0.59.0" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Pinned forks for font feature gates and shared PNG checksums.
allow-git = [
  "https://github.com/kane50613/fontations",
  "https://github.com/kane50613/harfrust",
  "https://github.com/kane50613/image-png",
]
