[graph]
all-features = true

[bans]
multiple-versions = "deny"
# syn 1 and 2 both live in the proc-macro graph and never reach a binary.
skip = [{ crate = "syn" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Pinned forks for font feature gates and shared PNG checksums.
allow-git = ["https://github.com/kane50613/fontations", "https://github.com/kane50613/harfrust", "https://github.com/kane50613/image-png"]
