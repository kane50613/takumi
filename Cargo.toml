[workspace]
resolver = "3"
members = [
  "takumi",
  "takumi-core",
  "takumi-raster",
  "takumi-svg",
  "takumi-pdf",
  "takumi-pdf-wasm",
  "takumi-html",
  "takumi-bindings-common",
  "takumi-napi",
  "takumi-wasm",
  "example/rust",
]
# cargo doesn't need this. tegami reads every Cargo.toml under a member, so
# @napi-rs/cli's vendored `napi-derive` fixture crate shadows the real dependency.
exclude = ["**/node_modules/**"]

[workspace.dependencies]
arc-swap = "1"
base64 = "0.23"
bitflags = "2.13"
bumpalo = "3.16"
bytemuck = "1.25"
color = "0.3"
criterion = "0.8"
cssparser = "0.37"
data-url = "0.3"
flate2 = "1.1"
float-cmp = "0.9"
gif = "0.14"
html5ever = "0.39"
image-webp = "0.2"
imagesize = "0.15"
indexmap = "2.10"
js-sys = "0.3"
kurbo = "0.13"
libwebp-sys = "0.14"
log = "0.4"
markup5ever_rcdom = "0.39"
napi-build = "2"
napi-derive = "3"
pastey = "0.2"
pdf-writer = "0.15"
precomputed-hash = "0.1"
pretty_assertions = "1"
quick-xml = "0.41"
rayon = "1.12"
resvg = "0.48"
roxmltree = "0.21.1"
rustc-hash = "2.1"
selectors = "0.40"
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
serde_json = "1"
simplecss = "0.2"
siphasher = "1"
strict-num = "0.1"
svgtypes = "0.16"
thiserror = "2.0"
tiny-skia-path = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
typed-builder = "0.23"
wasm-bindgen = "0.2"
write-fonts = "0.49"
xmp-writer = "0.3"
yoke = "0.8"
zune-jpeg = "0.5"

[workspace.dependencies.tiny-skia]
version = "0.12"
default-features = false
features = ["std", "simd"]

[workspace.dependencies.quick_cache]
version = "0.7"
default-features = false

[workspace.dependencies.rgb]
version = "0.8"
features = ["bytemuck"]

[workspace.dependencies.png]
version = "0.18"
features = ["zlib-rs"]

[workspace.dependencies.clap]
version = "4.6"
features = ["derive"]

[workspace.dependencies.image]
version = "0.25"
default-features = false

[workspace.dependencies.napi]
version = "3"
default-features = false
features = ["napi4", "serde-json"]

[workspace.dependencies.parley]
version = "0.11"
default-features = false
features = ["std"]

[workspace.dependencies.phf]
version = "0.13"
features = ["macros"]

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.skrifa]
version = "0.43"
default-features = false
features = ["std"]

[workspace.dependencies.smallvec]
version = "1.15"
features = ["serde"]

[workspace.dependencies.taffy]
version = "0.11"
default-features = false
features = [
  "flexbox",
  "grid",
  "alloc",
  "calc",
  "taffy_tree",
  "strict_provenance",
  "block_layout",
  "float_layout",
]

[workspace.dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros"]

[workspace.dependencies.wuff]
version = "0.2"
default-features = false

[workspace.dependencies.xxhash-rust]
version = "0.8"
features = ["xxh3"]

# Lints every crate inherits via `[lints] workspace = true`. Only lints that
# hold across *all* targets live here; the lib-only `missing_docs`/no-panic
# denials stay as crate-level `#![deny(...)]` (the table can't scope to lib).
[workspace.lints.clippy]
redundant_closure_for_method_calls = "deny"

[workspace.lints.clippy.all]
level = "deny"
priority = -1

[profile.release]
strip = true
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.release.package."takumi-wasm"]
strip = "debuginfo"

[profile.release.package."takumi-bindings-common"]
opt-level = "z"

[profile.bench]
debug = true
strip = "debuginfo"

[profile.release.package.takumi-core]
opt-level = "z"

# Crates that run at most once per image (parse/decode/encode), never per pixel.
# Size-optimizing them is perf-neutral (verified via the napi JS bench). Hot
# raster/shaping and image-webp (wasm webp encode) stay at opt-level 3.
[profile.release.package.roxmltree]
opt-level = "z"
[profile.release.package.svgtypes]
opt-level = "z"
[profile.release.package.zune-jpeg]
opt-level = "z"
[profile.release.package.brotli-decompressor]
opt-level = "z"
[profile.release.package.wuff]
opt-level = "z"
[profile.release.package.imagesize]
opt-level = "z"
[profile.release.package.cssparser]
opt-level = "z"
[profile.release.package.selectors]
opt-level = "z"
[profile.release.package.png]
opt-level = "z"
[profile.release.package.miniz_oxide]
opt-level = "z"
[profile.release.package.fdeflate]
opt-level = "z"
[profile.release.package.image]
opt-level = "z"
[profile.release.package.gif]
opt-level = "z"

# Font outlines: parsed per glyph, near the glyph hot path. opt-s (not z),
# verified perf-neutral on a text-heavy bench.
[profile.release.package.read-fonts]
opt-level = "s"
[profile.release.package.skrifa]
opt-level = "s"

# PDF serialization and font subsetting: runs once per document, never per
# pixel. Only reachable from takumi-pdf-wasm (napi graph excludes takumi-pdf).
# takumi-pdf includes the vendored krilla fork.
[profile.release.package.takumi-pdf]
opt-level = "s"
[profile.release.package.write-fonts]
opt-level = "z"
[profile.release.package.pdf-writer]
opt-level = "z"
[profile.release.package.xmp-writer]
opt-level = "z"

# Shaping (per text run) and layout/geometry (per render) — never per pixel.
# opt-s/z, perf-neutral on the napi bench.
[profile.release.package.harfrust]
opt-level = "s"
[profile.release.package.taffy]
opt-level = "z"
[profile.release.package.parley]
opt-level = "z"
[profile.release.package.fontique]
opt-level = "z"
[profile.release.package.kurbo]
opt-level = "z"
[profile.release.package.tiny-skia-path]
opt-level = "z"


