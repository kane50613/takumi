[package]
name = "takumi-napi"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde.workspace = true
rayon.workspace = true
napi.workspace = true
napi-derive.workspace = true
arc-swap.workspace = true

[dependencies.takumi-bindings-common]
path = "../takumi-bindings-common"
features = ["raster"]

[dependencies.takumi-core]
path = "../takumi-core"
default-features = false
features = ["woff2", "woff", "svg-raster", "image-decoding", "html", "html-svg-nodes"]

[dependencies.takumi-raster]
path = "../takumi-raster"
default-features = false
features = ["svg", "rayon"]

[dependencies.takumi-svg]
path = "../takumi-svg"

# musl's allocator maps and unmaps every large buffer and takes one lock across threads, and a
# render allocates a canvas, its layers, and its encoder buffers on every call. Under Node.js on
# Alpine, Linux aarch64, rendering a card to PNG four at a time: 250 renders a second with musl's
# allocator, 540 with this one, for 141KB of binding and about 200MB more held at the peak.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[build-dependencies]
napi-build.workspace = true

[lints]
workspace = true


