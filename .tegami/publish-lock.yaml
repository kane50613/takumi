core:changelogs:
  - content: "---\npackages:\n  cargo:takumi-core:\n    type: patch\n  cargo:takumi-raster:\n    type: patch\n---\n\n### Apply filter references without the base64 roundtrip\n\n`apply_svg_filter` hands the layer to resvg through a custom href resolver as fast-compressed PNG bytes, dropping the base64 encode, data-URI decode, and multi-megabyte XML parse.\n"
    filename: filter-reference-fast-path.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-core:\n    type: minor\n  cargo:takumi-raster:\n    type: minor\n  cargo:takumi-svg:\n    type: minor\n---\n\n### Support SVG filter references in `filter`\n\n`filter` and `backdrop-filter` accept `url(data:image/svg+xml,...)` with inline `<filter>` markup, mixing freely with filter functions. The raster backend executes the graph through resvg; the SVG backend emits the markup verbatim.\n"
    filename: filter-svg-reference.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-core:\n    type: patch\n---\n\n### Accept SVG sources without xmlns\n\nInline SVG image sources no longer need an `xmlns` declaration. Data-URI decoding and base64 encoding are shared through `resources::image` (new `to_data_url`).\n"
    filename: svg-without-xmlns.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-svg:\n    type: patch\n---\n\n### Anchor element filter regions to the border box\n\nAn invisible rect keeps a filtered element's region from collapsing when nothing inside it paints, matching the raster backend for filter-driven overlays like `feTurbulence` grain.\n"
    filename: filter-region-anchor.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-svg:\n    type: patch\n---\n\n### Deduplicate glyph outlines in SVG output\n\nGlyph outlines land in `<defs>` once and repeat as `<use>` references, shrinking text-heavy documents by 30–75%.\n"
    filename: svg-glyph-dedup.md
    v: 0.0.0
