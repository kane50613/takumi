core:changelogs:
  - content: "---\npackages:\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n  takumi-pdf:\n    type: patch\n  takumi-paint:\n    type: patch\n  takumi-js:\n    type: patch\n---\n\n# A font one render lists no longer changes another render\n\nEach render now draws with the fonts its own `fonts` list names and the fonts `registerFont` registered. Before, a renderer kept using the fonts earlier renders had listed, so the same request could come out differently.\n\n```ts\nawait renderer.render(html, { fonts: [brandRegular] });\nawait renderer.render(html, { fonts: [brandBold] });\nawait renderer.render(html, { fonts: [brandRegular] });\n// Before: the third render draws Brand with the bold face the second one listed\n// After: the third render matches the first\n```\n\nA family that only another render listed now falls back to the next family. List the font in this render, or register it with `registerFont`.\n\nThe options types of `@takumi-rs/core` and `@takumi-rs/wasm` no longer list `failedFontFiles`, a field only the renderer itself sets.\n"
    filename: listed-font-scope.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n  takumi-pdf:\n    type: patch\n  takumi-paint:\n    type: patch\n  takumi-js:\n    type: patch\n---\n\n# Download fonts listed as URLs with the render's fetch options\n\nA URL string in a render's `fonts` list now downloads with the `fetch`, `allowUrl`, `timeout`, `maxBytes`, and `signal` the render's images use, so `allowUrl` refuses it too.\n\n```tsx\nawait render(<div>Hello</div>, {\n  width: 1200,\n  height: 630,\n  fonts: [\"https://fonts.example.com/Brand.woff2\"],\n  images: { allowUrl: (url) => url.startsWith(\"https://cdn.example.com/\") },\n});\n// Before: downloads the font\n// After: rejects with \"URL blocked by allowUrl policy: https://fonts.example.com/Brand.woff2\"\n```\n"
    filename: font-url-fetch-options.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n  takumi-paint:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# `unregisterFont` leaves the built-in Geist in place\n\n`unregisterFont` now removes only the fonts you registered. Before, unregistering `Geist` also removed the built-in Geist, so text that no registered font covered drew nothing.\n\n```ts\n// @takumi-rs/core and @takumi-rs/wasm. Use `new Painter()` in takumi-paint and `new PdfRenderer()` in takumi-pdf.\nconst renderer = new Renderer();\n\n// Before: true, and the built-in Geist is gone\n// After: false, since no registered font is named Geist\nrenderer.unregisterFont({ name: \"Geist\" });\n```\n"
    filename: unregister-keeps-built-in-geist.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n  \"@takumi-rs/helpers\":\n    type: patch\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-pdf:\n    type: minor\n  takumi-paint:\n    type: minor\n---\n\n# Evict fonts one file at a time from the renderer's cache\n\nFont files that renders load now share the renderer's `maxBytes` pool and leave it one file at a time, least recently used first. A family that keeps gaining files, such as one Google Fonts `text=` subset per title, now stays within `maxBytes`. A render keeps the fonts it uses until it finishes, and fonts from `registerFont` still stay. With `cache.fonts` set to `\"none\"`, each file goes as soon as the last render using it finishes.\n\n```ts\nconst renderer = new Renderer({ cache: { fonts: \"none\" } });\n```\n\n`fontCacheMaxBytes` no longer bounds the fonts apart. A value of `0` still keeps none, as `\"none\"` does.\n\nAmong equally matching faces of one family, the one listed last now wins every time.\n"
    filename: font-eviction.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n  \"@takumi-rs/helpers\":\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-pdf:\n    type: minor\n  takumi-paint:\n    type: minor\n  takumi-js:\n    type: minor\n---\n\n# Renders warn about what they could not draw, and load fonts for missing characters\n\nA render now warns when it goes without a character's glyph, a font family, an optional font, or an image under `images.throwOnError: false`. Each warning prints through `console.warn` as `takumi: <message>`, the same form as the warnings for unsupported CSS, every time a render raises it. To collect the warnings somewhere else, wrap `console.warn`.\n\n```txt\ntakumi: No font draws \"世界\". Add a font that covers them to `fonts`, or return one from `loadFallbackFonts`.\n```\n\n- `prepare()` prints the warnings it finds, and a later render of the prepared source warns only about a font that fails when it loads again.\n- A `render()` without `prepare()` checks glyphs and families only when it passes `loadFallbackFonts`.\n- `loadFallbackFonts(characters)` runs once when characters have no font, and the fonts it returns load with the render.\n- In Rust, `RenderNeeds` has `missing_characters` and `unresolved_families`, and is now `#[non_exhaustive]`.\n"
    filename: render-report.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-pdf:\n    type: minor\n  takumi-paint:\n    type: minor\n---\n\n# A style value Takumi cannot read is ignored instead of failing the render\n\nA node's `style` object now drops a declaration whose value is invalid, such as a negative `height`, and renders the rest, as a browser does with a `style` attribute. Where a render used to reject, `console.warn` now prints the same message after `takumi: ignoring`, and in Rust the message is a `log` warning under the `takumi::style` target.\n"
    filename: ignore-invalid-style-values.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-pdf:\n    type: minor\n  takumi-paint:\n    type: minor\n  takumi-js:\n    type: minor\n---\n\n# Render without a font that fails to load when the font is optional\n\nA font in a render's `fonts` list takes `optional: true`. When an optional font fails to download, `allowUrl` refuses it, or its bytes do not decode, the render goes on without it instead of rejecting.\n\n```tsx\nawait render(<div style={{ fontFamily: \"Brand, Inter\" }}>Hello</div>, {\n  width: 1200,\n  height: 630,\n  fonts: [\n    fontFromUrl(\"https://example.com/Inter.woff2\"),\n    fontFromUrl(\"https://cdn.example.com/Brand.woff2\", { optional: true }),\n  ],\n});\n```\n"
    filename: optional-fonts.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n  takumi-cli:\n    type: minor\n  takumi-paint:\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-pdf:\n    type: minor\n---\n\n# The paint tree lists the CSS a render dropped\n\nA declaration or at-rule that takumi drops no longer vanishes without a trace. The paint tree lists each one once, with its property and value as written, why takumi dropped it, and where it was written. The image stays the same.\n\n```ts\nconst tree = await paint(html, { width: 600, height: 200 });\n\nconsole.log(tree.ignoredDeclarations);\n// [{ property: \"writing-mode\", value: \"vertical-rl\", reason: \"unknown-property\", origin: \"style-attribute\" }]\n```\n\n- `reason` is `unknown-property`, `invalid-value`, or `unknown-at-rule`.\n- `origin` is `style-attribute`, `style-sheet`, or `style-object`.\n- `takumi paint` prints the list under `ignored`, and its JSON output holds it as `ignoredDeclarations`.\n- `needs()` in `@takumi-rs/core`, `@takumi-rs/wasm`, and `takumi-pdf` returns the same list as `ignoredDeclarations`.\n- In Rust, `RenderNeeds::ignored_declarations` and `PaintDocument::ignored_declarations` hold the same list, and `StyleSheet::ignored_declarations` holds what one style sheet dropped.\n"
    filename: ignored-declarations.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-pdf:\n    type: minor\n  takumi-paint:\n    type: minor\n  takumi-js:\n    type: minor\n---\n\n# Reuse downloaded bytes across renders, and load Google Fonts for known text\n\nRenderers now keep the images, `@font-face` files, and font URLs they download in a 32 MiB store keyed by URL, so a later render skips the download. A render that passes its own `fetch` skips the store, since that `fetch` may send credentials.\n\n```ts\nimport { googleFonts } from \"takumi-js/helpers\";\n\nconst fonts = googleFonts({ families: [\"Noto Sans JP\"], text: \"東京の夜景\" });\n```\n\n- `googleFonts` takes `text` to load one file holding just those characters.\n- A font in a render's `fonts` list takes `cache: \"none\"`, which drops the font once the render settles. `googleFonts` sets it on every subset through `cacheMode: \"none\"`.\n- Under the default `\"auto\"`, a `googleFonts` subset loaded for `text` drops once its render settles too, since another render rarely asks for the same characters. Range subsets and other fonts stay as before.\n- `CacheMode` names the `\"auto\" | \"none\"` policy that images and fonts share. `ImageCacheMode` stays as a deprecated alias.\n\n#### Migration\n\n`images.fetchCache` is deprecated, since renders keep their downloads without it.\n\n```diff\n- await renderer.render(node, { images: { fetchCache } });\n+ await renderer.render(node);\n```\n"
    filename: download-store.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-pdf:\n    type: minor\n  takumi-paint:\n    type: minor\n  takumi-js:\n    type: minor\n---\n\n# Every renderer takes its cache size in one `cache` option\n\n`Renderer`, `PdfRenderer`, and `Painter` take a `cache` option. Its `maxBytes`, 128 MiB by default, is one pool for everything a renderer reuses. Setting `images`, `glyphs`, or `fonts` to `\"none\"` keeps none of that kind. The options apply when the renderer is created.\n\n```ts\nconst renderer = new Renderer({\n  cache: {\n    maxBytes: 256 * 1024 * 1024,\n    glyphs: \"none\",\n  },\n});\n```\n\n#### Migration\n\n`cacheMaxBytes`, `fontCacheMaxBytes`, and `FontCacheOptions` are deprecated. In `@takumi-rs/core` and `@takumi-rs/wasm`, `setGlyphCacheMaxBytes` is deprecated, and only `0` still changes anything.\n\n```diff\n- setGlyphCacheMaxBytes(0);\n- const renderer = new Renderer({ cacheMaxBytes: 64 * 1024 * 1024 });\n+ const renderer = new Renderer({ cache: { maxBytes: 64 * 1024 * 1024, glyphs: \"none\" } });\n\n  // types\n- let options: FontCacheOptions;\n+ let options: RendererOptions;\n```\n"
    filename: js-cache-options.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n  \"@takumi-rs/helpers\":\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-pdf:\n    type: minor\n  takumi-paint:\n    type: minor\n  takumi-js:\n    type: minor\n---\n\n# See what a renderer's cache holds\n\n`Renderer`, `PdfRenderer`, and `Painter` have `cacheStats()`, which reports the bytes the pool holds and how lookups of each kind went.\n\n```ts\nconst { memory, images } = renderer.cacheStats();\nconsole.log(memory.current, memory.high);\nconsole.log(images.hits, images.misses, images.evictions);\n```\n\n`takumi-js` exports `cacheStats` for the renderer that `render` and the other functions share. It returns `undefined` until the first render creates that renderer. In Rust, `Cache::stats` does the same for a `Cache`.\n"
    filename: cache-live-stats.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-pdf:\n    type: patch\n  takumi-paint:\n    type: patch\n---\n\n# takumi-pdf and takumi-paint read their WebAssembly in Vite dev SSR from a package inside the root\n\nWith `ssr.noExternal`, the Vite dev server serves the WebAssembly binary from the package's own `pkg/` folder, and the first server render failed with `Unable to locate Takumi WASM asset for SSR`. The loaders now look there too, as `@takumi-rs/wasm` already does.\n"
    filename: pdf-paint-vite-dev-ssr.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# An `<img>` without a source stays whole across pages\n\nIn a PDF, a tall `<img>` with no `src` split across two pages as an empty box. It now moves to the next page whole when it does not fit, as Chromium prints it, and it lays out at the same size as before.\n"
    filename: img-without-source-replaced.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# `break-after: page` inside a flex or grid item starts a new page after the container\n\nIn a PDF, `break-after: page` on the last child of a flex or grid item, or on the last row of a table inside one, was dropped, so the content after the container stayed on the same page. The break now carries out through the item and the table, as Chromium prints it, and the content after the container starts a new page.\n\n```html\n<div style=\"display: flex\">\n  <div>\n    <div>First</div>\n    <div style=\"break-after: page\">Ends with a forced break</div>\n  </div>\n</div>\n<div>Starts a new page</div>\n```\n"
    filename: flex-grid-item-break-after.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-pdf:\n    type: minor\n---\n\n# `PdfError::Krilla` is now `PdfError::Writer`\n\nThe variant that carries a failure from writing the PDF file is renamed, since the PDF writer is now takumi's own module. Match on `PdfError::Writer` where you matched on `PdfError::Krilla`. Its message is unchanged.\n"
    filename: pdf-writer-error.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-pdf:\n    type: minor\n---\n\n# `@page` rules style the page and draw page-margin boxes, such as `@bottom-center`\n\nA paged PDF now reads more of an `@page` rule than `size` and `margin`. The rule styles the page itself, and a page-margin rule nested in it draws its `content` in that part of the margin.\n\n```css\n@page {\n  margin: 20mm 15mm;\n  border: 0.5pt solid #94a3b8;\n  background: #f8fafc;\n\n  @bottom-center {\n    content: \"Page \" counter(page) \" of \" counter(pages);\n  }\n}\n```\n\n- `background` covers the whole page, margins included.\n- `border` and `padding` lie inside the margins, around the area the content flows in.\n- `width` and `height` size the page's box, and `auto` margins center a smaller box on the page. They include the border and padding. Set `box-sizing: content-box` to measure them as Chromium does.\n- Each of the 16 page-margin rules, such as `@top-left` and `@bottom-right-corner`, takes strings, images, `counter(page)`, and `counter(pages)` in `content`. The boxes inherit `font` and `color` from the `@page` rule and draw in the margin without growing it.\n"
    filename: page-margin-boxes.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# An image whose header claims too many pixels fails to load instead of aborting a PDF\n\nA PNG or WebP whose header claims an edge longer than 8192 pixels, the limit every decode already enforced, now fails to load like any other undecodable image. A PDF used to embed such a PNG as is and abort the whole process when it sized a buffer from that header.\n"
    filename: oversized-image-header.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n  takumi-raster:\n    type: patch\n---\n\n# A box moved to the next page by `break-before: page` keeps its text\n\nA paged PDF, or the pages `takumi-raster`'s `render_pages` streams, could lose the text of a box with `break-before: page` that came right after a flex container spanning several pages. The page that holds the box now matches the same document rendered in one pass.\n"
    filename: stream-forced-break-items.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A `break-inside: avoid` box stays on its page when only an absolute box inside it runs past\n\nIn a PDF, a `break-inside: avoid` box moved to the next page whole when an absolutely positioned box inside it started past the end of the page, even though the box itself fit. The box now stays where it fits, and only the absolute box continues on the next page, as Chromium prints it.\n\n```html\n<!-- The box fits at the bottom of a page, and the badge starts past it -->\n<div style=\"position: relative; break-inside: avoid\">\n  Kept on the first page\n  <div style=\"position: absolute; bottom: -40px\">Badge</div>\n</div>\n```\n"
    filename: avoid-break-out-of-flow-overflow.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-pdf:\n    type: patch\n---\n\n# A gradient with more than two color stops no longer leaks memory\n\nEvery PDF that drew a gradient with three or more stops, such as `conic-gradient(red, yellow, green, blue)`, kept part of that gradient's function in memory after the render finished. A long-running process that renders many such PDFs now holds steady.\n"
    filename: pdf-gradient-leak.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A flex row whose item margin runs past the page moves to the next page whole\n\nIn a PDF, a flex row whose item margin ran past the end of the page stayed on that page and spilled onto the next. The row now reaches as far as that margin, as in Chromium, and moves to the next page whole when it fits there.\n\n```html\n<!-- The item fits on the page, and its margin ends past it -->\n<div style=\"display: flex\">\n  <div style=\"height: 80px; margin-bottom: 30px\">Item</div>\n</div>\n```\n"
    filename: fragment-block-size-for-breaking.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-pdf:\n    type: patch\n---\n\n# Damaged fonts and extreme transforms no longer crash a PDF render\n\n`takumi-pdf` used to panic on a few inputs that a damaged font or an extreme style can produce. The PDF now renders in each case:\n\n- A font whose italic angle is `NaN` embeds with an italic angle of `0` in its PDF font descriptor.\n- A clip path whose transform overflows `f32` clips everything inside it.\n- A glyph whose bounds come out `NaN` falls back to a unit box for its paint bounds.\n"
    filename: pdf-vendored-panics.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-pdf:\n    type: minor\n---\n\n# `display: contents` renders an element's children in its place\n\n`display: contents` used to be dropped as an unknown value. An element with it now generates no box, and its children, `::before`, and `::after` lay out as children of its parent while they still inherit from the element.\n\n```html\n<!-- The flex container lays out One, Two, and Three as three items -->\n<div style=\"display: flex\">\n  <div style=\"display: contents\">\n    <div>One</div>\n    <div>Two</div>\n  </div>\n  <div>Three</div>\n</div>\n```\n\n- A flex or grid container takes those children as its items.\n- Replaced elements and form controls render nothing with it, as in browsers.\n- The root element computes it to `block`, as in browsers.\n- The Tailwind `contents` class sets it.\n"
    filename: display-contents.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-raster:\n    type: patch\n  takumi-pdf:\n    type: patch\n  takumi-svg:\n    type: patch\n---\n\n# An SVG image no longer takes the host's color, as in Chromium\n\nAn SVG drawn by `<img>`, `background-image`, or another image now draws `currentColor` in its own `color`, or black when it sets none. Only an `svg` element takes the `color` of the box it sits in, whether it is inline in HTML, a JSX `<svg>`, or a `Node` with the `svg` tag name.\n\n```html\n<div style=\"color: red\">\n  <!-- Red before and after -->\n  <svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"currentColor\" /></svg>\n  <!-- Before: red. After: black -->\n  <img src=\"circle.svg\" />\n</div>\n```\n\n#### Migration\n\nTo keep an icon in the host's color, render it as an `svg` element, or give its `Node::image` the `svg` tag name.\n\n```diff\n- Node::image(source)\n+ Node::image(source).with_tag_name(\"svg\")\n```\n"
    filename: svg-image-isolated-color.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-raster:\n    type: minor\n  takumi-svg:\n    type: minor\n  takumi-pdf:\n    type: minor\n---\n\n# `paint-order: stroke` draws `-webkit-text-stroke` under the text\n\nOn HTML text, `paint-order: stroke` or `stroke fill` now draws the stroke first and the fill on top, as Chrome does, so a thick outline no longer eats into the letters. Images, SVG output, PDFs, and the paint tree all follow it.\n\n```css\nh1 {\n  -webkit-text-stroke: 8px black;\n  paint-order: stroke;\n}\n```\n\n- The fill and the stroke each paint over a whole run, as in Chrome. With `normal`, a letter's fill no longer covers the previous letter's stroke where they overlap.\n- `PaintOrder::text_phases` returns the order, and `InlineBrush` carries the run's `paint_order`.\n"
    filename: text-paint-order.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-pdf:\n    type: patch\n---\n\n# PDFs draw damaged color fonts, unsorted fonts, and zero-length lines correctly\n\nA COLR color font with a palette index past its palette, or a layer with no clip, no longer crashes the render, and its colors come from the font's first palette. A font whose table directory is out of order now embeds, a zero-length SVG line with `stroke-linecap: round` draws a dot, and an image's ICC profile embeds whenever the PDF version supports that profile version.\n"
    filename: pdf-upstream-fixes.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# `break-after: page` breaks once when an absolute box inside runs onto the next page\n\nIn a PDF, when an absolutely positioned box ran past the page from inside a box with `break-after: page`, the break applied again on the next page, so a float after the box landed a page later than in Chromium. The break now applies once, where the box's content ends.\n\n```html\n<!-- The absolute box starts past the bottom of the page -->\n<div style=\"position: relative; break-after: page\">\n  The box\n  <div style=\"position: absolute; top: 110px\">Runs onto the next page</div>\n</div>\n<div style=\"float: left\">Starts the next page</div>\n```\n"
    filename: break-after-once-past-block-end.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A floated flex or grid item breaks across pages as any other item\n\n`float` does not apply to a flex or grid item, but in a PDF an item with `float: left` or `float: right` was still treated as a float when pages broke. Its `break-after` was dropped, and the container's background could stop short on the next page. Such an item now lays out and breaks as any other item, as in Chromium.\n"
    filename: flex-grid-items-do-not-float.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-pdf:\n    type: minor\n---\n\n# The `raster-images` feature of takumi-pdf is folded into `images`\n\n`images` now brings the PNG, JPEG, and WebP decoders itself. A build that enabled `raster-images` alone should enable `images` instead, since without it the PDF never drew the raster images those decoders read.\n"
    filename: pdf-images-feature.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# Content after a box that overflows a page starts below the overflow\n\nIn a paged PDF, a box at the top of a page can reach past the page's end, such as a flex row whose item margin runs past it. The content after that box started at the top of the next page and drew over the overflow. It now starts below the overflow, as in Chromium.\n"
    filename: root-monolithic-overflow.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-pdf:\n    type: patch\n---\n\n# A font with a non-finite CFF number no longer crashes a PDF render\n\nA CFF font that holds `NaN` or an infinite real number, as a damaged font file can, made `takumi-pdf` panic while it subset the font. The PDF now renders, and the number is written as `0`. A font matrix that overflows once scaled to the CID font's units now fails the subset, instead of writing a matrix that hides every glyph.\n"
    filename: pdf-cff-real-number.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-raster:\n    type: patch\n  takumi-svg:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A positioned or stacking inline element paints as a layer of its own\n\nA `display: inline` element now paints as a layer of its own, as Chrome paints it, when any of these hold. At `opacity: 0` it paints nothing at all, whatever else holds.\n\n- `position` is not `static`\n- `opacity` is below 1\n- `filter` or `backdrop-filter` is not `none`\n- `mix-blend-mode` is not `normal`\n- `isolation` is `isolate`\n- `clip-path` or `mask` is not `none`\n\nIts backgrounds, its text, and the boxes inside it, floats and inline-blocks included, composite together after the content around it. Before, `opacity` faded each line and each text run on its own, and the other properties did nothing.\n\n```html\n<!-- Before: each line and each text run fades on its own -->\n<!-- After: the whole element fades as one layer -->\n<span style=\"opacity: 0.5; background: gold\">A span that wraps onto a second line</span>\n```\n\n- The layer's box is the union of the element's line boxes. This approximates Chrome, where each line's box stays apart.\n- A text node with a style of its own now opens an inline box as a span does.\n- In the paint tree, such an element is a box with `effects`, and its line boxes and its own text node are its children.\n- `NodePaint::inline_layer`, `InlineLayer`, and `OwnContent::InlineLayer` are new.\n\n#### Migration\n\n`InlineBrush` no longer has an `opacity` field, since an inline element's `opacity` no longer applies per text run. It applies once, to the layer of the `NodePaint` whose `inline_layer` is set. In the paint tree, that element's box holds the value in `effects.opacity`.\n\n```diff\n- let opacity = brush.opacity;\n+ let opacity = match &node.kind {\n+   NodeKind::Box { effects: Some(effects), .. } => effects.opacity,\n+   _ => 1.0,\n+ };\n```\n\nHere `node` is the element's `PaintNode` in the paint tree.\n"
    filename: inline-opacity-group.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-raster:\n    type: minor\n  takumi-svg:\n    type: minor\n  takumi-pdf:\n    type: minor\n  takumi:\n    type: minor\n---\n\n# One `Cache` holds what renders reuse, in one pool of bytes\n\n`Cache` replaces `ResourceCache` in the Rust crates. Everything it keeps shares `max_bytes`, 128 MiB by default. Setting `images` or `glyphs` to `ImageCacheMode::None` keeps none of that kind.\n\n```rust\nlet cache = CacheOptions::builder()\n  .max_bytes(256 << 20)\n  .images(ImageCacheMode::None)\n  .build();\n\nlet options = RenderOptions::builder()\n  .viewport(viewport)\n  .node(node)\n  .cache(cache.clone())\n  .build();\n```\n\n`RenderOptions`, `SvgOptions`, `PdfOptions`, `MeasureOptions`, and `PaintTreeOptions` take it as `cache`. A render without one shares `Cache::shared()`. PDF renders now reuse decoded images, and SVG and paint renders cache `data:` images.\n\n#### Migration\n\n`ResourceCache` and the `resource_cache` setter of `RenderOptions` and of the `takumi-pdf` options are removed. Pass the cache as `cache`.\n\n```diff\n- let cache = ResourceCache::new(256 << 20);\n- let image = cache.get_or_decode(&bytes, ImageCacheMode::Auto)?;\n- let sheet = cache.get_or_parse_stylesheet(sources);\n+ let cache = CacheOptions::builder().max_bytes(256 << 20).build();\n+ let image = cache.decode_image(&bytes, ImageCacheMode::Auto)?;\n+ let sheet = cache.parse_stylesheet(sources);\n```\n"
    filename: unified-cache.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# Glyphs, Tailwind classes, and `@font-face` faces stay in the render's `Cache`\n\nTwo renderers in one process no longer share glyphs, compiled Tailwind classes, `@font-face` faces, or decoration intercepts. Each `Cache` keeps its own glyphs in the pool it shares with every other kind of data. `glyphs(ImageCacheMode::None)` keeps none.\n\n```rust\nlet cache = CacheOptions::builder().glyphs(ImageCacheMode::None).build();\n```\n\nIn `@takumi-rs/core` and `@takumi-rs/wasm`, `setGlyphCacheMaxBytes(0)` now keeps no glyphs only in renderers created after the call, and any other size keeps them in the shared pool. In `takumi-js`, it reaches only the renderer behind `render`, not a `Renderer` from `takumi-js/node`.\n\n#### Migration\n\n`set_glyph_cache_max_bytes` in `takumi-core` is deprecated. A size of `0` still keeps no glyphs in the caches built after the call, and a larger size no longer bounds them apart.\n\n```diff\n- set_glyph_cache_max_bytes(0);\n- let cache = CacheOptions::builder().build();\n+ let cache = CacheOptions::builder().glyphs(ImageCacheMode::None).build();\n```\n"
    filename: cache-scopes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# A render aborted while its `fonts` list resolves starts no image loader\n\nWhen the `signal` aborts while a promised `fonts` list is still resolving, the render now rejects as soon as the list resolves, without calling any image's `data()` loader. Before, it called each loader and then rejected.\n"
    filename: abort-before-image-loaders.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# A WOFF font in `@takumi-rs/wasm` fails with an error that says to convert it\n\n`@takumi-rs/wasm` cannot read WOFF fonts. Registering one now fails with an error that names the format, instead of `Unsupported font format`.\n\n```ts\nawait renderer.registerFont(woffBytes);\n// Before: Unsupported font format\n// After: This build cannot read WOFF fonts. Convert the font to a format it reads, such as TTF\n```\n\nThe fonts docs now list the formats each package reads. In Rust, a `takumi-core` build without the `woff` or `woff2` feature returns `FontError::FormatLeftOut` for that format.\n"
    filename: woff-format-error.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# An `svg` element drawn in two text colors shows each color\n\nAn `svg` element that inherits `color`, through `color=\"currentColor\"` on its root or a `<style>` rule, now draws in the `color` of each box it sits in. Before, every copy took the first color it was drawn in. An SVG image that uses its host's fonts follows each host too.\n\n#### Migration\n\n`SvgSource::vector_ops` is removed. `SvgSource::picture` returns the same ops, shared with the cache.\n\n```diff\n- let ops = source.vector_ops(&host, viewport);\n+ let picture = source.picture(&host, viewport);\n+ let ops = picture.ops();\n```\n"
    filename: svg-host-reads.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# Vite's dev server finds the WebAssembly binary for a bundled SSR dependency\n\nWhen `ssr.noExternal` bundles `@takumi-rs/wasm` into the dev server's SSR modules, the first render now finds the WebAssembly binary in the package. It used to fail with this error:\n\n```text\nUnable to locate Takumi WASM asset for SSR: /node_modules/@takumi-rs/wasm/pkg/takumi_wasm_bg.wasm\n```\n"
    filename: wasm-vite-dev-ssr.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n  \"@takumi-rs/helpers\":\n    type: patch\n---\n\n# A JSX `<svg>` or `<img>` sized with `\"100%\"` or `\"24px\"` draws at that size\n\nA JSX `<svg>` or `<img>` whose `width` or `height` was a string with a unit, such as `\"100%\"`, `\"2em\"`, or `\"24px\"`, drew nothing. It now draws at that size, as the same markup passed as HTML does.\n\n```tsx\n<div style={{ display: \"flex\", width: 200, height: 100 }}>\n  <svg width=\"100%\" height=\"50%\" viewBox=\"0 0 2 1\">\n    …\n  </svg>\n</div>\n// Before: the svg draws nothing\n// After: the svg's box is 200 × 50, since a percentage resolves against the containing block\n```\n\n- An `<svg>` reads `width` and `height` as CSS lengths, such as `2em`, and ignores a negative one.\n- An `<img>` reads them as HTML does, as pixels or a percentage, so `width=\"2em\"` is 2 pixels.\n"
    filename: jsx-svg-percent-size.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n  takumi-core:\n    type: minor\n  takumi-raster:\n    type: patch\n---\n\n# GIFs, APNGs, and animated WebPs draw at the device pixel ratio, and as backgrounds\n\nWith a `devicePixelRatio` above 1, an animated image drew at its CSS size in device pixels. It filled the top-left of its box, and its right column and bottom row streaked across the rest. A single-frame GIF drew the same way. An animated image used as a `background-image` drew nothing at all. Both now draw as a still PNG does.\n\n`ImageSource::dimensions` gives an image's natural size in its own pixels.\n"
    filename: animated-image-device-pixel-ratio.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# An `offset-path` with huge coordinates renders instead of panicking\n\nA `path()` in `offset-path` whose coordinates run into the quintillions, as generated or user-supplied paths can, panicked while measuring its length. It now measures, and a percentage `offset-distance` lands at that share of the whole path instead of near its start.\n"
    filename: offset-path-huge-coordinates.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-raster:\n    type: patch\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# An image moved by a fraction of a pixel blends its edges\n\nAn image that a `transform` such as `translate(0.5px)` moved by part of a pixel, drawn at its own size, snapped to the nearest whole pixel and lost the shift. It now blends across the pixel it falls between, as a browser draws it.\n"
    filename: image-fractional-offset.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-js:\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# `require` loads the WebAssembly backend again\n\nA CommonJS build that renders on the WebAssembly backend, such as one in a WebContainer, works again. It used to fail with `TypeError: (0 , _takumi_rs_wasm.default) is not a function`.\n\n```js\nconst { init } = require(\"takumi-js/wasm\");\n// Before: init is the module object, not a function\n// After: init loads the WebAssembly binary\n```\n\n`require(\"takumi-js/wasm/no-init\")` returns the same `init`, and `@takumi-rs/wasm` now exports `init` by name as well as by default.\n"
    filename: wasm-init-commonjs.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-raster:\n    type: patch\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# Animated PNGs and GIFs are smaller and encode faster when frames repeat\n\nEach frame of an animated PNG now stores only the pixels that changed since the frame before it, and a frame that changes nothing stores one pixel. An animated GIF stores an image held across several frames once, shown for their total delay, so it has fewer frames. Both decode to the same images at the same times as before. GIF frames of 10ms or less stay separate, since browsers stretch each one to 100ms.\n"
    filename: animation-held-frames.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-raster:\n    type: patch\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# A cropped image decoded at its drawn size draws sharp\n\nAn image that `object-fit: cover` or `object-position` crops, decoded at the size it draws, could pass through the bilinear filter and come out slightly soft, as when a photo 4032 pixels wide draws 1200 wide. It now copies its pixels, and draws faster.\n"
    filename: image-decoded-at-draw-size-sharp.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/core\":\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n---\n\n# Unsupported CSS warns through `console.warn`\n\n`@takumi-rs/core`, `@takumi-rs/wasm`, and `takumi-js` on either of them now report a CSS property takumi does not support through `console.warn` each time they parse a style sheet or `style` attribute that uses it. A render that reuses a `css` list the renderer still holds parsed does not warn again. Before, the declaration dropped without a word, so a typo such as `widht` changed the render silently. Other warnings takumi logs, such as an animated image frame that fails to decode, print the same way.\n"
    filename: css-warnings-in-js.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/core\":\n    type: patch\n---\n\n# A missing native binding names the package to install\n\nWhen `@takumi-rs/core` cannot load its native binding, the error now names the platform package to install and links the troubleshooting guide, instead of blaming an npm bug. On a platform with no published binding, it points to `@takumi-rs/wasm`.\n"
    filename: missing-native-binding-error.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-js:\n    type: patch\n---\n\n# `require(\"takumi-js/wasm\")` keeps the exports it re-exports\n\nA CommonJS `require(\"takumi-js/wasm\")` returned only the backend's default `init`, so the names `takumi-js/wasm` re-exports from `@takumi-rs/wasm`, such as `Renderer`, were missing. It now returns them beside `default`, as the ES module and the type declarations already did.\n"
    filename: takumi-js-cjs-wasm-exports.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-js:\n    type: patch\n---\n\n# Overlapping first renders load the WebAssembly binary once\n\nOn the WebAssembly backend, `render` and `ImageResponse` calls that overlap before the WebAssembly binary has loaded now share one load. Before, each call loaded the binary, and the later load broke the renderers made on the earlier one. If the load fails, the next call tries again.\n\n```ts\nawait Promise.all([\n  render(<A />, { width: 1200, height: 630 }),\n  render(<B />, { width: 1200, height: 630 }),\n]);\n// Before: each call loads the binary, and the first one's renderer can break\n// After: both calls share one load\n```\n"
    filename: wasm-shared-load.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: patch\n---\n\n# JSX renders React class components\n\nA component written as a class that extends `Component` or `PureComponent` threw `Class constructor cannot be invoked without 'new'` when rendered. It now renders as React mounts it: `defaultProps` fill missing props, `getDerivedStateFromProps` sets the first state, and `render` draws the element. This covers a class wrapped in `memo` and a class inside an inline `<svg>`.\n"
    filename: jsx-class-components.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: patch\n---\n\n# A missing emoji image no longer fails the render\n\nWhen the CDN cannot serve an emoji's image, such as an emoji Twemoji does not draw, the render leaves that emoji out instead of rejecting. This covers every image from an emoji CDN, so a `takumi-js` render and a renderer's own `prepare` behave the same. `images.throwOnError` still rejects when any other image fails.\n"
    filename: emoji-image-fallback.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: patch\n---\n\n# `preserveAspectRatio`, `clipPathUnits`, and `dominantBaseline` take effect on a JSX `<svg>`\n\n`fromJsx` now writes each attribute of an inline `<svg>` the way React DOM writes it. Before, SVG ignored the attributes below, so `preserveAspectRatio=\"none\"` had no effect.\n\n```tsx\n<svg viewBox=\"0 0 10 10\" preserveAspectRatio=\"none\">\n  …\n</svg>\n// Before: written as preserve-aspect-ratio=\"none\", which SVG ignores\n// After: written as preserveAspectRatio=\"none\"\n```\n\n- `preserveAspectRatio` and `clipPathUnits` stay in camelCase, as SVG spells them.\n- `dominantBaseline`, `renderingIntent`, `strikethroughPosition`, `strikethroughThickness`, and `xHeight` become `dominant-baseline`, `rendering-intent`, `strikethrough-position`, `strikethrough-thickness`, and `x-height`.\n"
    filename: jsx-svg-camel-attributes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: patch\n---\n\n# `fromJsx` renders what `StrictMode`, `Suspense`, and `Profiler` wrap\n\nA tree wrapped in `<StrictMode>`, `<Suspense>`, or `<Profiler>` rendered nothing through `fromJsx`. So did a tree built by a JSX runtime whose fragment is not React's `Fragment`. These elements now render their children, as `<>` already did.\n"
    filename: jsx-symbol-types.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n# `Fonts::with_system_fonts` replaces `FontResource::last_resort`\n\n`Fonts::with_system_fonts` creates a `Fonts` with the fonts it is given installed as system fonts, the fonts a renderer starts with.\n\nLookup and removal by family name treat system fonts differently from registered fonts:\n\n- A family name reaches a system font only when no registered font has that name.\n- `unregister_family` never removes a system font.\n\nFont fallback tries the system fonts last, as it did `last_resort` fonts:\n\n- By default, they come after every registered family.\n- A snapshot from `snapshot_with_fallbacks` tries only the families it lists before the system fonts.\n- A system family that the snapshot lists by name draws at its place in that list.\n- For an emoji, fallback tries every color font before any monochrome one, so a color system font can draw an emoji before a monochrome registered font.\n\n```rust\nlet mut fonts = Fonts::with_system_fonts([FontResource::new(geist).override_info(FontOverride {\n  family_name: Some(\"Geist\".into()),\n  ..Default::default()\n})])?;\n\n// A font registered as Geist draws first. The system Geist draws a character it lacks\n// when no other registered font has that character.\nfonts.register(FontResource::new(geist_cyrillic).override_info(FontOverride {\n  family_name: Some(\"Geist\".into()),\n  ..Default::default()\n}))?;\n```\n\nA system font joins no generic family, so `generic_family` on a font passed to `with_system_fonts` does nothing.\n\n#### Migration\n\n`FontResource::last_resort` is removed. Pass those fonts to `Fonts::with_system_fonts` when you create the `Fonts`, instead of registering them.\n\n```diff\n- let mut fonts = Fonts::default();\n- fonts.register(FontResource::new(geist).last_resort())?;\n+ let mut fonts = Fonts::with_system_fonts([FontResource::new(geist)])?;\n```\n"
    filename: system-fonts.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n# The paint tree lists the elements painting skips\n\n`PaintDocument::unpainted` names each element that painting skips, and why. It lists only the outermost one, since painting skips everything inside it too. These elements have no node, so the list is where you find why one is absent.\n\n```diff\n  {\n    \"steps\": [ … ],\n+   \"unpainted\": [\n+     { \"element\": { \"path\": [0, 1], \"tagName\": \"section\" }, \"reason\": \"opacity-zero\" }\n+   ]\n  }\n```\n\n- `opacity-zero` marks an element that `opacity: 0` hides.\n- `display-none` marks the root element when it has `display: none`.\n"
    filename: paint-tree-unpainted.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n  takumi-cli:\n    type: patch\n---\n\n# `takumi pdf` takes a whole HTML file as a header or footer\n\nA `--header` or `--footer` file that opens with a doctype or `<html>` now fills the band with its body's content, as Chromium does with a header template. Before, the file brought its body's margin into the band.\n\n- A page and its header that both write `<img src=\"logo.png\">` for different files now each draw their own image.\n- `takumi pdf --pages 1,-` is refused with \"`-` names no page. Write a page on at least one side of `-`.\"\n- An empty `url()` in a style sheet loads nothing.\n- `takumi image --dpr` with an `.svg` output is an error, since an SVG has no pixels to scale.\n\nIn Rust, `FromHtmlOptions::fragment` parses a source as a fragment even when it opens with a doctype or `<html>`, dropping its `html`, `head`, and `body` tags.\n\n```rust\nlet options = FromHtmlOptions::builder().fragment(true).build();\n// The node is the <p> alone\nlet node = parse_html(\"<!doctype html><html><body><p>hi</p></body></html>\", options)?.node;\n```\n"
    filename: cli-edge-cases.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n# `FromHtmlOptions` can parse a fragment as a whole document\n\nThe `document` option of `FromHtmlOptions` parses the source as a browser opens an HTML file, with `html` and `body` elements, even when it starts with neither a doctype nor `<html>`. Rules such as `body { font-family: … }` then match. Without it, such a source still parses as a fragment.\n\n```rust\nlet options = FromHtmlOptions::builder().document(true).build();\n// The tree has `html`, `head`, and `body`, so the `body` rule matches\nlet parsed = parse_html(\"<style>body { margin: 0 }</style><p>Hello</p>\", options)?;\nlet stylesheet = StyleSheet::parse(&parsed.css.join(\"\\n\"))?;\n// Render `parsed.node` with `.stylesheet(stylesheet.into())`\n```\n"
    filename: html-document-option.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-svg:\n    type: patch\n---\n\n# An `svg` element embedded in SVG output takes the host's color whenever it draws with it\n\nIn SVG output, an embedded `svg` element that draws with `currentColor` now carries the host's `color` on its root, so a viewer draws it as takumi does. Before, it got the color only when its markup spelled out `currentColor`.\n\n#### Migration\n\n`SvgSource::source_with_current_color` is removed.\n\n```diff\n- let markup = source.source_with_current_color(color);\n+ let markup = source.embedded_source(&host, viewport);\n```\n"
    filename: svg-embed-color.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n# An inline element's background and border are a box in the paint tree\n\nIn the paint tree, a `display: inline` element with a `background` or `border` now has a box node for each line it sits on, as a `display: inline-block` element already had. The box names the element and holds its `inline-background` and `border` drawables, which the enclosing text node used to hold.\n\n```diff\n  $ takumi paint marked.html -o - --detail drawables\n      text p 8,16 1184x21 \"Some marked text\" Geist 16px #000000\n        - glyphs text #000000 \"Some \" at 0,16 line 0 Geist 16px\n        - glyphs text #000000 \"marked\" at 47.3,16 line 0 Geist 16px\n        - glyphs text #000000 \" text\" at 103.48,16 line 0 Geist 16px\n-       - fill inline-background …\n-       - fill border …\n+     box span 54.3,15 57.19x23 border\n+       - fill inline-background rect -0.3,0 57x23 #ffff00\n+       - fill border path #ff0000\n```\n"
    filename: inline-box-paint-node.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n# A font registered under the built-in Geist's name draws before it\n\nA font registered as `Geist` used to lose to the built-in Geist at weights 300 to 800, so its Cyrillic and Latin Extended characters drew as boxes. A family now reaches its last-resort faces only when no other face has it, and font fallback still reaches them after every registered family.\n"
    filename: registered-family-before-last-resort.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n---\n\n# `parse_html` reports the style sheets a document links\n\nA host can now fetch the CSS a document links and resolve it as a browser does.\n\n```rust\nlet parsed = parse_html(html, FromHtmlOptions::default())?;\n// `fetch_css` is your own loader, which returns `Option<String>`\nlet css = parsed.css_with_links(|link| fetch_css(&link.href));\n```\n\n- `ParsedHtml::links` lists each `<link rel=\"stylesheet\">` that would load, with its `href` and `media`. It leaves out a `disabled` link and one whose `type` is not CSS.\n- `ParsedHtml::base_href` holds the `href` of the first `<base>` that has one.\n- `ParsedHtml::css_with_links` returns, in document order, the CSS of each non-empty CSS `<style>` element and each fetched link, and wraps a link's `media` in an `@media` rule.\n- Titled and alternate style sheets follow the preferred style sheet set, as in Chrome. Untitled sheets that are not alternate always apply. Of the titled ones, only the preferred set applies. The set is named by whichever comes first in the document, a `<meta http-equiv=\"default-style\">` with a non-empty `content` or a titled sheet that is not alternate.\n"
    filename: html-linked-stylesheets.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n# A negative `calc()` padding clamps to zero\n\nA `padding` written as a `calc()` that comes out negative was applied as a negative padding. It now clamps to zero, as browsers do.\n\n```css\npadding: calc(0px - 4px);\n/* Before: a padding of -4px */\n/* After: a padding of 0 */\n```\n"
    filename: negative-calc-padding.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n  takumi-cli:\n    type: patch\n---\n\n# `takumi` loads the `@import` rules of a `<style media>` element\n\nThe `takumi` command used to drop the `@import` rules of a `<style>` element with a `media` attribute. It now loads them and applies them under that media, as Chrome does.\n\n```html\n<style media=\"print\">\n  @import \"print.css\";\n</style>\n```\n\n- `ParsedHtml::styles` lists each non-empty CSS `<style>` element in the HTML namespace that applies, so not one inside an inline `<svg>`, with its `text` and `media` apart. That is every untitled one, plus the titled ones in the preferred style sheet set.\n- `StyleElement::css` returns the text inside the `@media` rule that `ParsedHtml::css` holds.\n"
    filename: style-element-media.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi:\n    type: minor\n  takumi-core:\n    type: minor\n  takumi-cli:\n    type: patch\n---\n\n# `takumi image` warns of the characters no font draws\n\n`takumi image` used to draw an empty box for a character no loaded font draws, without a word. It now prints a warning that names each one.\n\n```sh\n$ takumi image hello.html -o hello.png\nwarning: no font draws 你 (U+4F60), 好 (U+597D), so each shows as an empty box. Pass a font that does with `--font`, or check the `font-family` of that text.\n```\n\nThe rest of the command line says more when something is off:\n\n- `--list-resources` lists a file that is not there as `missing`, where it said `blocked`. Scripts that read the status column see the new value.\n- `--margin` and `--page` refuse a number without a unit, such as `--margin 5`.\n- An error that `--font`, `--root`, or `takumi pdf` fixes now names that flag or command, such as \"`takumi image` writes images, but the output ends in `.pdf`. Use `takumi pdf`.\"\n\n```diff\n  $ takumi image page.html --list-resources\n- image\tblocked\tfile:///site/gone.png\t…\n+ image\tmissing\tfile:///site/gone.png\t…\n```\n\nIn the `takumi` crate, `uncovered_characters` returns the characters no registered font draws for a render, each once.\n\n```rust\nlet missing: Vec<char> = takumi::uncovered_characters(options)?;\n\nif !missing.is_empty() {\n  eprintln!(\"no font draws {missing:?}\");\n}\n```\n"
    filename: cli-diagnostics.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# `takumi` warns of unsupported properties, and `--deny-warnings` fails on any warning\n\nA declaration whose property takumi does not support, such as a misspelled one, now prints a warning with its line and column. `--deny-warnings` turns any warning into a failure that exits with `1` and writes no output.\n\n```sh\n$ takumi image card.html -o card.png --deny-warnings\nwarning: ignored the property `widht` at line 1, column 7 of its style sheet or `style` attribute, since takumi does not support it. Check its spelling.\nerror: `--deny-warnings` is set and the command raised 1 warning, so it wrote nothing. Fix each one, or drop the flag to write the output anyway.\n```\n\nProperties that cannot change a render, such as `cursor`, raise no warning and show only under `--log debug`.\n"
    filename: cli-deny-warnings.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: patch\n---\n\n# `takumi upgrade` finds a Windows install and keeps a crates.io install on crates.io\n\nOn Windows, `takumi upgrade` now recognizes a takumi that `cargo install` put there, and gives you the command to finish the upgrade yourself. A takumi installed from crates.io reinstalls from crates.io, even when Cargo has another default registry.\n\n```sh\n$ takumi upgrade --dry-run\n# Before\ncargo install --locked takumi-cli --root /opt/takumi\n# After\ncargo install --locked --registry crates-io takumi-cli --root /opt/takumi\n```\n\n- On Windows, `takumi upgrade` no longer says takumi was not installed with `cargo install`.\n- On Windows, it does not upgrade takumi itself, since Windows cannot replace a running program. It fails with \"Windows cannot replace takumi while it runs. Run `cargo install …` in PowerShell once this command exits.\" Every command it prints there is quoted for PowerShell.\n- A printed command leaves out the password in a Git URL, and the user name too unless the URL uses SSH.\n"
    filename: cli-upgrade-windows.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# `takumi completions` writes a shell completion script\n\n`takumi completions <shell>` writes a script that completes takumi's commands, flags, and their values when you press Tab. It supports `bash`, `zsh`, `fish`, `powershell`, and `elvish`. In bash, zsh, and fish, `--root` and `--allow-read` complete only directories.\n\n```sh\nmkdir -p ~/.zfunc\ntakumi completions zsh > ~/.zfunc/_takumi\n# Then add `fpath+=~/.zfunc` before `compinit` in ~/.zshrc\n```\n\n`takumi completions --help` lists where each shell reads the script.\n"
    filename: cli-completions.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# `takumi paint` writes what a render draws, as text or JSON\n\n`takumi paint` prints one line for each box, text, and image of a document, with where it lands and what fills it. A line also says when its node lies off the canvas, has no area, or draws nothing, and the elements that `opacity: 0` hides follow the outline.\n\n```sh\n$ takumi paint card.html -o - --width 300 --height 100\ncanvas 300x100\nbox html 0,0 300x121\n  box body 0,0 300x121\n    box div#card 0,0 300x100 background #0f172a clips-overflow\n      box h1.title.big 0,0 300x41\n        text h1.title.big 0,0 300x41 \"Hello\" Geist 700 32px #ffffff\n      box div.ghost 900,0 20x20 background #ff0000 offscreen past the right edge\nnot painted\n  section opacity: 0\n```\n\n- `--detail drawables` adds each thing a node draws.\n- `--detail full` adds the paint order as well, and in JSON every glyph.\n- `--format json`, or an output that ends in `.json`, writes the paint tree that takumi-paint returns.\n"
    filename: cli-paint.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# `--log` prints what a render did\n\n`--log info` prints a line to standard error for each stage of a render, with the time since the command began.\n\n```sh\n$ takumi image card.html -o card.png --log info\n[     0.2ms] input: read file:///site/card.html, 198 bytes\n[     1.4ms] stylesheet: style sheets loaded: 0\n[     3.6ms] resource: images loaded: 0\n[     8.2ms] render: rendered 1464 bytes\n[     8.2ms] output: writing card.png\n```\n\n`--log debug` adds a line for:\n\n- each resource loaded\n- each page, and why it ended\n- the CSS the parser dropped\n- each font family or image the render found missing\n"
    filename: cli-log.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# The `takumi` command line is on crates.io\n\n`takumi` renders an HTML file to a PNG, JPEG, WebP, SVG, or PDF from the command line. A document reads only the directories you grant, and never the network.\n\n```sh\ncargo install --locked takumi-cli\ntakumi image card.html -o card.png\ntakumi pdf report.html -o report.pdf\n```\n"
    filename: publish-takumi-cli.md
    v: 0.0.0
