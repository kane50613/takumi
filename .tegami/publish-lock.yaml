core:changelogs:
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: patch\n---\n\n# Skip emoji scanning for plain text\n\n`extractEmojis` segments text into graphemes only when it holds an `Extended_Pictographic` or `Regional_Indicator` codepoint or a keycap mark (U+20E3). A 48-card dashboard without emoji goes through it in 0.02 ms instead of 0.33 ms per render.\n"
    filename: helpers-emoji-skip.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: patch\n---\n\n# Pick font subsets faster\n\n`subsetFonts`, which every render with `fonts` runs, finds the subsets the text needs by binary search instead of checking every character against every range. With Noto Sans JP, Noto Sans TC, and Inter from Google Fonts, it takes 0.3 ms per render instead of 3.6 ms.\n"
    filename: helpers-subset-search.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/core\":\n    type: patch\n---\n\n# Read node trees off the main thread\n\n`render`, `renderSvg`, and `measure` pass a node tree to the native renderer as JSON when it holds only plain values. The renderer parses it on a worker thread, so a 48-card dashboard blocks the event loop for 0.1 ms instead of 0.7 ms and renders about 10% faster. Trees holding bytes or other values JSON cannot keep are read as before.\n"
    filename: napi-json-nodes.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi:\n    type: patch\n---\n\n# Keep no fragment items for hidden subtrees\n\nLaying out a `display: none` box no longer keeps fragment items for the boxes under it, which paint never reads. A hidden 48-card panel costs 0.3 ms instead of 2.1 ms per render.\n"
    filename: hidden-fragments.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi:\n    type: patch\n---\n\n# Shape repeated text once per render\n\nText that several boxes repeat with the same style is shaped once per render again. A box that reused another's measurement used to drop the shared shape after drawing, so every later box shaped it anew.\n"
    filename: shared-shape-owners.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-html:\n    type: patch\n  takumi:\n    type: patch\n---\n\n# Parse repeated inline styles once\n\n`from_html` parses each distinct `style` attribute once per document and reuses it for every element that repeats it. A dashboard of 48 cards with shared styles builds in half the time.\n"
    filename: html-style-reuse.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi:\n    type: patch\n---\n\n# Scale images faster\n\nBilinear image scaling mixes eight pixels at a time in vector lanes, with the same pixels as before. Real templates render about 5% faster.\n"
    filename: bilinear-runs.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: patch\n---\n\n# Composite pixels faster\n\nBlending, masking and PNG scanline work run in 16-bit vector lanes, with the same pixels as before. Real templates render about 3% faster.\n"
    filename: vectorized-compositing.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi:\n    type: patch\n---\n\n# Read repeated style values once\n\nReading a node tree parses each distinct style value once per property and reuses it wherever the tree repeats it. A 48-card dashboard reads its styles in 0.16 ms instead of 0.26 ms.\n"
    filename: style-value-reuse.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: patch\n---\n\n# Redraw rounded boxes faster\n\nA rounded background drawn at the same place and size as in an earlier render reuses its rasterized mask from the glyph cache. A mask may take at most `glyph_cache::max_entry_bytes`, a 32nd of the budget. `PathCommand::digest` hashes a path for such keys.\n"
    filename: shape-mask-cache.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi:\n    type: patch\n---\n\n# Rasterize inline SVG images once\n\nAn `<img>` whose `src` is SVG markup now goes through the render's image cache, as `data:` URIs already do. Repeated renders reuse its parsed tree and rasters instead of redrawing them. Real templates render about 3% faster.\n"
    filename: inline-svg-cache.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi:\n    type: patch\n---\n\n# Parse inline styles faster\n\nA CSS value that fails one way of parsing no longer builds an error message before trying the next. Building nodes from HTML with inline styles takes about 40% less time.\n"
    filename: lazy-css-errors.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi:\n    type: patch\n---\n\n# Encode lossless WebP faster\n\nLossless WebP encodes about 40% faster, for files about 11% larger. The pixels are the same.\n"
    filename: webp-lossless-effort.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n# Divide by 255 in 16 bits\n\n`div_255` and `mul_div_255` replace `fast_div_255` and `fast_div_255_u32`. Both take bytes or byte products, so their arithmetic fits 16-bit vector lanes.\n"
    filename: div-255-u16.md
    v: 0.0.0
