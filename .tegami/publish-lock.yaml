core:changelogs:
  - content: "---\npackages:\n  takumi-pdf:\n    type: patch\n  \"@takumi-rs/wasm\":\n    type: patch\n  takumi-js:\n    type: patch\n  \"@takumi-rs/image-response\":\n    type: patch\n---\n\n### Resolve a browser-only entry in client builds\n\nBundlers that resolve the `browser` condition (Vite client, webpack web) now\nget `bundlers/browser.mjs`, which only fetches the `.wasm` asset by `import.meta.url`. Client builds\nwith `noExternal` stop failing with `Cannot bundle Node.js built-in \"node:fs/promises\"`.\nThe Vite server entry reads the asset through `process.getBuiltinModule`, so\nno bundler sees a Node import. These packages, plus `takumi-js` and `@takumi-rs/image-response` on top of them, now require Node 20.19 or newer.\n"
    filename: vite-client-noexternal.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-raster:\n    type: patch\n---\n\n### Crop `object-fit: cover` the way the other backends do\n\nA length `object-position` under `cover` or `none` now shifts the image the same direction as the SVG and PDF output. Keyword and percentage positions are unchanged.\n"
    filename: object-fit-placement.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n### Report a capped WebP animation as unfinished\n\nA WebP stream cut at the frame cap now reports the same unfinished flag as APNG and GIF instead of claiming it ended.\n"
    filename: webp-frame-cap.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n### Rename the background layer inputs\n\n`BackgroundLayerInput::resolve` and `BackgroundLayersInput::resolve` replace the `Resolve*` structs and free functions.\n"
    filename: background-layer-input.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n### Drop unused paint re-exports\n\n`takumi_core::paint` no longer re-exports the tile position helpers, the gradient row states, or `LinearGradientFastPath`; a few layout helpers are crate-private now.\n"
    filename: api-prune.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n### Clip animation frames that start outside the canvas\n\nA GIF or WebP frame whose origin lies beyond the logical screen no longer panics the decoder. The frame is clipped away instead, as browsers do.\n"
    filename: frame-outside-canvas.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n### Build gradient tables through ColorLut\n\nGradient tiles carry one `lut: ColorLut`. `ResolvedGradientStop::resolve` and `ColorLut::new` replace the free functions.\n"
    filename: gradient-lut.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n### Move the border helpers onto their types\n\n`side_bands`, `border_dash_pattern`, `inset_size`, and `rect_offset` are now methods on `BorderProperties`, `BorderStyle`, `Size`, and `Rect`.\n"
    filename: border-methods.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n### Name the values the paint helpers pass around\n\n`BorderStyle::dash_pattern` returns a `BorderDash`. `resolve_inline_runs`, `inline_background_path`, `glyph_outlines`, and `run_decorations` are methods on `BuiltInlineLayout`, `InlineBackgroundFragment`, and `ShapedRun`.\n"
    filename: named-values.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n### Read render settings through RenderContext methods\n\n`time_ms`, `draw_debug_border`, and `dither_gradients` are methods now. `RenderContext::builder()` is unchanged.\n"
    filename: render-context-shared.md
    v: 0.0.0
