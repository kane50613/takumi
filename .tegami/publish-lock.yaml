core:changelogs:
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A forced break after a box with an absolute box running on applies once\n\nWhen an absolutely positioned box ran on past the page from inside a box with `break-after: page`, the forced break applied again on the next page, so a float after the box landed a page later than in Chromium. It now applies once, where the box's content ends.\n"
    filename: break-after-once-past-block-end.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# Long documents share more of their layout styles\n\nBoxes with equal layout styles now share one copy across a longer run of the document, so a table that repeats a row's styles keeps one copy of each. An 11,000-row PDF peaks at 939 MB of heap in place of 1,073 MB, with the same bytes.\n"
    filename: layout-style-sharing.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-raster:\n    type: patch\n  takumi-svg:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# An inline element that is positioned or a stacking context paints as a layer of its own\n\nA `display: inline` element with `position`, `opacity`, `filter`, `mix-blend-mode`, `clip-path`, or `mask` now paints as a layer of its own, as Chrome paints it. Its backgrounds, its text, and the boxes inside it, floats and inline-blocks included, composite together after the content around it. The layer's box is the union of the element's line boxes, which approximates Chrome, where each line's box stays apart. Before, `opacity` faded each line and each text run on its own, and the other properties did nothing. A text node with a style of its own now opens an inline box as a span does. In the paint tree, such an element is a box with `effects`, and its line boxes and its own text node are its children. `NodePaint::inline_layer`, `InlineLayer`, and `OwnContent::InlineLayer` are new, and `InlineBrush` no longer has an `opacity` field.\n"
    filename: inline-opacity-group.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A long table in a column flexbox renders with less time and memory\n\nA column flexbox that broke across pages laid each item out in full once more before laying it out page by page, and kept every layout inside the item until the flexbox ended. It now reuses the item's measure for that pass, as Chromium does, and frees what the item holds as its pages are drawn. An 11,000-row table in a column flexbox peaks at 1.35 GB in place of 1.46 GB, with the same PDF.\n"
    filename: flex-item-measure-reuse.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A floated flex or grid item no longer floats\n\n`float` does not apply to a flex or grid item, but an item with `float: left` or `right` was still treated as a float when breaking, so its `break-after` was dropped and the container's background stopped short on the next page. Such an item now lays out as any other item, as in Chromium.\n"
    filename: flex-grid-items-do-not-float.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-pdf:\n    type: minor\n---\n\n# `display: contents` renders an element's children in its place\n\nAn element with `display: contents` generates no box, so its children and its `::before` and `::after` lay out as children of its parent, and still inherit from it. A flex or grid container takes those children as its items. Replaced elements and form controls render nothing with it, and the root element computes to `block`, as in browsers. The Tailwind `contents` class sets it.\n\nBefore, the value was not recognized and the declaration was dropped.\n"
    filename: display-contents.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A flex row whose item margin runs past the page moves to the next page whole\n\nA flex row whose item margin ran past the end of the page stayed on that page and spilled onto the next, because breaking measured only how far the items reached. Breaking now measures the box's own block size too, as Chromium does, so the row moves to the next page whole when it fits there.\n"
    filename: fragment-block-size-for-breaking.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A forced break inside a flex or grid item reaches past the container\n\nA `break-after: page` on the last child of a flex or grid item, or on the last row of a table inside one, was dropped, so the content after the container stayed on the same page. It now propagates out through the item and the table, as Chromium does, and the content after the container starts a new page.\n"
    filename: flex-grid-item-break-after.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# An `<img>` without a source stays whole across pages\n\n`from_html` turned an `<img>` with no `src` into an empty box, so a tall one split across two pages. It is now a replaced element with no pixels, as HTML renders an image that represents nothing, so it moves to the next page whole when it does not fit, as in Chromium. It lays out at the same size as before.\n"
    filename: img-without-source-replaced.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# Long documents with a positioned box in a box broken across every page render in linear time\n\nWhen an absolutely positioned box sat in a box broken across every page, and the box's containing block placed it on the last page, every page painted from the layout of the whole document. Rendering time grew with the square of the page count: a 2,000-row table took 49 seconds. Each page now paints from its own page and its neighbors, and the same table renders in 3 seconds, with the same PDF.\n"
    filename: paged-positioned-box-window.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi-raster:\n    type: minor\n  takumi-svg:\n    type: minor\n  takumi-pdf:\n    type: minor\n---\n\n# `paint-order: stroke` draws `-webkit-text-stroke` under the text\n\nOn HTML text, `paint-order: stroke` or `stroke fill` now draws the stroke first and the fill on top, as Chrome does, so a thick outline no longer eats into the letters. The fill and the stroke each paint over a whole run, as in Chrome, so with `normal` a letter's fill no longer covers the previous letter's stroke where they overlap. Images, SVG output, PDFs, and the paint tree all follow it. `PaintOrder::text_phases` returns the order, and `InlineBrush` carries the run's `paint_order`.\n"
    filename: text-paint-order.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n  takumi-pdf:\n    type: patch\n---\n\n# A `break-inside: avoid` box stays on its page when only an absolute box inside it runs past\n\nWhen an absolutely positioned box inside a `break-inside: avoid` box started past the end of the page, the whole box moved to the next page, even though it fit. It now stays where it fits, and only the absolute box continues on the next page, as Chromium prints it.\n"
    filename: avoid-break-out-of-flow-overflow.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n  takumi-cli:\n    type: patch\n---\n\n# A `<style media>` element's `@import` rules load\n\n`ParsedHtml::styles` lists each `<style>` element with its text and `media` apart, and `StyleElement::css` wraps the text in the `@media` rule that `ParsedHtml::css` holds. The `takumi` command now loads the `@import` rules of a `<style>` element with a `media` attribute and applies them under that media, as Chrome does. Before, it dropped them.\n"
    filename: style-element-media.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: patch\n---\n\n# `takumi upgrade` finds a Windows install and keeps crates.io installs on crates.io\n\n`takumi upgrade` now recognizes `takumi.exe` in Cargo's install record, so a Windows install no longer reads as one Cargo did not make. On Windows it prints the command to run in PowerShell once takumi exits, since Windows cannot replace a running program, and every command it prints on Windows is quoted for PowerShell. A crates.io install reinstalls with `--registry crates-io`, so a configured default registry cannot take its place. A Git URL's password, and its user name unless the URL uses SSH, no longer appear in the printed command.\n"
    filename: cli-upgrade-windows.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# `takumi completions` writes a shell completion script\n\n`takumi completions zsh` writes a script that completes takumi's commands, flags, and their values when you press Tab, and bash, fish, PowerShell, and elvish get one too. `--root` and `--allow-read` complete only directories.\n"
    filename: cli-completions.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# `--log` prints what a render did\n\n`--log info` prints a timed line to standard error for each stage of a render, and `--log debug` adds each resource loaded, each page and why it ended, the CSS the parser dropped, and each font family or image the render found missing.\n"
    filename: cli-log.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# `takumi` warns of unsupported properties, and `--deny-warnings` fails on any warning\n\nA declaration whose property takumi does not support, such as a misspelled one, now prints a warning with its line and column. Properties that cannot change a render, such as `cursor`, stay in `--log debug`. `--deny-warnings` exits with `1` and writes no output when the command raised a warning.\n"
    filename: cli-deny-warnings.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# The `takumi` command line is on crates.io\n\n`cargo install --locked takumi-cli` installs the `takumi` command, which renders an HTML file to a PNG, JPEG, WebP, SVG, or PDF. A document reads only the directories you grant, and never the network.\n"
    filename: publish-takumi-cli.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi:\n    type: minor\n  takumi-core:\n    type: minor\n  takumi-cli:\n    type: patch\n---\n\n# `takumi image` warns of the characters no font draws\n\n`takumi image` now prints a warning that names each character no loaded font draws, where it drew an empty box without a word. `uncovered_characters` in `takumi` returns the same list for a node. The command line also lists a file that is not there as `missing` in `--list-resources`, refuses a `--margin` or `--page` number without a unit, and points to `--font`, `--root`, or `takumi pdf` in the errors those fix.\n"
    filename: cli-diagnostics.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-cli:\n    type: minor\n---\n\n# `takumi paint` writes what a render draws, as text or JSON\n\n`takumi paint card.html -o -` prints one line for each box, text, and image of the document: where it lands, what fills it, and whether it lies off the canvas, has no area, or draws nothing. Elements that `opacity: 0` hides are listed after the outline. `--detail drawables` and `--detail full` add each thing a node draws and the paint order, and `--format json` writes the paint tree takumi-paint returns.\n"
    filename: cli-paint.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n---\n\n# `parse_html` reports the style sheets a document links\n\n`ParsedHtml` now lists each `<link rel=\"stylesheet\">` in `links` and the first `<base href>` in `base_href`, so a host can fetch linked CSS and resolve it as a browser does. `ParsedHtml::css_with_links` takes a fetch function and returns the CSS of every `<style>` element and fetched link in document order, wrapping a link's `media` in an `@media` rule. Titled and alternate style sheets follow the preferred style sheet set, as in Chrome, so only the first set's `<style>` elements stay in `css`.\n"
    filename: html-linked-stylesheets.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n# Documents with attributes on most elements take less memory\n\nAn element keeps its attributes as a list in place of a map, which took 368 bytes for even one attribute. An 11,000-row PDF whose elements each carry a `data-` attribute peaks at 994 MB of heap in place of 1,073 MB, with the same bytes.\n"
    filename: compact-attributes.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n# `FromHtmlOptions` can parse a fragment as a whole document\n\n`FromHtmlOptions::builder().document(true)` parses the source as a browser opens an HTML file, with `html` and `body` elements, even when it starts with neither a doctype nor `<html>`. Rules such as `body { font-family: … }` then match. Without it, such a source still parses as a fragment.\n"
    filename: html-document-option.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n# A negative `calc()` padding clamps to zero\n\nA `padding` written as a `calc()` that comes out negative, such as `calc(0px - 4px)`, was applied as a negative padding. It is now clamped to zero, as browsers do.\n"
    filename: negative-calc-padding.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n# An inline element's background and border are a box in the paint tree\n\nAn element with `display: inline` and a `background` or `border` now has a box node in the paint tree, one for each line it sits on, with the element and its `InlineBackground` and `Border` drawables. Before, those drawables were part of the enclosing text node and no box named the element, where a `display: inline-block` one had a box.\n"
    filename: inline-box-paint-node.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n---\n\n# The paint tree lists the elements painting skips\n\n`PaintDocument::unpainted` names each element that `opacity: 0` hides along with everything inside it. Those elements have no node, so the list is where a reader finds why one is absent.\n"
    filename: paint-tree-unpainted.md
    v: 0.0.0
