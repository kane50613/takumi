core:changelogs:
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: patch\n---\n\n### Collect `<head>` styles and decode character references in `fromHtml`\n\n`fromHtml` skipped the whole `<head>` subtree, so a full document lost every `<style>` rule while the same markup as a fragment kept them. `<style>` tags inside `<head>` now land in `stylesheets` for both `fromHtml` and `fromJsx`. Text nodes also decode HTML character references, so `&nbsp;`, `&deg;` and `&#176;` render as the characters instead of the raw source.\n"
    filename: from-html-head-style-and-entities.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n### Accept `text-decoration: none`\n\n`none` is the initial value of `text-decoration-line`, but the parser rejected it and failed the whole render. Both `text-decoration` and `text-decoration-line` now parse `none` as no decoration.\n"
    filename: text-decoration-none.md
    v: 0.0.0
