core:changelogs:
  - content: "---\npackages:\n  npm:takumi-js:\n    type: major\n  npm:@takumi-rs/helpers:\n    type: major\n  npm:@takumi-rs/core:\n    type: major\n  npm:@takumi-rs/wasm:\n    type: major\n---\n\n### Replace `fetchResources`/`extractResourceUrls` with `prepareImages`\n\n`@takumi-rs/helpers` exports `prepareImages({ node, sources?, fetchCache?, fetch?, timeout? })`,\nwhich collects a node tree's remote images and fetches the ones not already supplied. Pass a\n`fetchCache` (a `Map<string, Promise<ArrayBuffer>>`, or any `Map`-like store) to coalesce\nconcurrent fetches of the same URL and reuse the bytes across renders; a failed fetch is\nevicted so a later call retries.\n\nThe `extractResourceUrls` and `fetchResources` helpers are removed. The `images` render option\ntakes the same group form: `{ sources, fetchCache, fetch, timeout }`.\n"
    filename: prepare-images-helper.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@takumi-rs/helpers:\n    type: patch\n---\n\n### Keep elements as containers when children carry no text\n\nAn element whose children resolved to a textless iterable (e.g. `{[]}`) became an\nempty text node instead of a container, so its `background` and other box styles\nnever painted. Such elements now stay containers.\n"
    filename: empty-array-children-background.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-svg:\n    type: minor\n  cargo:takumi-css:\n    type: minor\n---\n\n### Render backdrop-filter in the SVG backend\n\nSVG has no native backdrop source, so the backdrop is the scene replayed up to\nthe element, run through an SVG `<filter>` chain, then clipped to the border\nbox and attenuated by the element's mask and clip-path. Adds\n`ComputedStyle::has_shape_mask` and `Filter::is_drop_shadow`.\n"
    filename: svg-backdrop-filter.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-raster:\n    type: patch\n---\n\n### Clip backdrop-filter output by the node's mask and clip-path\n\nThe filtered backdrop painted across the whole border box even when the node\nhad a `mask` or `clip-path`, unlike browsers where the mask applies to the\nfiltered backdrop too. The backdrop composite is now attenuated by the node\nmask, and a fully masked-out node skips the backdrop filter entirely.\n"
    filename: backdrop-filter-mask.md
    v: 0.0.0
