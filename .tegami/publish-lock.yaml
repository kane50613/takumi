core:changelogs:
  - content: "---\npackages:\n  takumi-pdf:\n    type: minor\n---\n\n# The `takumi-pdf` crate is on crates.io\n\nRust programs can depend on `takumi-pdf` to write PDFs with selectable text, as the `takumi-pdf` npm package does. Its `render`, `measure`, and `needs` take the node tree, fonts, and stylesheet types from `takumi-core`.\n"
    filename: publish-takumi-pdf.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n# An inline `<svg>` draws whole at a `devicePixelRatio` above one\n\nAn inline `<svg>` with a `viewBox` used to scale its shapes by the device pixel ratio twice, so at `devicePixelRatio: 2` only the top-left quarter showed. Its user units are now CSS pixels at any ratio, as Chromium draws them.\n"
    filename: inline-svg-device-pixel-ratio.md
    v: 0.0.0
