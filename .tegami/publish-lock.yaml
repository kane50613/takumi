core:changelogs:
  - content: "---\npackages:\n  cargo:takumi-html:\n    type: minor\n  cargo:takumi:\n    type: minor\n---\n\n### Add `takumi-html` for parsing HTML into a node tree\n\nNew `takumi-html` crate parses HTML + Tailwind markup into a node tree with\n`from_html(source, FromHtmlOptions)`, mirroring the JS `fromHtml`. The `tw`,\n`style`, `class`, `id`, `dir`, and `lang` attributes map to node styling and\nmetadata; `FromHtmlOptions` sets the `StylePresets` table and a `max_depth`\nnesting cap. The `takumi` umbrella re-exports it under the `from-html` feature\nas `takumi::from_html`, plus `Node::from_html` via the `FromHtml` prelude\ntrait.\n"
    filename: node-from-html.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-css:\n    type: patch\n---\n\n### Serialize filter, grid track, and gradient values as valid CSS\n\n`filter`/`backdrop-filter` and grid track lists were comma-joined\n(`blur(3px), grayscale(0.5)`, `50px, 100px`) where CSS wants spaces, via the\nshared `Vec` serializer. `ToCss` now carries a per-type `LIST_SEPARATOR`\n(default `, `), overridden to a space for `Filter` and `GridTemplateComponent`.\nLinear, radial, and conic gradients also placed the color-interpolation method\nafter a comma (`to right, in srgb`); it now sits in the leading clause\n(`to right in srgb`). The output re-parses instead of dropping these\nproperties.\n"
    filename: gradient-filter-grid-serialization.md
    v: 0.0.0
