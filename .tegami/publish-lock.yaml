core:changelogs:
  - content: "---\npackages:\n  cargo:takumi-core:\n    type: patch\n---\n\n### Stop blend isolation from clipping text descenders\n\nInclude plain text nodes' glyph ink in scene paint bounds; `mix-blend-mode` on a text node no longer cuts glyphs that overflow the line box. Bounds now report unknown instead of underestimating for styles whose ink extent is not measured (shadows, outlines, text strokes), falling back to full-viewport isolation.\n"
    filename: scene-paint-bounds-text-ink.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-core:\n    type: patch\n---\n\n### Sample conic gradients deterministically\n\nReplace the per-pixel libm `atan2` in conic gradient sampling with Skia's `xy_to_unit_angle` polynomial, so every platform renders identical conic output and sampling gets cheaper.\n"
    filename: deterministic-paint-math.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-raster:\n    type: patch\n---\n\n### Raise the lossless WebP compression effort\n\nEncode `WebPLossless` at effort 50 instead of 20, shrinking output by about 10% at 1.5x the encode time. Drop the `alpha_compression` assignment, which libwebp never read on either path.\n"
    filename: webp-lossless-effort.md
    v: 0.0.0
  - content: "---\npackages:\n  cargo:takumi-raster:\n    type: patch\n---\n\n### Encode lossless WebP without a YUV420 round trip\n\nSet `use_argb` on the imported picture so `WebPLossless` and lossless animated WebP keep their source pixels instead of passing through chroma subsampling.\n"
    filename: webp-lossless-use-argb.md
    v: 0.0.0
