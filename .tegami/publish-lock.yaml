core:changelogs:
  - content: "---\npackages:\n  takumi-core:\n    type: minor\n  takumi:\n    type: minor\n  \"@takumi-rs/helpers\":\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-paint:\n    type: minor\n  takumi-pdf:\n    type: minor\n---\n\n# Release fonts a renderer no longer needs\n\n`unregisterFont({ name })` removes a family with all its `unicodeRange` subsets, and `clearFonts()` goes back to the bundled fallback font. A later render that lists a released font registers it again. In Rust, use `Fonts::unregister_family`.\n"
    filename: unregister-fonts.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@takumi-rs/helpers\":\n    type: minor\n  \"@takumi-rs/core\":\n    type: minor\n  \"@takumi-rs/wasm\":\n    type: minor\n  takumi-paint:\n    type: minor\n  takumi-pdf:\n    type: minor\n---\n\n# Bound render fonts with `fontCacheMaxBytes`\n\nPast this cap in decoded font bytes, a renderer releases the least recently used fonts that renders' `fonts` lists loaded, and a later render loads them again. Fonts from `registerFont` stay, and a running render keeps the fonts it started with. The wasm `Renderer` now passes its options, such as `cacheMaxBytes`, to the native renderer.\n"
    filename: font-cache-max-bytes.md
    v: 0.0.0
  - content: "---\npackages:\n  takumi-core:\n    type: patch\n---\n\n# Draw an inline image inside its margins\n\nAn `<img>` or other replaced element in a line of text was drawn across its margins, stretched and with its border and background reaching into them. It now draws in its border box, and its margins stay empty space on the line.\n"
    filename: inline-image-margins.md
    v: 0.0.0
