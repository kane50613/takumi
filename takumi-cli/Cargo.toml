[package]
name = "takumi-cli"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Renders HTML and CSS to images, SVG, and PDF from the command line."
repository = "https://github.com/kane50613/takumi"
rust-version = "1.91"
keywords = ["html", "css", "pdf", "image", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["npm/"]

[[bin]]
name = "takumi"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/takumi-cli@{ version }/takumi-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/takumi-cli@{ version }/takumi-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/takumi-cli@{ version }/takumi-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
cap-std = "3"
encoding_rs = "0.8"
clap_complete = "4.6"
cssparser.workspace = true
data-url.workspace = true
log.workspace = true
serde_json.workspace = true
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.clap]
workspace = true

[dependencies.takumi]
path = "../takumi"
version = "2.22.1"
features = ["from-html", "svg-backend"]

[dependencies.takumi-core]
path = "../takumi-core"
version = "0.39.0"
default-features = false
features = ["paint-tree"]

[dependencies.takumi-pdf]
path = "../takumi-pdf"
version = "0.21.3"

[lints]
workspace = true
